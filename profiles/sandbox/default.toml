# Das Sandbox-Profil des Normalfalls (ADR-002).
#
# Die Datei ist die vollstaendige Politik der Sandbox: was eingehaengt wird, was
# das Netz-Namespace erreicht, was der Shim vor seccomp aufmacht und welche
# Umgebung der Agent vorfindet. Aus ihr entsteht deterministisch eine einzige
# bwrap-Kommandozeile, die die Oberflaeche woertlich anzeigt
# (`humanitl sandbox argv`). Wer wissen will, was die Sandbox tut, liest diese
# Datei und die Zeile, nicht den Quelltext.
#
# Drei Quellen fuellen die Sandbox, und nur diese drei:
#
#   1. diese Datei,
#   2. der Beitrag des Agent-Adapters (HUM-037): seine Umgebungsvariablen und
#      die Dateien, die er als `--ro-bind-data` mitbringt, jede aus einem
#      versiegelten memfd und keine unter /work,
#   3. der Konfigurationsschluessel `sandbox.env` fuer weitere Variablen.
#
# Was aus keiner dieser drei kommt, gibt es in der Sandbox nicht. Ein Host-Pfad
# kommt nur ueber diese Datei herein und wird zusaetzlich gegen eine fest
# verdrahtete Denylist geprueft (SANDBOX_006); der Adapter kann keinen Mount
# hinzufuegen, keine Bridge und keine seccomp-Familie. Die fuenf Variablen des
# Shims stehen ueber allen dreien. `humanitl sandbox argv` zeigt das Ergebnis
# Argument fuer Argument, also auch den Beitrag des Adapters.
version = 1
name = "default"
description = "bwrap sandbox: no network interface, one proxy socket, seccomp after bridge"

[sandbox]
backend = "bwrap"
hostname = "sandbox"
# Entspricht --unshare-all; ausgeschrieben, damit die Zeile lesbar bleibt.
# Keine Auswahl: ein Profil, das einen Namensraum weglaesst, wird abgelehnt.
unshare = ["user", "pid", "net", "ipc", "uts", "cgroup"]
die_with_parent = true
new_session = true
min_bwrap_version = "0.8.0"

[mounts]
# src wird zur Laufzeit gesetzt (SessionContext.work_src); mode aus Config
# sandbox.work_mode. Ein "ro" im Profil laesst sich von der Sitzung nicht
# aufweichen, die strengere der beiden Angaben gilt.
work = { dst = "/work", mode = "rw" }
ro = ["/usr", "/etc/ssl", "/etc/alternatives", "/etc/ld.so.cache", "/etc/localtime"]
symlinks = [["usr/lib", "/lib"], ["usr/lib64", "/lib64"], ["usr/bin", "/bin"], ["usr/sbin", "/sbin"]]
tmpfs = ["/tmp", "/var/tmp", "/dev/shm", "/home/agent", "/work/.git/hooks", "/work/.vscode", "/work/.idea"]
proc = "/proc"
dev = "/dev"
# Werden als leere, nur lesbare Datei ueberdeckt.
masked_files = ["/work/.envrc", "/work/.git/config"]
# Nutzer-Erweiterung, gegen die Denylist geprueft. Kommt in der Zeile vor dem
# Projekt, dem Proxy-Socket, der CA und dem Shim: die liegen immer obenauf.
extra_ro = []
extra_rw = []

[network]
proxy_socket_dst = "/run/humanitl/proxy.sock"
proxy_port = 3128
ca_cert_dst = "/etc/humanitl/ca.crt"
shim_dst = "/run/humanitl/humanitl-shim"
# Die eine Tuer. Genau diese Bridge, nichts sonst: Name "proxy", Richtung "in" (Sandbox-TCP ->
# Host-UDS), 127.0.0.1 mit proxy_port, Ziel proxy_socket_dst. Jede weitere Bridge waere ein
# zweiter Listener auf einen zweiten Unix-Socket, denn der Shim oeffnet, was hier steht; ein
# Profil, das eine zweite nennt, wird mit CONFIG_003 abgelehnt, Richtung "out" mit SANDBOX_007
# (spaeter Browser-CDP, Profil browser, ADR-016).
bridges = [{ name = "proxy", dir = "in", listen = "127.0.0.1:3128", socket = "/run/humanitl/proxy.sock" }]

[seccomp]
# Erlaubte Socket-Familien nach dem Bridge-Start. Kein Vorschlag, sondern ein Boden in beide
# Richtungen: genau diese zwei, sonst wird das Profil mit CONFIG_003 abgelehnt. AF_INET/AF_INET6
# sind noetig (Loopback zum Proxy), und das Netz-Namespace hat nur lo, darum ist das sicher.
# AF_UNIX kommt erst mit dem Profil "browser" (M7, Chromium-IPC) und dann ueber
# SocketFloor::BrowserUnixIpc im Code des Launchers, nie ueber diese Datei.
allow_families = ["AF_INET", "AF_INET6"]
# Ebenso ein Boden: genau SOCK_STREAM. SOCK_DGRAM und SOCK_RAW bleiben in jedem Profil EPERM
# (arg1 & 0xff), auch im spaeteren "browser": UDP waere DNS und QUIC an der Aufzeichnung vorbei.
allow_types = ["SOCK_STREAM"]
# Der Boden: ein Profil darf weitere Syscalls verbieten, aber keinen von hier streichen.
deny_syscalls = [
  "ptrace",
  "io_uring_setup",
  "io_uring_enter",
  "io_uring_register",
  "process_vm_readv",
  "process_vm_writev",
  "keyctl",
  "add_key",
  "request_key",
  # Standard-Haertung, wie im Docker-Standardprofil (HUM-012, sprint-1.md):
  # kein neuer Kern, keine Kernmodule, kein BPF, keine fremden Ereigniszaehler,
  # keine selbst bedienten Seitenfehler.
  "kexec_load",
  "kexec_file_load",
  "init_module",
  "finit_module",
  "delete_module",
  "bpf",
  "perf_event_open",
  "userfaultfd",
]

[env]
HOME = "/home/agent"
USER = "agent"
TERM = "xterm-256color"
LANG = "C.UTF-8"
PATH = "/usr/local/bin:/usr/bin:/bin"
HTTP_PROXY = "http://127.0.0.1:3128"
HTTPS_PROXY = "http://127.0.0.1:3128"
http_proxy = "http://127.0.0.1:3128"
https_proxy = "http://127.0.0.1:3128"
ALL_PROXY = "http://127.0.0.1:3128"
NO_PROXY = ""
no_proxy = ""
SSL_CERT_FILE = "/etc/humanitl/ca.crt"
SSL_CERT_DIR = "/etc/ssl/certs"
CURL_CA_BUNDLE = "/etc/humanitl/ca.crt"
REQUESTS_CA_BUNDLE = "/etc/humanitl/ca.crt"
NODE_EXTRA_CA_CERTS = "/etc/humanitl/ca.crt"
DENO_CERT = "/etc/humanitl/ca.crt"
GIT_SSL_CAINFO = "/etc/humanitl/ca.crt"
CARGO_HTTP_CAINFO = "/etc/humanitl/ca.crt"
PIP_CERT = "/etc/humanitl/ca.crt"
NPM_CONFIG_CAFILE = "/etc/humanitl/ca.crt"
NIX_SSL_CERT_FILE = "/etc/humanitl/ca.crt"
AWS_CA_BUNDLE = "/etc/humanitl/ca.crt"
HUMANITL = "1"
