# Das Sandbox-Profil des Normalfalls (ADR-002).
#
# Die Datei ist die vollstaendige Politik der Sandbox: was eingehaengt wird, was
# das Netz-Namespace erreicht, was der Shim vor seccomp aufmacht und welche
# Umgebung der Agent vorfindet. Aus ihr entsteht deterministisch eine einzige
# bwrap-Kommandozeile, die die Oberflaeche woertlich anzeigt
# (`humanitl sandbox argv`). Wer wissen will, was die Sandbox tut, liest diese
# Datei und die Zeile, nicht den Quelltext.
#
# Was hier NICHT steht, gibt es nicht: es gibt keinen zweiten Weg, einen Mount
# oder eine Variable in die Sandbox zu bringen. Host-Quellen werden zusaetzlich
# gegen eine fest verdrahtete Denylist geprueft (SANDBOX_006).
version = 1
name = "default"
description = "bwrap sandbox: no network interface, one proxy socket, seccomp after bridge"

[sandbox]
backend = "bwrap"
hostname = "sandbox"
# Entspricht --unshare-all; ausgeschrieben, damit die Zeile lesbar bleibt.
# Keine Auswahl: ein Profil, das einen Namensraum weglaesst, wird abgelehnt.
unshare = ["user", "pid", "net", "ipc", "uts", "cgroup"]
die_with_parent = true
new_session = true
min_bwrap_version = "0.8.0"

[mounts]
# src wird zur Laufzeit gesetzt (SessionContext.work_src); mode aus Config
# sandbox.work_mode. Ein "ro" im Profil laesst sich von der Sitzung nicht
# aufweichen, die strengere der beiden Angaben gilt.
work = { dst = "/work", mode = "rw" }
ro = ["/usr", "/etc/ssl", "/etc/alternatives", "/etc/ld.so.cache", "/etc/localtime"]
symlinks = [["usr/lib", "/lib"], ["usr/lib64", "/lib64"], ["usr/bin", "/bin"], ["usr/sbin", "/sbin"]]
tmpfs = ["/tmp", "/var/tmp", "/dev/shm", "/home/agent", "/work/.git/hooks", "/work/.vscode", "/work/.idea"]
proc = "/proc"
dev = "/dev"
# Werden als leere, nur lesbare Datei ueberdeckt.
masked_files = ["/work/.envrc", "/work/.git/config"]
# Nutzer-Erweiterung, gegen die Denylist geprueft. Kommt in der Zeile vor dem
# Projekt, dem Proxy-Socket, der CA und dem Shim: die liegen immer obenauf.
extra_ro = []
extra_rw = []

[network]
proxy_socket_dst = "/run/humanitl/proxy.sock"
proxy_port = 3128
ca_cert_dst = "/etc/humanitl/ca.crt"
shim_dst = "/usr/local/bin/humanitl-shim"
# Bridges, die der Shim vor seccomp startet. Richtung "in": Sandbox-TCP -> Host-UDS (Proxy).
# Richtung "out": Host verbindet UDS in der Sandbox -> Sandbox-TCP (spaeter Browser-CDP, Profil browser).
bridges = [{ name = "proxy", dir = "in", listen = "127.0.0.1:3128", socket = "/run/humanitl/proxy.sock" }]

[seccomp]
# Erlaubte Socket-Familien nach dem Bridge-Start. AF_INET/AF_INET6 sind immer noetig (Loopback zum Proxy);
# das Netz-Namespace hat nur lo, darum ist das sicher. AF_UNIX nur im Profil "browser" (Chromium-IPC).
allow_families = ["AF_INET", "AF_INET6"]
# SOCK_DGRAM/SOCK_RAW immer EPERM (arg1 & 0xff); Profil browser ergaenzt AF_UNIX und SOCK_DGRAM.
allow_types = ["SOCK_STREAM"]
# Der Boden: ein Profil darf weitere Syscalls verbieten, aber keinen von hier streichen.
deny_syscalls = [
  "ptrace",
  "io_uring_setup",
  "io_uring_enter",
  "io_uring_register",
  "process_vm_readv",
  "process_vm_writev",
  "keyctl",
  "add_key",
  "request_key",
]

[env]
HOME = "/home/agent"
USER = "agent"
TERM = "xterm-256color"
LANG = "C.UTF-8"
PATH = "/usr/local/bin:/usr/bin:/bin"
HTTP_PROXY = "http://127.0.0.1:3128"
HTTPS_PROXY = "http://127.0.0.1:3128"
http_proxy = "http://127.0.0.1:3128"
https_proxy = "http://127.0.0.1:3128"
NO_PROXY = ""
no_proxy = ""
SSL_CERT_FILE = "/etc/humanitl/ca.crt"
SSL_CERT_DIR = "/etc/ssl/certs"
CURL_CA_BUNDLE = "/etc/humanitl/ca.crt"
REQUESTS_CA_BUNDLE = "/etc/humanitl/ca.crt"
NODE_EXTRA_CA_CERTS = "/etc/humanitl/ca.crt"
DENO_CERT = "/etc/humanitl/ca.crt"
GIT_SSL_CAINFO = "/etc/humanitl/ca.crt"
CARGO_HTTP_CAINFO = "/etc/humanitl/ca.crt"
PIP_CERT = "/etc/humanitl/ca.crt"
NPM_CONFIG_CAFILE = "/etc/humanitl/ca.crt"
NIX_SSL_CERT_FILE = "/etc/humanitl/ca.crt"
