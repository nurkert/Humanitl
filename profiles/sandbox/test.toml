# Das Sandbox-Profil der Escape-Tests (CONVENTIONS.md 3.11).
#
# Gleich dem Profil "default", mit genau zwei Unterschieden: die Skripte aus
# `tests/escape/` sind unter `/tests/escape` nur lesbar eingehaengt, und
# `HUMANITL_TEST=1` steht in der Umgebung, damit ein Skript merkt, dass es in
# der Testsandbox laeuft. Es gibt keine Vererbung zwischen Profilen: eine
# Ausnahme, die man nicht sieht, waere in einem Sicherheitsprofil die falsche
# Sparsamkeit.
#
# Der Host-Pfad in `extra_ro` ist ein Platzhalter; der Testrunner (HUM-006)
# ersetzt ihn durch das echte Verzeichnis des Arbeitsbaums.
version = 1
name = "test"
description = "escape-test sandbox: like default, plus /tests/escape read-only"

[sandbox]
backend = "bwrap"
hostname = "sandbox"
unshare = ["user", "pid", "net", "ipc", "uts", "cgroup"]
die_with_parent = true
new_session = true
min_bwrap_version = "0.8.0"

[mounts]
work = { dst = "/work", mode = "rw" }
ro = ["/usr", "/etc/ssl", "/etc/alternatives", "/etc/ld.so.cache", "/etc/localtime"]
symlinks = [["usr/lib", "/lib"], ["usr/lib64", "/lib64"], ["usr/bin", "/bin"], ["usr/sbin", "/sbin"]]
tmpfs = [
  "/tmp", "/var/tmp", "/dev/shm", "/home/agent",
  "/work/.git/hooks",
  "/work/.vscode", "/work/.idea", "/work/.fleet",
  "/work/.github/workflows",
  "/work/.gitlab-ci.yml.d",
  "/work/.direnv",
  "/work/.humanitl",
]
proc = "/proc"
dev = "/dev"
masked_files = [
  "/work/.envrc", "/work/.env", "/work/.env.local",
  "/work/.git/config",
  "/work/.npmrc", "/work/.yarnrc", "/work/.yarnrc.yml", "/work/.pypirc",
  "/work/.gitlab-ci.yml", "/work/Jenkinsfile", "/work/.pre-commit-config.yaml",
]
unmask = []
extra_ro = ["/tests/escape"]
extra_rw = []

[network]
proxy_socket_dst = "/run/humanitl/proxy.sock"
proxy_port = 3128
ca_cert_dst = "/etc/humanitl/ca.crt"
shim_dst = "/run/humanitl/humanitl-shim"
bridges = [{ name = "proxy", dir = "in", listen = "127.0.0.1:3128", socket = "/run/humanitl/proxy.sock" }]

[seccomp]
# Erlaubte Socket-Familien nach dem Bridge-Start. Kein Vorschlag, sondern ein Boden in beide
# Richtungen: genau diese zwei, sonst wird das Profil mit CONFIG_003 abgelehnt. AF_INET/AF_INET6
# sind noetig (Loopback zum Proxy), und das Netz-Namespace hat nur lo, darum ist das sicher.
# AF_UNIX kommt erst mit dem Profil "browser" (M7, Chromium-IPC) und dann ueber
# SocketFloor::BrowserUnixIpc im Code des Launchers, nie ueber diese Datei.
allow_families = ["AF_INET", "AF_INET6"]
# Ebenso ein Boden: genau SOCK_STREAM. SOCK_DGRAM und SOCK_RAW bleiben in jedem Profil EPERM
# (arg1 & 0xff), auch im spaeteren "browser": UDP waere DNS und QUIC an der Aufzeichnung vorbei.
allow_types = ["SOCK_STREAM"]
deny_syscalls = [
  "ptrace",
  "io_uring_setup",
  "io_uring_enter",
  "io_uring_register",
  "process_vm_readv",
  "process_vm_writev",
  "keyctl",
  "add_key",
  "request_key",
  # Standard-Haertung, wie im Docker-Standardprofil (HUM-012, sprint-1.md):
  # kein neuer Kern, keine Kernmodule, kein BPF, keine fremden Ereigniszaehler,
  # keine selbst bedienten Seitenfehler.
  "kexec_load",
  "kexec_file_load",
  "init_module",
  "finit_module",
  "delete_module",
  "bpf",
  "perf_event_open",
  "userfaultfd",
]

[env]
HOME = "/home/agent"
USER = "agent"
TERM = "xterm-256color"
LANG = "C.UTF-8"
PATH = "/usr/local/bin:/usr/bin:/bin"
HTTP_PROXY = "http://127.0.0.1:3128"
HTTPS_PROXY = "http://127.0.0.1:3128"
http_proxy = "http://127.0.0.1:3128"
https_proxy = "http://127.0.0.1:3128"
ALL_PROXY = "http://127.0.0.1:3128"
NO_PROXY = ""
no_proxy = ""
SSL_CERT_FILE = "/etc/humanitl/ca.crt"
SSL_CERT_DIR = "/etc/ssl/certs"
CURL_CA_BUNDLE = "/etc/humanitl/ca.crt"
REQUESTS_CA_BUNDLE = "/etc/humanitl/ca.crt"
NODE_EXTRA_CA_CERTS = "/etc/humanitl/ca.crt"
DENO_CERT = "/etc/humanitl/ca.crt"
GIT_SSL_CAINFO = "/etc/humanitl/ca.crt"
CARGO_HTTP_CAINFO = "/etc/humanitl/ca.crt"
PIP_CERT = "/etc/humanitl/ca.crt"
NPM_CONFIG_CAFILE = "/etc/humanitl/ca.crt"
NIX_SSL_CERT_FILE = "/etc/humanitl/ca.crt"
AWS_CA_BUNDLE = "/etc/humanitl/ca.crt"
HUMANITL = "1"
HUMANITL_TEST = "1"
