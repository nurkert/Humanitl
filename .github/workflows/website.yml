name: Website

# humanitl.de: die statische Seite aus website/, gebaut mit Astro und über GitHub Pages
# ausgeliefert (HUM-333). Die Domain und der Pages-Modus "GitHub Actions" stehen in den
# Einstellungen des Repositorys.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # Die Docs-Seiten entstehen aus docs/ (HUM-336).
      - 'docs/**'
      - '.github/workflows/website.yml'
  # Ein neues Release erscheint sofort auf der Download-Seite. Ein Release aus release.yml
  # löst dieses Ereignis nicht aus (GITHUB_TOKEN startet keine Workflows); dort stößt der
  # Job release den Bau per workflow_dispatch an. Dieses Ereignis fängt Releases von Hand.
  release:
    types: [published]
  # Täglich neu, damit die Download-Zahlen und das Impressum aktuell bleiben.
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# So wenig Rechte wie nötig: das Repository lesen, über OIDC nach Pages ausliefern.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Die Markdown-Plugins der Docs an einem Fixture, auch für Hinweisboxen (HUM-336).
      - run: npm test
      - run: npm run build
        env:
          # Nur lesend, damit die Abfrage der Releases nicht an das Limit der API stößt.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Das Impressum liegt auf der Seite des Inhabers, nicht im Repository. Forks
          # setzen ihre eigene Variable IMPRINT_URL.
          IMPRINT_URL: ${{ github.repository == 'nurkert/Humanitl' && 'https://nurkert.de/impressum' || vars.IMPRINT_URL }}
      # Kein toter interner Link und kein toter Anker, auch nicht in den Docs (HUM-336).
      - run: npm run check-links
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
