# Humanitl continuous integration.
#
# Every gate that runs here is reachable from the Makefile, so a developer can
# reproduce it locally with one command. The difference is STRICT=1: locally the
# Makefile skips rustfmt and clippy when the toolchain was installed without
# rustup, here it must not.
#
# Jobs whose content arrives in a later issue are explicit skips. They print a
# notice and a line in the job summary naming the issue that fills them in. A
# placeholder that quietly reports success would be a green lie, and the sprint
# rule in BACKLOG.md 8 rests on the pipeline telling the truth.
#
# Branch protection (configured manually on the repository): `main` should
# require the single check `ci-ok` (HUM-424). Branch protection counts a
# skipped check as passed, and with the path rules below a failing `changes`
# job skips every heavy job; requiring the heavy jobs one by one would let
# such a run through in the UI. `ci-ok` runs always and fails unless changes
# and lint succeeded and every other job succeeded or was skipped by the path
# plan, the same rule tools/ci-gate.sh applies.
#
# Path rules (HUM-424). macOS minutes count tenfold, and on 2026-11-05 GitHub
# locked Actions for the account over the gross usage. The first job,
# `changes`, runs tools/ci-changes.sh and says which jobs this push needs:
#   - hum-* and macos-* branches compare with their merge base with
#     origin/main, main with the previous commit (github.event.before); an
#     unknown or rewritten previous commit means everything.
#   - website/** alone starts no heavy job. backlog/** and BACKLOG.md start
#     only rust-test (config_readers.rs reads them). docs/** and the Markdown
#     files at the root start only the Linux jobs that read them (rust-test,
#     flutter-analyze-test, deps-lint, parity-check).
#   - tools/**, scripts/**, .github/**, the Makefile, CHANGELOG.md (the
#     release commit often touches nothing else) and any unknown path start
#     everything.
#   - macos runs on a branch only for macOS-relevant changes (paths and
#     manifests named in tools/ci-changes.sh, or code that mentions macOS),
#     on main for every change to code. Before every tag the release dry run
#     of release.yml builds and checks macOS anyway.
#   - lint, changes and ci-ok run on every push.
# tools/ci-gate.sh accepts a skipped job only if `changes` succeeded and its
# step `skip <job>` ran; every other skip is red. The last job, `ci-ok`, says
# the same for branch protection. tools/release.sh wants a run
# on the release commit in which every job ran: when the push run of main
# skipped some, start this workflow by hand on main with full=true.
#
# Every action is pinned to a commit SHA; the release tag in the trailing
# comment is documentation. Bump both together, here and in .github/actions.

name: ci

on:
  push:
    # Issue branches `hum-NNN-slug` run the full pipeline before they are
    # merged: tools/commit-issue.sh --ci pushes the branch, waits for this run
    # through tools/ci-gate.sh and merges into main only on green (HUM-237).
    # main keeps its own run, because the release guard (release.yml) asks for
    # a green push run of exactly the tagged main commit.
    # `macos-*` is the feature branch of M12 (backlog/sprint-6.md), which
    # collects one commit per issue before it is merged (HUM-312).
    branches: [main, "hum-*", "macos-*"]
  pull_request:
  # A full run by hand, for tools/release.sh when the push run of the release
  # commit skipped jobs by the path rules (HUM-424). full=false applies the
  # path rules as a push would.
  workflow_dispatch:
    inputs:
      full:
        description: "Run every job, ignoring the path rules"
        type: boolean
        default: true

# One run per ref. On an issue branch a new push supersedes the one in flight;
# that is the amended commit after a red run.
#
# Not on main (HUM-238): every commit there is a merge that the release guard
# may tag, and it needs a green run of its own. Cancelling the run of the first
# of two quick merges would leave that merge without a verdict forever. Turning
# off cancel-in-progress alone is not enough: a concurrency group keeps at most
# one pending run and cancels the older pending one, so a third merge would
# still cost the second its run. On main the group therefore is the commit
# itself, and every merge gets its own run.
#
# The event is part of the group, so a full run started by hand (HUM-424) and
# the push run of the same main commit never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository. Jobs that need more
# raise it locally; none currently do.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # -D warnings is a CI-only tightening. Locally `make check` stays warning
  # tolerant so that work in progress still compiles.
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  STRICT: "1"

jobs:
  changes:
    name: changes
    # Which jobs this push needs (HUM-424). tools/ci-changes.sh holds the path
    # rules; every heavy job below has `needs: changes` and runs only when its
    # output is 'true'. A failing changes job skips them all and turns the run
    # red, never green.
    #
    # The steps `skip <job>` are the record tools/ci-gate.sh reads: a job may
    # conclude `skipped` only when this job succeeded and its step `skip <job>`
    # ran. Step outputs are not in the public API, step conclusions are.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust-check: ${{ steps.areas.outputs.rust-check }}
      rust-test: ${{ steps.areas.outputs.rust-test }}
      macos: ${{ steps.areas.outputs.macos }}
      deps-lint: ${{ steps.areas.outputs.deps-lint }}
      proto-lint-and-gen: ${{ steps.areas.outputs.proto-lint-and-gen }}
      flutter-analyze-test: ${{ steps.areas.outputs.flutter-analyze-test }}
      goldens: ${{ steps.areas.outputs.goldens }}
      escape-tests: ${{ steps.areas.outputs.escape-tests }}
      escape-tests-podman: ${{ steps.areas.outputs.escape-tests-podman }}
      e2e: ${{ steps.areas.outputs.e2e }}
      e2e-xvfb: ${{ steps.areas.outputs.e2e-xvfb }}
      e2e-agent: ${{ steps.areas.outputs.e2e-agent }}
      e2e-m4: ${{ steps.areas.outputs.e2e-m4 }}
      e2e-m4-package: ${{ steps.areas.outputs.e2e-m4-package }}
      parity-check: ${{ steps.areas.outputs.parity-check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge base with origin/main needs the history; the file list
          # needs trees only, blobs come on demand for the macOS check.
          fetch-depth: 0
          filter: blob:none
      - name: Areas this push touches
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          set -euo pipefail
          on_main=()
          [[ "$REF" == refs/heads/main ]] && on_main=(--main)
          case "$EVENT" in
            push)
              # main: what this push added to main; an unknown or rewritten
              # previous commit means everything. Branches: everything since
              # they left main.
              if [[ "$REF" == refs/heads/main ]]; then
                args=(--base "$BEFORE")
              else
                args=(--merge-base-with origin/main)
              fi
              ;;
            pull_request) args=(--merge-base-with "$PR_BASE") ;;
            workflow_dispatch)
              if [[ "$FULL" == true ]]; then
                args=(--full)
              elif [[ "$REF" == refs/heads/main ]]; then
                args=(--base HEAD^1)
              else
                args=(--merge-base-with origin/main)
              fi
              ;;
            *) args=(--full) ;;
          esac
          tools/ci-changes.sh "${on_main[@]}" "${args[@]}" HEAD > "$RUNNER_TEMP/areas" 2> "$RUNNER_TEMP/why"
          cat "$RUNNER_TEMP/why" "$RUNNER_TEMP/areas"
          cat "$RUNNER_TEMP/areas" >> "$GITHUB_OUTPUT"
          {
            echo "### changes"
            echo
            echo '```'
            cat "$RUNNER_TEMP/why"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: skip rust-check
        if: steps.areas.outputs.rust-check != 'true'
        run: echo "rust-check is skipped, the path rules found nothing it reads"
      - name: skip rust-test
        if: steps.areas.outputs.rust-test != 'true'
        run: echo "rust-test is skipped, the path rules found nothing it reads"
      - name: skip macos
        if: steps.areas.outputs.macos != 'true'
        run: echo "macos is skipped, the path rules found nothing it reads"
      - name: skip deps-lint
        if: steps.areas.outputs.deps-lint != 'true'
        run: echo "deps-lint is skipped, the path rules found nothing it reads"
      - name: skip proto-lint-and-gen
        if: steps.areas.outputs.proto-lint-and-gen != 'true'
        run: echo "proto-lint-and-gen is skipped, the path rules found nothing it reads"
      - name: skip flutter-analyze-test
        if: steps.areas.outputs.flutter-analyze-test != 'true'
        run: echo "flutter-analyze-test is skipped, the path rules found nothing it reads"
      - name: skip goldens
        if: steps.areas.outputs.goldens != 'true'
        run: echo "goldens is skipped, the path rules found nothing it reads"
      - name: skip escape-tests
        if: steps.areas.outputs.escape-tests != 'true'
        run: echo "escape-tests is skipped, the path rules found nothing it reads"
      - name: skip escape-tests-podman
        if: steps.areas.outputs.escape-tests-podman != 'true'
        run: echo "escape-tests-podman is skipped, the path rules found nothing it reads"
      - name: skip e2e
        if: steps.areas.outputs.e2e != 'true'
        run: echo "e2e is skipped, the path rules found nothing it reads"
      - name: skip e2e-xvfb
        if: steps.areas.outputs.e2e-xvfb != 'true'
        run: echo "e2e-xvfb is skipped, the path rules found nothing it reads"
      - name: skip e2e-agent
        if: steps.areas.outputs.e2e-agent != 'true'
        run: echo "e2e-agent is skipped, the path rules found nothing it reads"
      - name: skip e2e-m4
        if: steps.areas.outputs.e2e-m4 != 'true'
        run: echo "e2e-m4 is skipped, the path rules found nothing it reads"
      - name: skip e2e-m4-package
        if: steps.areas.outputs.e2e-m4-package != 'true'
        run: echo "e2e-m4-package is skipped, the path rules found nothing it reads"
      - name: skip parity-check
        if: steps.areas.outputs.parity-check != 'true'
        run: echo "parity-check is skipped, the path rules found nothing it reads"

  rust-check:
    name: rust-check
    needs: changes
    if: needs.changes.outputs.rust-check == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cargo-deny: "true"
          cache-key: rust-check
      - name: Format and lints
        run: make rust-fmt rust-clippy
      - name: Licenses, advisories, duplicate crates
        run: make rust-deny

  lint:
    name: lint
    # The cheap checks that need no toolchain. They ran in rust-check until
    # HUM-424; here they run on every push, also when the path rules skip
    # rust-check, because a page under docs/ or a catalog edit alone can break
    # them. No `needs: changes`: this job is never skipped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install check-jsonschema
        # scripts/ci/lint-docs.sh validates catalog/domains.yaml against its
        # schema when the tool is there and reports a loud skip when it is not.
        # A skip in CI would mean the bundled catalog is never validated.
        run: pipx install check-jsonschema
      - name: Security documents (HUM-007)
        # Both documents complete, no TODO/TBD line, every referenced ESC-N is a
        # real escape test, every relative link under docs/ resolves.
        run: make docs-lint
      - name: Bundled catalog matches its source (HUM-094)
        # Part of `make check` and of the old local verify, but no CI job ran
        # it until HUM-237 made CI the only full gate. A byte comparison.
        run: make catalog-lint
      - name: Typed errors in public signatures (HUM-063)
        # Public functions of the library crates return Diagnostic or a
        # thiserror type, never String, anyhow::Error or Box<dyn Error>. The
        # script checks its own fixtures first, then the crates.
        run: |
          scripts/ci/lint-no-string-errors.sh --self-test
          scripts/ci/lint-no-string-errors.sh
          scripts/ci/test-report.sh --self-test

  rust-test:
    name: rust-test
    needs: changes
    if: needs.changes.outputs.rust-test == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-test
      - name: Install the clients of the conformance matrix (HUM-017)
        # daemon/crates/proxy/tests/conformance.rs drives real clients through
        # the proxy. Every row skips itself when its client is missing, so a
        # missing package would turn the matrix green without testing anything;
        # here all of them have to be present.
        #
        # curl, git, python3 and node are already on the runner image. The
        # python module requests (row 15) is not. websocat (row 11) and grpcurl
        # (rows 12 and 13) are packaged neither in Debian nor in Ubuntu; they
        # come from their upstream releases, pinned to a version and verified
        # against a SHA-256, in the same spirit as the commit-pinned actions.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git python3 python3-requests bubblewrap
          # `humanitl sandbox check` must show three green lines on this runner
          # (HUM-064, acceptance criterion 1). The test in bin/humanitl fails
          # loudly under CI when bwrap is missing instead of skipping.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # The disposable sandbox needs bwrap >= 0.11 (--overlay, HUM-350).
          ./scripts/ci/install-bwrap-overlay.sh

          websocat_sha=66f8dd3a0394761556339117f8bb5123bddefd44e087af2a72ec22b0bd08d514
          curl -fsSL -o /tmp/websocat \
            https://github.com/vi/websocat/releases/download/v1.14.1/websocat.x86_64-unknown-linux-musl
          echo "${websocat_sha}  /tmp/websocat" | sha256sum -c -
          sudo install -m 0755 /tmp/websocat /usr/local/bin/websocat

          grpcurl_sha=97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736
          curl -fsSL -o /tmp/grpcurl.tar.gz \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.4/grpcurl_1.9.4_linux_x86_64.tar.gz
          echo "${grpcurl_sha}  /tmp/grpcurl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grpcurl.tar.gz -C /tmp grpcurl
          sudo install -m 0755 /tmp/grpcurl /usr/local/bin/grpcurl

          missing=0
          for tool in curl websocat grpcurl python3 node git; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is missing, rows of the conformance matrix would skip"
              missing=1
            fi
          done
          python3 -c 'import requests' || {
            echo "::error::the python module requests is missing, row 15 would skip"
            missing=1
          }
          exit "$missing"
      - name: Build and test the workspace
        id: rust-test
        # Die Ausgabe geht durch `tee` in eine Datei, und ein roter Lauf nennt
        # danach die Tests, die fielen (HUM-133). Ohne das steht in der
        # Annotation nur `Process completed with exit code 2`, und das Job-Log
        # verlangt Schreibrechte am Repository -- ein roter Lauf waere von
        # aussen nicht zu deuten.
        run: |
          set -o pipefail
          make rust-build
          cd daemon && cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/rust-test.log"
      - name: Name the tests that failed
        # Nur wenn dieser Schritt fiel: `failure()` allein feuerte auch nach
        # einem gescheiterten Checkout, und dann stuende in der Annotation eine
        # fehlende Datei statt des Grundes.
        if: failure() && steps.rust-test.outcome == 'failure'
        run: ./scripts/ci/test-report.sh "$RUNNER_TEMP/rust-test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.rust-test.outcome == 'failure'
        with:
          name: rust-test-log
          path: ${{ runner.temp }}/rust-test.log
          if-no-files-found: ignore
      - name: The escape starter with the admission bypass (HUM-431)
        # `escape-launch` braucht das Feature `unadmitted-backends`
        # (`required-features`), und kein Manifest schaltet es ein, damit es
        # sich nie mit dem Daemon vereinigt. Gebaut, geprüft und getestet wird
        # es deshalb hier, allein mit der Sandbox-Crate und dem IPC-Crate,
        # dessen Terminal-Test das Feature durchreicht. Das Clippy des
        # Arbeitsbereichs überspringt ein Binary mit `required-features` und
        # Testcode hinter dem Feature; der eigene Aufruf hier fängt, was es
        # übersähe (HUM-435).
        run: |
          set -euo pipefail
          cd daemon
          cargo clippy -p humanitl-sandbox -p humanitl-ipc \
            --features humanitl-sandbox/unadmitted-backends,humanitl-ipc/unadmitted-backends \
            --all-targets -- -D warnings
          cargo test -p humanitl-sandbox --features unadmitted-backends --bin escape-launch
      - name: Backpressure load test with measurements (HUM-057)
        # 1000 flows in 10 s against a deliberately slow subscriber. The test
        # is #[ignore] locally because it takes over ten seconds and measures
        # latency; here it runs alone with --nocapture, so p50/p95/p99, max RSS
        # and the Lagged count stand in the job log.
        run: cd daemon && cargo test -p humanitl-proxy --test backpressure -- --ignored --nocapture --test-threads=1
      - name: The shim is static and under 2 MB (HUM-012)
        # The shim is the only binary that is mounted into the sandbox, and the
        # sandbox has none of the host's libraries: it must be statically
        # linked. musl is the first choice; without the target the glibc one
        # with +crt-static does the same job. -C relocation-model=static makes
        # the result an ET_EXEC instead of a static PIE, which is what lets ldd
        # answer "not a dynamic executable". tests/escape/run.sh builds it the
        # same way and reports the same two properties as cases.
        run: |
          set -euo pipefail
          cd daemon
          musl="$(uname -m)-unknown-linux-musl"
          target_flag=()
          out="target/shim/humanitl-shim"
          # The musl target needs a musl linker as well; without musl-tools the
          # target installs fine and the link step then fails on crt1.o. Only
          # take that road when both halves are there.
          sudo apt-get install -y --no-install-recommends musl-tools > /dev/null 2>&1 || true
          if command -v musl-gcc > /dev/null && rustup target add "$musl" > /dev/null 2>&1; then
            target_flag=(--target "$musl")
            out="target/$musl/shim/humanitl-shim"
          else
            echo "::notice::$musl or its linker is not available, building with +crt-static"
          fi
          cargo rustc -p humanitl-shim --bin humanitl-shim --profile shim \
            "${target_flag[@]}" -- -C target-feature=+crt-static -C relocation-model=static
          linkage="$(ldd "$out" 2>&1 || true)"
          bytes="$(wc -c < "$out")"
          echo "shim: $out, $bytes bytes, ldd: $linkage"
          case "$linkage" in
            *"not a dynamic executable"*) ;;
            *) echo "::error::the shim is not statically linked: $linkage"; exit 1 ;;
          esac
          if [[ "$bytes" -ge 2097152 ]]; then
            echo "::error::the shim is $bytes bytes, the limit is 2097152"
            exit 1
          fi
      - name: Documentation builds without warnings
        # missing_docs is denied in every library crate, so a public item without
        # a doc comment fails here (CONVENTIONS.md 3.12).
        run: cd daemon && cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  macos:
    name: macos
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    # Daemon, CLI and their tests on macOS (HUM-312, backlog/sprint-6.md).
    # macos-15 is Apple Silicon; the Intel half of the release is cross-built
    # in release.yml and only checked there. Linux stays the reference: what
    # needs bwrap, seccomp or systemd is cfg-gated and runs in the jobs above.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos
      - uses: ./.github/actions/setup-flutter
        with:
          protoc-plugin: "true"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Clippy
        run: cd daemon && cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the workspace
        run: cd daemon && cargo build --workspace --all-targets
      - name: Build and test the workspace
        id: macos-test
        run: |
          set -o pipefail
          cd daemon && cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/macos-test.log"
      - name: Name the tests that failed
        if: failure() && steps.macos-test.outcome == 'failure'
        run: ./scripts/ci/test-report.sh "$RUNNER_TEMP/macos-test.log"
      - name: Seatbelt escape tests (HUM-323)
        # A real daemon in an empty HOME, `humanitl sandbox check` with three
        # green guarantees, then every way out the profile must refuse.
        run: |
          set -euo pipefail
          cd daemon && cargo build -p humanitl -p humanitld -p humanitl-shim
          cd .. && ./tests/escape/macos/run.sh daemon/target/debug
      - name: The macOS app builds (HUM-325)
        # The runner under app/macos, the Dart code that only macOS takes
        # (lstat, the window, the restart through launchd) and the tests of the
        # app without the goldens, which are rendered on Linux (HUM-377);
        # app/packages/ui has its own tests and does not run here. A failing
        # command leaves the end of its output in an annotation, so the reason
        # shows on the run summary without opening the job log.
        run: |
          set -uo pipefail
          step() {
            local out="$RUNNER_TEMP/app-step.log" text status=0
            "$@" >"$out" 2>&1 || status=$?
            cat "$out"
            if (( status != 0 )); then
              text="$* failed with $status"$'\n'"$(tail -40 "$out")"
              # Workflow commands: first %, then CR and LF.
              text="${text//%/%25}"
              text="${text//$'\r'/%0D}"
              text="${text//$'\n'/%0A}"
              printf '::error title=macOS app::%s\n' "$text"
              exit "$status"
            fi
          }
          step make flutter-codegen
          cd app
          step flutter test --exclude-tags golden --concurrency="$(sysctl -n hw.ncpu)"
          step flutter build macos --debug
      - name: The daemon as a launchd agent (HUM-324)
        # A fresh runner: install the agent from the build, wait until the
        # daemon answers, check the sandbox through it, take it away again.
        # Every step that fails says why in an annotation, with launchd's view
        # and the daemon's log: the job log itself needs write access.
        run: |
          # Without -e (GitHub starts bash with it): every failure goes
          # through annotate, and launchctl print exits 113 for a service
          # that is gone, which must not end the step before the annotation.
          set +e -uo pipefail
          bin="$PWD/daemon/target/debug"
          log="$HOME/Library/Logs/Humanitl/humanitld.log"
          annotate() {
            local what="$1" out="$2" state
            state="$(launchctl print "gui/$(id -u)/dev.humanitl.humanitld" 2>&1 | head -40 ||
              launchctl print "user/$(id -u)/dev.humanitl.humanitld" 2>&1 | head -40 ||
              true)"
            local text="$what failed%0A$out%0A--- launchctl ---%0A$state%0A--- log ---%0A$(tail -30 "$log" 2>/dev/null)"
            text="${text//$'\n'/%0A}"
            echo "::error title=launchd agent::$text"
            exit 1
          }
          run() {
            local out
            out="$("$@" 2>&1)" || annotate "$*" "$out"
            echo "$out"
          }
          run "$bin/humanitl" daemon install --bin-dir "$bin"
          for _ in $(seq 1 75); do
            "$bin/humanitl" daemon status >/dev/null 2>&1 && break
            sleep 0.2
          done
          run "$bin/humanitl" daemon status
          "$bin/humanitl" doctor || true
          # The subshell's exit 1 does not end the step without -e.
          (cd "$RUNNER_TEMP" && run "$bin/humanitl" sandbox check) || exit 1
          run "$bin/humanitl" daemon restart
          for _ in $(seq 1 75); do
            "$bin/humanitl" daemon status >/dev/null 2>&1 && break
            sleep 0.2
          done
          run "$bin/humanitl" daemon status
          run "$bin/humanitl" daemon logs -n 20
          run "$bin/humanitl" daemon uninstall
          # launchd ends the daemon with SIGTERM; give it time to shut down.
          for _ in $(seq 1 50); do
            "$bin/humanitl" daemon status >/dev/null 2>&1 || break
            sleep 0.2
          done
          if "$bin/humanitl" daemon status >/dev/null 2>&1; then
            annotate "uninstall" "the daemon still answers 10s after uninstall"
          fi
      - name: Documentation builds without warnings
        run: cd daemon && cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deps-lint:
    name: deps-lint
    needs: changes
    if: needs.changes.outputs.deps-lint == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # packaging/release/release-notes-test.sh vergleicht die Commit-Liste
          # der Release-Notes mit `git log` seit dem vorigen Tag und braucht
          # dafuer die Historie und die Tags (HUM-225).
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: deps-lint
      - name: Dependency direction, missing_docs, single egress point
        # tools/check-deps.sh reads `cargo metadata`, hence the Rust setup.
        run: make deps-lint
      - name: Tests of the pipeline tools (HUM-237)
        # tools/ci-gate.sh against a faked Actions API,
        # tools/commit-issue.sh --ci against a throwaway origin, and the path
        # rules of tools/ci-changes.sh against this file (HUM-424): the tools
        # that decide whether a branch reaches main. The plan test reads YAML.
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2> /dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-yaml
          }
          make tools-test

  proto-lint-and-gen:
    name: proto-lint-and-gen
    needs: changes
    if: needs.changes.outputs.proto-lint-and-gen == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # buf breaking compares against the proto on main.
          fetch-depth: 0
      - name: Look for the proto sources
        id: sources
        run: |
          set -euo pipefail
          if [[ -f proto/buf.yaml && -x scripts/gen-proto.sh ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::proto contract not present yet, skipping lint and drift check (HUM-003)"
            {
              echo "### proto-lint-and-gen: skipped"
              echo
              echo "\`proto/buf.yaml\` or \`scripts/gen-proto.sh\` does not exist yet."
              echo "The job turns itself on as soon as HUM-003 lands. Nothing was verified."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        if: steps.sources.outputs.ready == 'true'
        with:
          setup_only: true
      - uses: ./.github/actions/setup-rust
        if: steps.sources.outputs.ready == 'true'
        with:
          cache-key: proto
      - uses: ./.github/actions/setup-flutter
        if: steps.sources.outputs.ready == 'true'
        with:
          protoc-plugin: "true"
      - name: Install protoc
        # Rust generation is protoc-free (protox). Only the Dart half needs a
        # protoc binary, together with protoc-gen-dart from the setup above;
        # scripts/gen-proto.sh skips Dart when either is missing.
        if: steps.sources.outputs.ready == 'true'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: buf lint
        if: steps.sources.outputs.ready == 'true'
        run: buf lint proto
      - name: buf breaking against main
        # continue-on-error until HUM-003 is merged to main: before that there is
        # no proto on main to compare against. Remove the flag afterwards.
        if: steps.sources.outputs.ready == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: buf breaking proto --against '.git#branch=main,subdir=proto'
      - name: Regenerate
        if: steps.sources.outputs.ready == 'true'
        run: ./scripts/gen-proto.sh
      - name: Fail on generated drift
        # The generated Dart directory is gitignored, so what moves here is
        # proto/generated.sha256, proto/descriptor.binpb and any tracked
        # generated file (HUM-003). `git add -N` first: `git diff` is blind to
        # untracked files, and a freshly written hash that nobody committed
        # would be a watchdog that never barks.
        if: steps.sources.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git add -N -- proto daemon/crates/ipc app/lib/core/ipc
          git diff --exit-code -- proto daemon/crates/ipc app/lib/core/ipc || {
            git status --porcelain -- proto daemon/crates/ipc app/lib/core/ipc
            echo "::error::generated code drifted, run make proto and commit the result"
            exit 1
          }

  flutter-analyze-test:
    name: flutter-analyze-test
    needs: changes
    if: needs.changes.outputs.flutter-analyze-test == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        # scripts/gen-proto.sh refreshes proto/descriptor.binpb through
        # `cargo xtask proto` before it writes the Dart half, so the job needs
        # cargo even though nothing Rust is tested here.
        with:
          cache-key: flutter
      - uses: ./.github/actions/setup-flutter
        with:
          linux-desktop: "true"
          protoc-plugin: "true"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Fetch packages
        run: make flutter-get
      - name: Generate the Dart proto code
        # app/lib/core/ipc/generated/ is gitignored (HUM-003) and both analyze
        # and test import it, so it has to exist before either runs. STRICT
        # turns a missing protoc or protoc-gen-dart into a failure, not a skip.
        env:
          STRICT: "1"
        run: ./scripts/gen-proto.sh
      - name: Code generation
        # riverpod, freezed and json_serializable arrive later; until build_runner
        # is a dev dependency there is nothing to generate.
        run: |
          set -euo pipefail
          if grep -qE '^\s*build_runner\s*:' app/pubspec.yaml; then
            cd app && dart run build_runner build --delete-conflicting-outputs
          else
            echo "::notice::no build_runner dependency yet, skipping code generation"
            echo "### flutter code generation: skipped (no build_runner dependency)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Analyze
        # --fatal-infos is the Dart counterpart of RUSTFLAGS=-D warnings: strict
        # here, not enforced by `make flutter-analyze` locally.
        run: cd app && flutter analyze --fatal-infos
      - name: Format
        # The third half of `make flutter-analyze`, which no CI job ran until
        # HUM-237 made CI the only full gate. Same paths as the Makefile.
        run: cd app && dart format --output=none --set-exit-if-changed lib test packages/ui/lib packages/ui/test
      - name: Test
        # --concurrency: package:test defaults to half the cores, two on the
        # four-core runner, so half of it sat idle while 130 test files ran in
        # two lanes. One process per core instead (HUM-237); every file still
        # runs in its own process, so no state is shared between them.
        #
        # --exclude-tags golden: the golden tests are the required `goldens`
        # job and ran here a second time. scripts/ci/goldens-placeholder.sh
        # fails when a golden test lives outside app/test/goldens, so none can
        # drop out of both jobs.
        #
        # No sharding into a matrix: every extra job pays about four minutes
        # of setup (Flutter, proto, code generation) to save part of a five
        # minute step, and the matrix would rename the required check
        # `flutter-analyze-test`. Worth revisiting when this step alone passes
        # six minutes.
        run: cd app && flutter test --coverage --concurrency="$(nproc)" --exclude-tags golden
      - name: Design system package
        # `flutter test` in app/ does not descend into the path dependency, so
        # the tokens and widgets of packages/ui (HUM-005) get the same gate here.
        run: |
          set -euo pipefail
          cd app/packages/ui
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Runner exit log
        # Der einzige C++-Test des Repositories (HUM-136). `flutter test`
        # erreicht ihn nicht, und `flutter build linux` uebersetzt ihn nicht:
        # Er misst, was der Runner beim Signal und beim Absturz schreibt, und
        # ohne diesen Schritt liefe er nirgends, wo er einen Merge aufhaelt.
        run: make runner-test
      - name: Build the Linux bundle
        run: cd app && flutter build linux --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: flutter-coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  goldens:
    name: goldens
    needs: changes
    if: needs.changes.outputs.goldens == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        # scripts/gen-proto.sh refreshes proto/descriptor.binpb through
        # `cargo xtask proto` before it writes the Dart half.
        with:
          cache-key: goldens
      - uses: ./.github/actions/setup-flutter
        with:
          protoc-plugin: "true"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Prepare the app
        # The goldens render the real screens, and those import generated code:
        # the Dart side of the proto, riverpod, freezed and the ARB messages.
        # Fetching packages alone leaves the app uncompilable here, while the
        # analyze job generates and therefore stays green.
        run: |
          set -euo pipefail
          make flutter-get
          ./scripts/gen-proto.sh
          make flutter-codegen
      - name: Golden tests
        # `flutter test --tags golden test/goldens`, one test process per
        # core: the pixels stay the same, because every file renders in its
        # own process with alchemist's CI fonts and no shared state (HUM-237).
        # The set of HUM-054 renders every golden in four variants
        # (dark/light, en/de); `golden_variants_complete` fails when one of
        # the four images is missing. `make goldens` runs the same script.
        run: ./scripts/ci/goldens-placeholder.sh
      # A red comparison leaves the master, the test image and the diffs of
      # each failed golden under app/test/goldens/failures; a Flutter bump in
      # app/.fvmrc that moves pixels shows up here (HUM-054).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: golden-failures
          path: app/test/goldens/failures
          if-no-files-found: ignore

  escape-tests:
    name: escape-tests
    needs: changes
    if: needs.changes.outputs.escape-tests == 'true'
    runs-on: ubuntu-24.04
    # Since HUM-021 every probe of Sprint 1 is green, so nothing is tolerated
    # any more: run.sh exits 1 for a red probe and 2 for a sandbox that would
    # not start, and both fail this job. A probe that a later issue turns
    # green is recorded as skip, never as red; tests/escape/README.md names the
    # issue behind each skip.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: escape
      - name: Install the sandbox tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat python3
          # ESC-5 also starts a disposable sandbox: bwrap >= 0.11 (HUM-350).
          ./scripts/ci/install-bwrap-overlay.sh
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 ships an AppArmor restriction that makes bwrap fail with
        # "Permission denied" (HUM-002 Fallstricke, needed from HUM-006 on).
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: bwrap is usable
        run: bwrap --version
      - name: Escape tests
        # The harness is the real thing (HUM-006). scripts/ci/escape-placeholder.sh
        # stands in only while tests/escape/run.sh does not exist, and reports a
        # skip, never a pass.
        run: |
          set -euo pipefail
          if [[ -x tests/escape/run.sh ]]; then
            ./tests/escape/run.sh
          else
            ./scripts/ci/escape-placeholder.sh
          fi
      - name: Escape verdict
        # Says out loud what the step above tolerated: a pass, a skip that
        # ESCAPE_ALLOW_FAIL let through, or a failure, also without a verdict.
        # Shared with escape-tests-podman (HUM-435).
        if: always()
        run: ./scripts/ci/escape-verdict.sh escape-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: escape-junit
          path: |
            target/escape/*.xml
            target/escape/results.txt
            target/escape/*.log
          if-no-files-found: ignore

  escape-tests-podman:
    name: escape-tests-podman
    needs: changes
    if: needs.changes.outputs.escape-tests-podman == 'true'
    runs-on: ubuntu-24.04
    # The same suites as escape-tests, against Podman (HUM-435). A backend is
    # admissible only when tests/escape/ is green against it (BACKLOG.md 9.1);
    # Podman stays refused with SANDBOX_048 for every user until HUM-448, and
    # run.sh starts it through escape-launch, the one binary built with the
    # feature unadmitted-backends. The same steps and the same verdict as
    # escape-tests, plus the proof of the engine (P16), a hostile engine
    # configuration planted before the run, and the live tests of the adapter.
    # A Podman that cannot start is an error, never a pass or a skip: run.sh
    # records sandbox_not_started, and HUMANITL_REQUIRE_PODMAN=1 turns the
    # skip of the live tests into a failure.
    env:
      HUMANITL_ESCAPE_BACKEND: podman
      HUMANITL_REQUIRE_PODMAN: "1"
    steps:
      - name: Podman on the runner (P16)
        # The runner image ships Podman and crun (4.9.3 on ubuntu-24.04 when
        # this job was written). The adapter needs 4.9 or newer with crun; a
        # feature of a newer Podman in the adapter turns this job red.
        run: |
          set -euo pipefail
          podman --version
          podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.CgroupControllers}}'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: escape-podman
      - name: Install the sandbox tooling
        # bwrap for ESC-5, which runs on the host and starts bubblewrap
        # sandboxes of its own; busybox-static for the control container of
        # the planted engine configuration.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat python3 busybox-static
          # ESC-5 also starts a disposable sandbox: bwrap >= 0.11 (HUM-350).
          ./scripts/ci/install-bwrap-overlay.sh
      - name: Allow unprivileged user namespaces
        # The same AppArmor restriction holds rootless Podman back as bwrap.
        # Yama at 0 as on a common desktop: with ptrace_scope=1 the kernel
        # itself refuses the four ptrace probes of ESC-1, they report a skip,
        # and ESCAPE_NO_SKIP=1 rightly turns that red. At 0 they measure the
        # sandbox instead of the runner.
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: bwrap is usable
        run: bwrap --version
      - name: Plant a hostile engine configuration
        # mounts.conf, a volume and a hook in ~/.config/containers of the
        # runner, proven to reach a plain container first. ESC-2 shows that
        # none of it reaches a sandbox (tests/escape/engine-config-proof.sh).
        run: ./tests/escape/plant-engine-config.sh "$RUNNER_TEMP/humanitl-engine-canary"
      - name: Podman adapter, live tests
        # Real containers (HUM-433): checks, exit status, teardown, the
        # lifeline, the proxy variables, the user's configuration, the
        # terminal. They find the shim next to the test binary.
        run: |
          set -euo pipefail
          cd daemon
          cargo build -p humanitl-shim --bin humanitl-shim
          live=0
          cargo test -p humanitl-sandbox --lib podman -- --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/podman-live.txt" || live=$?
          # The job log needs admin rights; an annotation names each red test
          # for everyone who can see the run.
          sed -n 's/^test \(.*\) \.\.\. FAILED$/::error title=podman live test::\1/p' \
            "$RUNNER_TEMP/podman-live.txt"
          # A mount table that differs from the plan (HUM-437): the shim's
          # missing and extra entries, whole, once each.
          grep -oE '(missing|extra): [^\\]*' "$RUNNER_TEMP/podman-live.txt" \
            | sort -u | head -n 20 | cut -c1-2000 \
            | sed 's/%/%25/g; s/^/::error title=podman mount table::/' || true
          ((live == 0))
          # A filter that matches nothing would pass with zero tests.
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/podman-live.txt"
      - name: Escape tests against Podman
        run: ./tests/escape/run.sh
      - name: Escape verdict
        if: always()
        # Acceptance criterion 1 of HUM-435: no skipped probe on Podman.
        env:
          ESCAPE_NO_SKIP: "1"
        run: ./scripts/ci/escape-verdict.sh escape-tests-podman
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: escape-podman-junit
          path: |
            target/escape/*.xml
            target/escape/results.txt
            target/escape/*.log
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # The demo is under fifteen seconds of running once the binaries are there;
    # the rest of the budget is the build. A job that hangs instead of failing
    # would hide exactly the kind of defect this gate exists for.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-m1
      - name: Install the runtime tooling
        # bubblewrap starts the sandbox, curl is the agent inside it, jq reads
        # the answers, python3 is the target the demo allows, iproute2 gives the
        # target its address in the run's own network namespace, and util-linux
        # brings unshare, which creates that namespace.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap curl jq python3 iproute2 util-linux musl-tools
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor (HUM-002). Without this
        # neither bwrap nor `unshare -rn` starts; the demo says so and fails,
        # it does not hang.
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: bwrap is usable
        run: bwrap --version
      - name: M1 demo (sealed box, held request, human decision)
        # E2E_TRACE=1 adds `set -x`, so every failing assertion has its step in
        # the log, as the acceptance criteria of HUM-021 ask. E2E_ONLY=m1 keeps
        # this job on the M1 demo; M2 has its own job below, because it needs
        # xvfb and Flutter for its screen half.
        env:
          E2E_TRACE: "1"
          E2E_ONLY: m1
        run: ./tests/e2e/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-m1-logs
          # The daemon log of the run, the isolation report of `humanitl sandbox run -v`,
          # the access log of the target and the answers the agent received.
          path: target/e2e
          if-no-files-found: ignore

  e2e-xvfb:
    name: e2e-xvfb
    needs: changes
    if: needs.changes.outputs.e2e-xvfb == 'true'
    runs-on: ubuntu-24.04
    # The M2 demo itself is under a minute with a warm tree (measured 47 s on a
    # six-core desktop, 2026-09-12); the rest of the budget is the Rust build,
    # the Flutter setup and the debug build of the GTK application the screen
    # half drives. A job that hangs instead of failing would hide exactly the
    # kind of defect this gate exists for.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e
      - uses: ./.github/actions/setup-flutter
        with:
          linux-desktop: "true"
          protoc-plugin: "true"
      - name: Install protoc
        # The screen half builds the app, and the app imports
        # app/lib/core/ipc/generated, which is gitignored (HUM-003). Without
        # protoc there is nothing to import and `flutter build linux` fails.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Install the runtime tooling
        # Same set as the M1 job, plus openssl for the test certificate the
        # fake upstream shows on 443 and xvfb for the screen half. bubblewrap
        # starts the sandbox, curl is the client the agent speaks through,
        # python3 runs both the target and the agent, jq reads the answers,
        # iproute2 gives the target its address in the run's own network
        # namespace, and util-linux brings the unshare that creates it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb bubblewrap curl jq python3 openssl iproute2 util-linux musl-tools
      - name: Fetch packages
        # The demo runs inside `unshare -rn` and has no network there. Every
        # package it needs is resolved here, into the pub cache the run hands
        # the screen driver through PUB_CACHE.
        run: make flutter-get
      - name: Generate the Dart proto code
        env:
          STRICT: "1"
        run: ./scripts/gen-proto.sh
      - name: Code generation
        # riverpod, freezed and json_serializable: the app does not analyze
        # and does not build without them.
        run: |
          set -euo pipefail
          if grep -qE '^\s*build_runner\s*:' app/pubspec.yaml; then
            cd app && dart run build_runner build --delete-conflicting-outputs
          else
            echo "::notice::no build_runner dependency yet, skipping code generation"
          fi
      - name: Build the Linux app for the screen half
        # `flutter test integration_test/... -d linux` would otherwise build
        # the GTK application from nothing inside the namespace, where the
        # run has neither network nor its own package cache. The demo builds
        # it itself when this step is missing; here it happens once, outside
        # the namespace, and the step name says where the time went.
        run: cd app && flutter build linux --debug
      - name: Build the daemon the integration tests drive
        # `make flutter-test-integration` refuses to start without
        # daemon/target/debug/humanitld. The M2 demo below builds the same
        # binary into the same target directory (tests/e2e/lib.sh), so this
        # step is the one build and not a second one.
        run: cd daemon && cargo build -p humanitld --bin humanitld
      - name: The app on a screen against a real daemon (HUM-144)
        # The frozen queue of HUM-029, measured against a real `humanitld
        # --fake` playing fixtures/sessions/npm-install.jsonl, plus the shell
        # test next to it. Without this step nothing runs app/integration_test
        # except the M2 driver, and a file that no gate runs goes stale in
        # silence. The resolution is not a suggestion: below 1400x900 the
        # narrow layout takes over and the selectors miss.
        run: xvfb-run -a --server-args='-screen 0 1600x1000x24' make flutter-test-integration
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor (HUM-002). Without this
        # neither bwrap nor `unshare -rn` starts; the demo says so and fails,
        # it does not hang.
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: bwrap is usable
        run: bwrap --version
      - name: M2 demo (grouping, batch release, block, timeout, history, screen)
        # The demo runs its own daemon, its own target, its own sandbox and its
        # own screen under xvfb in a throwaway tree and needs no network. It
        # fails when the integration test of the screen is missing and when
        # fewer assertions ran than the branch it took expects.
        env:
          E2E_TRACE: "1"
          E2E_ONLY: m2
        run: ./tests/e2e/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-artifacts
          # The daemon log, the access log of the target, what the agent got
          # back for every request, the log of the screen driver, the HAR
          # export and, after a failure, the picture of the screen. Under
          # target/e2e/integration the step "The app on a screen against a
          # real daemon" leaves the output of every test file and the log of
          # its fake daemon (HUM-185): the job log itself needs admin rights.
          path: target/e2e
          if-no-files-found: ignore

  e2e-agent:
    name: e2e-agent
    needs: changes
    if: needs.changes.outputs.e2e-agent == 'true'
    runs-on: ubuntu-24.04
    # The M3 demo itself is around forty seconds; the rest of the budget is the
    # Rust build. A job that hangs instead of failing would hide exactly the
    # kind of defect this gate exists for.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-agent
      - name: Install the runtime tooling
        # The same set as the M2 job, minus xvfb: no screen is driven here.
        # bubblewrap starts the sandbox, curl is the client the agent speaks
        # through, python3 runs the language model and the second target,
        # openssl makes the test certificate the target shows on 443, jq reads
        # the answers, iproute2 gives both targets their address in the run's
        # own network namespace, and util-linux brings the unshare that creates
        # it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap curl jq python3 openssl iproute2 util-linux musl-tools
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor (HUM-002). Without this
        # neither bwrap nor `unshare -rn` starts; the demo says so and fails,
        # it does not hang.
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: bwrap is usable
        run: bwrap --version
      - name: The mock language model against itself
        # Its own step on purpose. The mock carries the whole milestone; when
        # it breaks, this step goes red and the demo below stays green-or-red
        # on its own merits, so a red M3 is never ambiguous.
        run: ./tests/e2e/mock_llm/self_test.sh
      - name: M3 demo (agent in the sandbox, passthrough, bundled rules, one decision)
        # The demo runs its own daemon, its own language model, its own target
        # and two sandboxed sessions in a throwaway tree and needs no network.
        # It fails when fewer assertions ran than it expects, and it says in
        # its last line when a variant was skipped.
        #
        # M3_OPENCODE=auto: the real-agent variant runs only where the sandbox
        # can see an `opencode` binary, which means under /usr/local/bin,
        # /usr/bin or /bin. This image has none, so the run reports it as
        # skipped — never as passed. Once the image ships one, the variant runs
        # here without a change to this file; a runner that is supposed to have
        # it can set M3_OPENCODE=1, and then a missing binary fails the job.
        env:
          E2E_TRACE: "1"
          E2E_ONLY: m3
          M3_OPENCODE: auto
        run: ./tests/e2e/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-agent-artifacts
          # The daemon log, the transcript of the agent as `humanitl run` saw
          # it, the transcript of the attached terminal with the daemon's
          # notice lines, the access logs of the language model and the target,
          # the session summary, and the flow list in two states: after the
          # first session, which is what steps 7 and 11 talk about, and at the
          # end of the run, which carries everything that came after.
          path: target/e2e
          if-no-files-found: ignore

  e2e-m4:
    name: e2e-m4
    needs: changes
    if: needs.changes.outputs.e2e-m4 == 'true'
    runs-on: ubuntu-24.04
    # The target of HUM-055 is under ten minutes on a warm cache: the M4 demo
    # itself is around two minutes, the rest is the Rust and Flutter debug
    # builds. The timeout is the ceiling for a cold cache; a job that hangs
    # instead of failing would hide exactly the kind of defect this gate
    # exists for. Step 13 (the release build of the .deb and lintian) runs in
    # e2e-m4-package next to it, so it does not eat this budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-m4
      - uses: ./.github/actions/setup-flutter
        with:
          linux-desktop: "true"
          protoc-plugin: "true"
      - name: Install protoc
        # The screen half builds the app, and the app imports
        # app/lib/core/ipc/generated, which is gitignored (HUM-003).
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Install the runtime tooling
        # The M2 set plus dbus: the screen half runs under dbus-run-session,
        # because flutter_local_notifications needs a session bus and step 7
        # would hang without one (HUM-055 Fallstricke).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus bubblewrap curl jq python3 openssl iproute2 util-linux musl-tools
      - name: Fetch packages
        # The demo runs inside `unshare -rn` and has no network there.
        run: make flutter-get
      - name: Generate the Dart proto code
        env:
          STRICT: "1"
        run: ./scripts/gen-proto.sh
      - name: Code generation
        run: |
          set -euo pipefail
          cd app && dart run build_runner build --delete-conflicting-outputs
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor (HUM-002).
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: M4 demo (editor, pseudonyms only upstream, audit chain, config set)
        # The demo builds the daemon, the shim and the app, then runs its own
        # daemon, target, sandboxed agent and screen (xvfb-run -a inside the
        # script) in a throwaway namespace without network. The screen gets
        # its own session bus inside that namespace, on a path socket: the bus
        # of this outer dbus-run-session listens on an abstract socket under
        # dbus 1.14, which a different network namespace cannot reach. It
        # prints `[m4] duration Ns` at the end; the target is under ten
        # minutes for the whole job. Steps 8, 9 and 10
        # are the security proofs of the sprint and fail the job on their own.
        env:
          E2E_TRACE: "1"
          E2E_ONLY: m4
          M4_PACKAGE: skip
        run: dbus-run-session -- ./tests/e2e/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-m4-artifacts
          # m4-step7.png (the screen at the end of step 7, always), after a
          # failure in the screen driver m4-failure.png, humanitld.log,
          # audit.jsonl, fake-upstream.log, upstream-requests.jsonl (what the
          # target received, body included), the log of the screen driver and
          # the agent transcripts.
          path: target/e2e/m4
          if-no-files-found: ignore

  e2e-m4-package:
    name: e2e-m4-package
    needs: changes
    if: needs.changes.outputs.e2e-m4-package == 'true'
    runs-on: ubuntu-24.04
    # Step 13 of the M4 demo: a release build of the three binaries and the
    # app, the .deb, lintian without E:, and no test hook in the release
    # humanitld. Its own job because a release build alone is longer than the
    # ten minutes e2e-m4 aims for. Since HUM-284 it also upgrades from the
    # last release with a running daemon, which installs the package twice.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-m4-package
      - uses: ./.github/actions/setup-flutter
        with:
          linux-desktop: "true"
          protoc-plugin: "true"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Install the packaging tools
        # dpkg-dev brings dpkg-shlibdeps, patchelf strips the build RUNPATH,
        # musl-tools builds the static shim, binutils brings strings.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev patchelf musl-tools lintian binutils
      - name: Generate the Dart code
        run: make flutter-codegen
      - name: M4 demo, step 13 (.deb, lintian, no test hook in release)
        env:
          E2E_TRACE: "1"
          M4_PACKAGE: only
        run: ./tests/e2e/m4_trusted_editor.sh
      - name: Allow unprivileged user namespaces
        # The hardened user unit (PrivateUsers, ProtectSystem) needs them in
        # the user manager; Ubuntu 24.04 restricts them through AppArmor.
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Upgrade from the last release with a running daemon (HUM-284)
        # The runner is a VM with systemd as PID 1, no container: linger
        # starts the user manager of the runner user, v0.0.6 runs its daemon
        # through socket activation, and installing the .deb of step 13 over
        # it must leave the new daemon running without a manual command.
        run: ./packaging/deb/check-upgrade.sh target/e2e/m4-package/dist/humanitl_0.0.0_amd64.deb 0.0.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-m4-package-artifacts
          path: |
            target/e2e/m4-package/lintian.txt
            target/e2e/m4-package/humanitld.strings
            target/e2e/m4-package/test-hooks.txt
          if-no-files-found: ignore

  parity-check:
    name: parity-check
    needs: changes
    if: needs.changes.outputs.parity-check == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: parity
      - name: UI and CLI parity
        # HUM-078: runs the CLI parity tests against clap, then
        # `cargo xtask docs --check`; fails on an RPC without a CLI subcommand,
        # on a stale entry and on a table that moved. RPCs without a UI
        # location show up as warnings. Since HUM-059 the same check covers
        # every generated reference page (docs/CONFIG.md, docs/DIAGNOSTICS.md,
        # docs/reference/cli.md): this job is the `docs-check` of the spec.
        run: ./scripts/ci/parity-check.sh

  ci-ok:
    name: ci-ok
    # The one check branch protection should require (HUM-424). A skipped
    # check counts as passed there, so the heavy jobs cannot be required one
    # by one: a failing `changes` would skip them all. This job always runs
    # and is green only when changes and lint succeeded and every other job
    # succeeded or was skipped because its output of changes is not 'true',
    # the rule tools/ci-gate.sh applies to the step `skip <job>`.
    if: always()
    needs:
      - changes
      - lint
      - rust-check
      - rust-test
      - macos
      - deps-lint
      - proto-lint-and-gen
      - flutter-analyze-test
      - goldens
      - escape-tests
      - escape-tests-podman
      - e2e
      - e2e-xvfb
      - e2e-agent
      - e2e-m4
      - e2e-m4-package
      - parity-check
    runs-on: ubuntu-24.04
    steps:
      - name: Every job succeeded or was skipped by the path plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I -c '
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          plan = (needs.get("changes") or {}).get("outputs") or {}
          bad = []
          for job in ("changes", "lint"):
              result = (needs.get(job) or {}).get("result")
              if result != "success":
                  bad.append("%s: %s" % (job, result))
          for job, info in sorted(needs.items()):
              if job in ("changes", "lint"):
                  continue
              result = info.get("result")
              if result == "success":
                  continue
              if result == "skipped" and needs["changes"]["result"] == "success" and plan.get(job) == "false":
                  print("%s: skipped by the path plan" % job)
                  continue
              bad.append("%s: %s" % (job, result))
          for line in bad:
              print("::error title=ci-ok::%s" % line)
          sys.exit(1 if bad else 0)
          '
