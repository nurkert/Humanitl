# Releases 0.Y.Z (the pre-releases 0.0.N and, since HUM-060, 0.1.0 and later
# before 1.0.0): from a tag on a green `main` commit to a GitHub release with
# .deb, .rpm, AppImage, archive and checksums. Since HUM-273 they are published
# as regular releases (marked latest), no longer as pre-releases. Releases
# before 1.0.0 are not signed; SHA256SUMS is all they carry.
#
#   guard -> build -> check-deb ------------+-> release
#                  -> check-rpm ------------+
#                  -> check-aur ------------+
#                  -> check-appimage -------+
#         -> build-macos -> check-macos ----+
#
# guard      Tag hat die Form v0.Y.Z, der Commit liegt auf `main`, und der
#            ci.yml-Lauf dieses Commits ist mit `success` beendet. Im
#            Probelauf nimmt guard die Version aus dem Zweignamen (unten).
#            Ab 0.1.0 muss CHANGELOG.md einen datierten Abschnitt der Version
#            haben (packaging/release/changelog-section.sh, HUM-060).
# build      Version in den Auscheckstand stempeln, Release-Bau von humanitld,
#            humanitl, humanitl-shim und der Flutter-App, `--version` pruefen,
#            .deb, .rpm, AppImage und tar.gz bauen, SHA256SUMS, Release-Notes,
#            dazu die Dateien des AUR-Pakets humanitl-bin (dist-meta/aur/).
# check-deb  Das .deb in einem frischen Ubuntu-24.04-Container installieren,
#            pruefen, mit --purge entfernen; lintian ohne Fehler und Warnungen.
# check-rpm  Das .rpm in einem frischen Fedora-44-Container mit dnf
#            installieren, pruefen, entfernen; rpmlint ohne Fehler und
#            Warnungen (packaging/rpm, HUM-339).
# check-aur  Im Arch-Container aus den gerenderten AUR-Dateien und dem Archiv
#            mit makepkg bauen, mit pacman installieren, pruefen, entfernen
#            (packaging/aur/check-aur.sh, HUM-339). Hochgeladen ins AUR wird
#            nichts; das macht der Maintainer von Hand (packaging/aur/README.md).
# check-appimage  Das AppImage auf einem frischen Runner pruefen, ohne FUSE und
#            ohne Installation (packaging/appimage/check-appimage.sh, HUM-335).
# build-macos  macOS-15: universal binaries (arm64 + x86_64), die Flutter-App,
#            beides zu Humanitl.app, ad-hoc signiert, als gestaltetes .dmg und
#            als .zip (HUM-326, packaging/macos).
# check-macos  Ein frischer macOS-Runner haengt das .dmg ein und prueft
#            Signatur, Architekturen, Version, den Start der App und die
#            Seatbelt-Escape-Tests gegen die Programme im Buendel.
# release    Tags only: GitHub release, regular (not a pre-release), latest.
#
# Probelauf (HUM-363): Er baut und prueft alles wie ein Tag-Lauf, laedt die
# Artefakte als Workflow-Artefakt hoch und legt kein Release an; der Job
# `release` wird uebersprungen. Ausgeloest wird er auf drei Wegen:
#
#   release-dry/0.Y.Z   Push dieses Zweigs durch tools/release.sh auf die
#                       Spitze von main, bevor der Tag v0.Y.Z entsteht. Die
#                       Version ist 0.Y.Z, und guard ist so streng wie beim Tag:
#                       Liegt der Commit nicht auf main oder ist sein
#                       ci.yml-Lauf nicht gruen, ist der Probelauf rot.
#   release-dry/hum-NNN Push durch tools/commit-issue.sh, wenn ein Issue-Commit
#                       einen Pfad aus tools/release-dry-paths.txt beruehrt.
#                       Version 0.0.NNN (die Issue-Nummer, nicht 0.0.0, damit
#                       ein Stempeln, das nichts schreibt, in check-version
#                       auffaellt); der Commit liegt noch nicht auf main, guard
#                       warnt deshalb nur.
#   workflow_dispatch   Von Hand unter Actions mit einer eingegebenen Version;
#                       guard warnt nur.
#
# Ein Tag wird nur gesetzt, wenn der Probelauf seines Commits gruen ist: Ein
# roter Tag-Lauf hinterliesse eine Nummer ohne Release, denn Tags werden nie
# verschoben (v0.0.14). Wie man ein Release schneidet, steht in
# docs/guides/release-process.md: nur mit tools/release.sh.
#
# Vorher stand hier das Geruest aus HUM-002 fuer alle `v*`-Tags (guard, make
# check, leerer package-Schritt, Draft-Release ohne Dateien). Der Trigger ist
# auf v0.* verengt: Ein Tag v1.0.0 loest hier nichts aus, und guard lehnt ihn
# ab, denn ab 1.0.0 sind Releases signiert (Entscheidung des Inhabers vom
# 2026-10-22). HUM-060 hat 0.1.0 hier aufgenommen, statt eine zweite Datei
# anzulegen: ohne VERSION-Datei und ohne minisign, die Version kommt aus dem
# Tag, die Notes ab 0.1.0 aus CHANGELOG.md. Das AppImage liegt seit HUM-335
# den Releases bei, das RPM seit HUM-339.
#
# Sicherheit: Tag-Name, Zweigname und Eingabe gelangen nur ueber `env:` in
# Skripte und werden dort gegen ^0\.Y\.Z$ beziehungsweise ^hum-NNN$ geprueft,
# bevor sie irgendwo anders stehen. Nur der Job `release` darf schreiben
# (contents: write), und er laeuft nur fuer einen Tag-Push: Ein Probelauf
# erreicht ihn weder ueber guard (publish ist dort false) noch ueber seine
# eigene Bedingung, die das Ereignis noch einmal prueft. Jede Action ist auf
# einen Commit-SHA gepinnt, jedes Container-Abbild auf einen Digest; der Tag im
# Kommentar ist Dokumentation, beide werden zusammen angehoben.

name: release

on:
  push:
    tags:
      - "v0.*"
    # Probelaeufe (HUM-363): tools/release.sh und tools/commit-issue.sh pushen
    # diese Zweige, weil das Werkzeug nur git-Zugriff hat und kein Token, das
    # workflow_dispatch ausloesen koennte.
    branches:
      - "release-dry/0.*"
      - "release-dry/hum-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run, 0.Y.Z. Builds and checks everything, creates no release."
        required: true
        type: string

# Nie zwei Laeufe fuer dieselbe Referenz gleichzeitig, und nie einen halb
# abbrechen: Ein halb angelegtes Release waere schlimmer als ein spaetes. Ein
# Probelauf-Zweig ist eine eigene Referenz und haelt keinen Tag-Lauf auf.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  STRICT: "1"

jobs:
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Ein Fork oder Spiegel, der einen v0.*-Tag schiebt, soll kein Release in
    # seinem Namen anlegen und nie den Job mit contents: write erreichen. Der
    # Test ist der Repository-Name, nicht `github.event.repository.fork`: Ein
    # Spiegel ist kein Fork, und ein uebersprungener guard nimmt jeden Job mit,
    # der ihn braucht.
    if: github.repository == 'nurkert/Humanitl'
    permissions:
      contents: read
      # Die Laeufe von ci.yml lesen.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      # Der Commit, den guard geprueft hat. Der Job release vergleicht den Tag
      # unmittelbar vor dem Anlegen noch einmal damit.
      sha: ${{ steps.version.outputs.sha }}
      # Ein Probelauf heisst anders als ein Release-Bau, damit sein Artefakt
      # nie mit einem geprueften verwechselt wird.
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Version from the tag, the dry-run branch or the dry-run input
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          # Unter einer UTF-8-Locale passt [0-9] in bash auch auf Ziffern
          # anderer Schriften; das Muster unten nennt die Ziffern ausdruecklich,
          # und C haelt auch den Rest des Skripts bei ASCII.
          LC_ALL: C
        run: |
          set -euo pipefail
          # publish: nur ein Tag legt ein Release an. strict: Ein Verstoss im
          # naechsten Schritt (Commit nicht auf main, CI nicht gruen) ist ein
          # Fehler statt einer Warnung; so prueft der Probelauf von
          # tools/release.sh dasselbe, was der Tag-Lauf danach prueft.
          if [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then
            candidate="${REF_NAME#v}"
            publish=true
            strict=true
          elif [[ "$EVENT" == "push" && "$REF_TYPE" == "branch" ]]; then
            publish=false
            dry="${REF_NAME#release-dry/}"
            if [[ "$dry" == "$REF_NAME" ]]; then
              echo "::error::a branch push runs a dry run only on release-dry/*, got '$REF_NAME'"
              exit 1
            fi
            if [[ "$dry" == hum-* ]]; then
              # Issue-Zweig vor dem Merge: Die Nummer ist nach dieser Pruefung
              # nur noch Ziffern; 10# nimmt fuehrende Nullen (hum-002) als
              # Dezimalzahl.
              if [[ ! "$dry" =~ ^hum-([0123456789]{1,6})$ ]]; then
                echo "::error::'$REF_NAME' is not release-dry/hum-NNN"
                exit 1
              fi
              candidate="0.0.$((10#${BASH_REMATCH[1]}))"
              strict=false
            else
              candidate="$dry"
              strict=true
            fi
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            candidate="$INPUT_VERSION"
            publish=false
            strict=false
          else
            echo "::error::unexpected event '$EVENT'"
            exit 1
          fi
          # Das enge Muster ist die eigentliche Sperre gegen einen praeparierten
          # Tag-Namen: Nach dieser Zeile ist die Version nur noch Ziffern und Punkte.
          # Dasselbe Muster wie packaging/release/version.sh: 0.Y.Z, nie 1.0.0
          # oder hoeher, denn ab 1.0.0 sind Releases signiert.
          if [[ ! "$candidate" =~ ^0\.(0|[123456789][0123456789]{0,5})\.(0|[123456789][0123456789]{0,5})$ ]]; then
            echo "::error::'$candidate' is not a 0.Y.Z version. This workflow publishes unsigned releases before 1.0.0 only."
            exit 1
          fi
          if [[ ! "$SHA" =~ ^[0123456789abcdef]{40}$ ]]; then
            echo "::error::unexpected commit id '$SHA'"
            exit 1
          fi
          if [[ "$publish" == "true" ]]; then
            artifact=humanitl-release
          else
            artifact="humanitl-dry-run-$SHA"
          fi
          {
            echo "version=$candidate"
            echo "publish=$publish"
            echo "strict=$strict"
            echo "sha=$SHA"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"
          echo "version $candidate, publish $publish, strict $strict, commit $SHA, artifact $artifact"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # merge-base braucht die Historie von main.
          fetch-depth: 0

      - name: From 0.1.0 on, CHANGELOG.md has a dated section for the version
        # Die Notes ab 0.1.0 beginnen mit diesem Abschnitt (HUM-060). Hier
        # faellt ein Entwurf ohne Datum nach Sekunden auf statt erst am Ende
        # des Baus; die Vorabversionen 0.0.N haben keinen Abschnitt.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source packaging/release/version.sh
          if is_prerelease_version "$VERSION"; then
            echo "$VERSION is a pre-release; no changelog section needed"
          else
            packaging/release/changelog-section.sh "$VERSION"
          fi

      - name: The commit is on main and its CI run is green
        # Seit HUM-424 laesst ci.yml Jobs aus, die ein Push nicht beruehrt.
        # Ein Release verlangt deshalb einen Lauf, in dem jeder Job lief:
        # tools/ci-gate.sh mit HUMANITL_CI_EVERY_JOB=1, dasselbe Tor wie
        # tools/release.sh. Liess der Push-Lauf Jobs nach der Pfadregel aus
        # (Exit 4), zaehlt der volle Lauf von Hand (workflow_dispatch,
        # full=true) auf demselben Commit. tools/tests/release_guard_test.py
        # fuehrt diesen Schritt gegen ein nachgestelltes Tor aus.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          STRICT_GUARD: ${{ steps.version.outputs.strict }}
          HUMANITL_CI_REPO: ${{ github.repository }}
          HUMANITL_CI_WORKFLOW: ci.yml
          HUMANITL_CI_BRANCH: main
          HUMANITL_CI_EVERY_JOB: "1"
          HUMANITL_CI_MAY_SKIP: ""
          HUMANITL_CI_FIRST_WAIT: "0"
          HUMANITL_CI_POLL: "60"
        run: |
          set -euo pipefail
          # Im Probelauf eines Issue-Zweigs oder von Hand ist ein Verstoss eine
          # Warnung: Er soll auch einen Zweig bauen koennen. Fuer einen Tag und
          # fuer den Probelauf release-dry/0.Y.Z ist er ein Fehler.
          complain() {
            if [[ "$STRICT_GUARD" == "true" ]]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::dry run continues although: $1"
          }

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            complain "commit $SHA is not on main. Tag a commit of main that CI has passed."
            # Ein Commit ausserhalb von main hat keinen Lauf auf main.
            exit 0
          fi

          # Laeuft der Push-Lauf noch, wartet das Tor bis zu 45 Minuten: Ein
          # Tag direkt nach dem Merge soll nicht an der Reihenfolge scheitern.
          # Ohne strict genuegt eine Minute, der Lauf ist dort nur Auskunft.
          limit=60
          [[ "$STRICT_GUARD" == "true" ]] && limit=2700
          rc=0
          HUMANITL_CI_EVENT=push tools/ci-gate.sh "$SHA" "$limit" || rc=$?
          if ((rc == 4)); then
            echo "the push run of ci.yml for $SHA skipped jobs by the path rules; looking for a full run started by hand"
            rc=0
            HUMANITL_CI_EVENT=workflow_dispatch tools/ci-gate.sh "$SHA" 300 || rc=$?
            if ((rc == 4)); then
              complain "the run of ci.yml started by hand for $SHA skipped jobs as well. Start it on main with full=true."
              exit 0
            fi
          fi
          case "$rc" in
            0) echo "ci.yml for $SHA: every job green" ;;
            1) complain "ci.yml for $SHA is red. Only a green main commit is released." ;;
            3) complain "no finished ci.yml run of $SHA on main in which every job ran. Let CI finish; if its push run skipped jobs, run ci.yml on main with full=true, then re-run this workflow." ;;
            *) complain "tools/ci-gate.sh failed with $rc for $SHA (API or network?). Re-run this workflow." ;;
          esac

      - name: A tag needs a green dry run of the same commit
        # Ein Tag, der von Hand gepusht wurde statt mit tools/release.sh, kaeme
        # sonst ohne Probelauf bis zum Job release (Review HUM-060). Verlangt
        # wird der juengste Lauf dieses Workflows auf release-dry/<version>
        # fuer genau diesen Commit, beendet, jeder Job gruen ausser dem
        # uebersprungenen release. tools/ci-gate.sh ist dasselbe Tor, das
        # tools/release.sh benutzt, und gegen eine nachgestellte API getestet
        # (tools/tests/ci_gate_test.sh). Nur fuer Tags; ein Probelauf prueft
        # sich nicht selbst.
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          HUMANITL_CI_REPO: ${{ github.repository }}
          HUMANITL_CI_WORKFLOW: release.yml
          HUMANITL_CI_EVERY_JOB: "1"
          HUMANITL_CI_MAY_SKIP: release
          HUMANITL_CI_FIRST_WAIT: "0"
          HUMANITL_CI_POLL: "10"
        run: |
          set -euo pipefail
          rc=0
          HUMANITL_CI_BRANCH="release-dry/$VERSION" tools/ci-gate.sh "$SHA" 900 || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::no green dry run on release-dry/$VERSION for $SHA (ci-gate exit $rc). Tags come only from tools/release.sh after a green dry run; nothing is published. Never move this tag: fix it on main and release the next patch version with tools/release.sh."
            exit 1
          fi

  build:
    name: build
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Die Release-Notes listen die Commits seit dem vorigen v0.*-Tag,
          # und die Build-Nummer der App ist die Zahl der Commits.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - uses: ./.github/actions/setup-flutter
        with:
          linux-desktop: "true"
          protoc-plugin: "true"
      - name: Install protoc
        # Die App importiert app/lib/core/ipc/generated, das gitignored ist
        # (HUM-003); ohne protoc gibt es nichts zu importieren.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Install the packaging tools
        # dpkg-dev bringt dpkg-shlibdeps, patchelf entfernt den RUNPATH des
        # Build-Rechners aus den Plugin-Bibliotheken, musl-tools baut den Shim
        # statisch wie im CI-Job rust-test, rpm bringt rpmbuild fuer das RPM
        # (HUM-339; kompiliert wird dabei nichts, das Spec beschreibt nur den Baum).
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev patchelf musl-tools rpm

      - name: Stamp the version into this checkout
        # Nur in diesem Auscheckstand; committet wird nichts. Im Repository
        # bleibt 0.0.0 stehen; die Quelle der Version ist der Tag (HUM-060).
        run: |
          set -euo pipefail
          ./packaging/release/stamp-version.sh "$VERSION"

      - name: Build humanitld, humanitl and humanitl-shim
        run: |
          set -euo pipefail
          ./packaging/release/build-binaries.sh "$RUNNER_TEMP/bin"

      - name: Generate the Dart code
        # Proto, riverpod, freezed, ARB und die Katalog-Assets; ohne sie baut
        # die App nicht (Ziel flutter-codegen im Makefile).
        run: |
          set -euo pipefail
          make flutter-codegen

      - name: Build the Linux app
        # --build-name traegt die Version in data/flutter_assets/version.json,
        # die Build-Nummer ist die Zahl der Commits, damit sie monoton steigt
        # (HUM-060, Fallstricke).
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count HEAD)"
          cd app
          flutter build linux --release --build-name "$VERSION" --build-number "$build_number"

      - name: The export names the same version
        # Der HAR-Export schreibt die Version der App in seinen Creator-Block.
        # Dieser Test scheitert, wenn sie dort fest eingetragen ist statt aus
        # FLUTTER_BUILD_NAME zu kommen. `flutter test` nimmt FLUTTER_BUILD_NAME
        # aus app/pubspec.yaml, das stamp-version.sh oben gesetzt hat; per
        # --dart-define laesst sich die Variable nicht setzen.
        run: |
          set -euo pipefail
          cd app
          flutter test \
            --dart-define=HUMANITL_EXPECTED_VERSION="$VERSION" \
            test/features/history/history_export_version_test.dart

      - name: The binaries and the app carry the version
        run: |
          set -euo pipefail
          ./packaging/release/check-version.sh "$VERSION" "$RUNNER_TEMP/bin" \
            app/build/linux/x64/release/bundle

      - name: Build the .deb, the .rpm, the AppImage and the archive
        run: |
          set -euo pipefail
          bundle=app/build/linux/x64/release/bundle
          ./packaging/deb/build-deb.sh "$VERSION" "$RUNNER_TEMP/bin" "$bundle" dist
          # Dieselben Programme, dasselbe Bundle und dieselbe Ablage wie im .deb (HUM-339).
          ./packaging/rpm/build-rpm.sh "$VERSION" "$RUNNER_TEMP/bin" "$bundle" dist
          # Dieselben Programme und dasselbe Bundle wie im .deb (HUM-335); das
          # Werkzeug laedt das Skript selbst, auf Fassung und Pruefsumme gepinnt.
          ./packaging/appimage/build-appimage.sh "$VERSION" "$RUNNER_TEMP/bin" "$bundle" dist
          ./packaging/release/build-tarball.sh "$VERSION" "$RUNNER_TEMP/bin" "$bundle" dist
          ./packaging/release/checksums.sh dist
          dpkg-deb --info "dist/humanitl_${VERSION}_amd64.deb"
          mkdir -p dist-meta
          dpkg-deb --contents "dist/humanitl_${VERSION}_amd64.deb" > dist-meta/deb-contents.txt
          tar -tzf "dist/humanitl-${VERSION}-linux-x86_64.tar.gz" > dist-meta/tar-contents.txt
          rpm_file="dist/humanitl-${VERSION}-1.x86_64.rpm"
          rpm -qpi "$rpm_file"
          {
            rpm -qpi "$rpm_file"
            echo
            echo "## requires"
            rpm -qp --requires "$rpm_file"
            echo
            echo "## files"
            rpm -qplv "$rpm_file"
          } > dist-meta/rpm-contents.txt
          # Die Dateien des AUR-Pakets fuer genau dieses Archiv. Sie sind kein
          # Release-Asset, sondern liegen nur im Workflow-Artefakt: Ins AUR
          # laedt der Maintainer sie von Hand (packaging/aur/README.md).
          ./packaging/aur/render.sh "$VERSION" "dist/humanitl-${VERSION}-linux-x86_64.tar.gz" dist-meta/aur
          {
            echo "### humanitl $VERSION"
            echo
            echo '```'
            ls -l dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the update manifests of the archive and the AppImage
        # HUM-382: Die App eines entpackten Archivs oder eines AppImages
        # aktualisiert sich selbst, aber nur mit einem Manifest, das dieser
        # Schluessel signiert hat. Das Geheimnis sieht nur dieser Schritt; das
        # Skript schreibt es in eine Datei mit 0600 und loescht sie. Ein
        # Tag-Lauf ohne Geheimnis bricht ab.
        env:
          HUMANITL_UPDATE_SIGNING_KEY: ${{ secrets.HUMANITL_UPDATE_SIGNING_KEY }}
          REQUIRE_SIGNING: ${{ needs.guard.outputs.publish == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          ./packaging/release/sign-update.sh "$VERSION" \
            "dist/humanitl-${VERSION}-linux-x86_64.tar.gz" update-linux-x86_64.json 0 dist
          ./packaging/release/sign-update.sh "$VERSION" \
            "dist/Humanitl-${VERSION}-x86_64.AppImage" update-linux-x86_64-appimage.json 0 dist

      - name: Release notes
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./packaging/release/release-notes.sh "$VERSION" "$SHA" > dist-meta/RELEASE_NOTES.md
          cat dist-meta/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.guard.outputs.artifact }}
          path: |
            dist/
            dist-meta/
          if-no-files-found: error
          # dist-meta/aur/.SRCINFO beginnt mit einem Punkt; ohne diese Zeile
          # liesse upload-artifact die Datei aus, und check-aur faende sie nicht.
          include-hidden-files: true
          # Zwei Wochen genuegen fuer einen Probelauf; das Release selbst
          # haelt seine Dateien auf GitHub.
          retention-days: 14

  check-appimage:
    name: check-appimage
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Ohne Container: check-appimage.sh startet das Bild mit
    # --appimage-extract-and-run, braucht also kein FUSE, und schreibt nur in ein
    # Wegwerf-HOME. Installiert wird nichts (HUM-335).
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.guard.outputs.artifact }}
          path: artefacts
      - name: The AppImage runs and plans the service on its copy
        run: |
          set -euo pipefail
          image="artefacts/dist/Humanitl-${VERSION}-x86_64.AppImage"
          (cd artefacts/dist && sha256sum -c SHA256SUMS --ignore-missing)
          chmod +x "$image"
          ./packaging/appimage/check-appimage.sh "$image" "$VERSION"

  check-deb:
    name: check-deb
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Ein frisches Ubuntu 24.04, dieselbe Ausgabe wie der Runner, auf dem das
    # Paket gebaut wurde. Hier darf installiert und entfernt werden; auf einem
    # echten Rechner nie. Der Digest pinnt das Abbild wie der SHA eine Action.
    container:
      image: ubuntu:24.04@sha256:b3cc40b72b93588182b5410f723c7aaf142363311c2aa993d8a453ddcbb3ae15
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.guard.outputs.artifact }}
          path: artefacts
      - name: Install, check and purge the .deb
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/deb/check-install.sh "artefacts/dist/humanitl_${VERSION}_amd64.deb" "$VERSION"
      - name: lintian
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/deb/lintian.sh "artefacts/dist/humanitl_${VERSION}_amd64.deb"

  check-rpm:
    name: check-rpm
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Ein frisches Fedora 44. Das RPM verlangt glibc 2.39 (Bau auf Ubuntu
    # 24.04); Fedora 40 ist die aelteste passende Ausgabe, aber am Ende ihrer
    # Pflege, geprueft wird deshalb die aktuelle. Wie bei check-deb darf hier
    # installiert und entfernt werden, und der Digest pinnt das Abbild.
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.guard.outputs.artifact }}
          path: artefacts
      - name: Install, check and remove the .rpm
        shell: bash
        run: |
          set -euo pipefail
          (cd artefacts/dist && sha256sum -c SHA256SUMS --ignore-missing)
          ./packaging/rpm/check-install.sh "artefacts/dist/humanitl-${VERSION}-1.x86_64.rpm" "$VERSION"
      - name: rpmlint
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/rpm/rpmlint.sh "artefacts/dist/humanitl-${VERSION}-1.x86_64.rpm"

  check-aur:
    name: check-aur
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Ein frisches Arch Linux mit base-devel (makepkg). check-aur.sh baut aus
    # den gerenderten Dateien und dem Archiv dieses Laufs, statt es von GitHub
    # zu laden, installiert, prueft und entfernt das Paket und vergleicht Pfade
    # und Rechte mit dem .deb. Nichts davon geht ins AUR.
    container:
      image: archlinux:base-devel@sha256:624bdc7fc6615155d67bc34cf7146c0c9fd0e3c92943977da63a630e4ca49c30
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.guard.outputs.artifact }}
          path: artefacts
      - name: Build with makepkg, install, check and remove humanitl-bin
        shell: bash
        run: |
          set -euo pipefail
          (cd artefacts/dist && sha256sum -c SHA256SUMS --ignore-missing)
          ./packaging/aur/check-aur.sh artefacts/dist-meta/aur \
            "artefacts/dist/humanitl-${VERSION}-linux-x86_64.tar.gz" "$VERSION" \
            "artefacts/dist/humanitl_${VERSION}_amd64.deb"

  build-macos:
    name: build-macos
    needs: guard
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-macos
      - uses: ./.github/actions/setup-flutter
        with:
          protoc-plugin: "true"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      - name: Install dmgbuild
        # Writes the Finder layout of the disk image itself; no Finder is
        # remote controlled on the runner. The package and its dependencies
        # are pinned with hashes, like every action is pinned to a commit.
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet --require-hashes --no-deps \
            -r packaging/macos/dmg/requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmg/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Stamp the version into this checkout
        run: |
          set -euo pipefail
          ./packaging/release/stamp-version.sh "$VERSION"

      - name: Build universal humanitld, humanitl and humanitl-shim
        run: |
          set -euo pipefail
          ./packaging/macos/build-binaries.sh "$RUNNER_TEMP/bin"
          ./packaging/release/check-version.sh "$VERSION" "$RUNNER_TEMP/bin"

      - name: Generate the Dart code
        run: |
          set -euo pipefail
          make flutter-codegen

      - name: Build the macOS app
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count HEAD)"
          cd app
          flutter build macos --release --build-name "$VERSION" --build-number "$build_number"

      - name: Bundle, sign ad hoc, disk image and zip
        run: |
          set -euo pipefail
          ./packaging/macos/build-app.sh "$VERSION" "$RUNNER_TEMP/bin" \
            app/build/macos/Build/Products/Release/Humanitl.app dist-macos
          ( cd dist-macos && shasum -a 256 Humanitl-*.dmg Humanitl-*.zip > SHA256SUMS-macos )
          {
            echo "### Humanitl $VERSION for macOS"
            echo
            echo '```'
            ls -l dist-macos
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the update manifest of the zip
        # HUM-382: Die App laedt das Zip nur, wenn dieses Manifest mit dem
        # Release-Schluessel signiert ist; min_os ist das Deployment-Target
        # der App. Das Geheimnis sieht nur dieser Schritt.
        env:
          HUMANITL_UPDATE_SIGNING_KEY: ${{ secrets.HUMANITL_UPDATE_SIGNING_KEY }}
          REQUIRE_SIGNING: ${{ needs.guard.outputs.publish == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          ./packaging/release/sign-update.sh "$VERSION" \
            "dist-macos/Humanitl-${VERSION}-macos.zip" update-macos.json 12.0 dist-macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.guard.outputs.artifact }}-macos
          path: dist-macos/
          if-no-files-found: error
          retention-days: 14

  check-macos:
    name: check-macos
    needs: [guard, build-macos]
    # A runner that has never seen the build: the disk image is all it gets.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.guard.outputs.artifact }}-macos
          path: artefacts
      - name: Mount the disk image and take the app out
        run: |
          set -euo pipefail
          cd artefacts
          shasum -a 256 -c SHA256SUMS-macos
          mount="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mount" "$RUNNER_TEMP/Applications"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "Humanitl-$VERSION-macos.dmg"
          test -L "$mount/Applications" || { echo "::error::the disk image has no Applications link"; exit 1; }
          test -f "$mount/.background.tiff" -a -f "$mount/.DS_Store" || { echo "::error::the disk image has no background"; exit 1; }
          ditto "$mount/Humanitl.app" "$RUNNER_TEMP/Applications/Humanitl.app"
          hdiutil detach "$mount" || hdiutil detach -force "$mount"
          echo "APP=$RUNNER_TEMP/Applications/Humanitl.app" >> "$GITHUB_ENV"
      - name: Signature, architectures and version
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          for program in "$APP/Contents/MacOS/Humanitl" "$APP"/Contents/MacOS/bin/*; do
            archs="$(lipo -archs "$program")"
            echo "$program: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] ||
              { echo "::error::$program is not universal: $archs"; exit 1; }
          done
          ./packaging/release/check-version.sh "$VERSION" "$APP/Contents/MacOS/bin"
          got="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          [[ "$got" == "$VERSION" ]] || { echo "::error::the app carries version $got"; exit 1; }
      - name: The zip carries the same app and its notes
        run: |
          set -euo pipefail
          # With plain unzip, which drops extended attributes, like many tools
          # do: the signature must not live in them.
          zipped="$RUNNER_TEMP/zip"
          mkdir -p "$zipped"
          /usr/bin/unzip -q "artefacts/Humanitl-$VERSION-macos.zip" -d "$zipped"
          for file in Humanitl.app README.md LICENSE INSTALL.txt; do
            test -e "$zipped/Humanitl/$file" || { echo "::error::the zip lacks Humanitl/$file"; exit 1; }
          done
          codesign --verify --deep --strict "$zipped/Humanitl/Humanitl.app"
          # The same signed bundle: the code directory hash covers the
          # executable and, through the sealed resources, every other file.
          cdhash() { codesign -dvvv "$1" 2>&1 | sed -n 's/^CDHash=//p'; }
          [[ "$(cdhash "$zipped/Humanitl/Humanitl.app")" == "$(cdhash "$APP")" ]] ||
            { echo "::error::the app in the zip differs from the one in the disk image"; exit 1; }
      - name: The app starts
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/app-home"
          mkdir -p "$home"
          HOME="$home" "$APP/Contents/MacOS/Humanitl" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app ended within 10 s: $(tail -20 "$RUNNER_TEMP/app.log" | tr '\n' ' ')"
            exit 1
          fi
          kill "$pid"
      - name: Seatbelt escape tests against the bundled programs
        run: |
          set -euo pipefail
          ./tests/escape/macos/run.sh "$APP/Contents/MacOS/bin"

  release:
    name: release
    needs: [guard, build, check-deb, check-rpm, check-aur, check-appimage, build-macos, check-macos]
    # Nur ein Tag legt ein Release an. Der Probelauf endet mit check-deb,
    # check-rpm, check-aur, check-appimage und check-macos. Die Bedingung
    # prueft das Ereignis selbst noch einmal, damit kein Probelauf-Zweig
    # diesen Job erreicht, selbst wenn guard einmal falsch rechnete.
    if: >-
      needs.guard.outputs.publish == 'true' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Die einzige Stelle im Repository, die schreibt.
      contents: write
      # Nur, um danach den Bau der Website anzustoßen (HUM-333).
      actions: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      CHECKED_SHA: ${{ needs.guard.outputs.sha }}
      REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.guard.outputs.artifact }}
          path: artefacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.guard.outputs.artifact }}-macos
          path: artefacts/macos
      - name: Add the macOS files and their sums to the Linux ones
        # One SHA256SUMS for all assets; each half was summed where it was
        # built, and both are checked here before anything is published.
        run: |
          set -euo pipefail
          cd artefacts/macos
          shasum -a 256 -c SHA256SUMS-macos
          cp "Humanitl-$VERSION-macos.dmg" "Humanitl-$VERSION-macos.zip" \
            update-macos.json update-macos.json.sig ../dist/
          cat SHA256SUMS-macos >> ../dist/SHA256SUMS
      - name: Create the release, if the tag still points at the checked commit
        # Pruefung und Anlegen in einem Schritt, damit zwischen beiden nichts
        # liegt. Zwischen guard und hier liegt der ganze Bau: Wer den Tag in der
        # Zeit verschiebt oder einen alten Lauf neu startet, bekaeme sonst ein
        # Release, dessen Tag auf einen ungeprueften Commit zeigt, waehrend die
        # Dateien vom geprueften stammen. Der Tag wird deshalb unmittelbar vor
        # dem Anlegen ueber die API aufgeloest, annotierte Tags bis zum Commit.
        #
        # `--target` schuetzt dabei nicht: Existiert der Tag schon, und
        # `--verify-tag` verlangt das, ignoriert GitHub `target_commitish`.
        # Zwischen Pruefung und Anlegen bleibt also ein kurzes Fenster. Es
        # wird danach geschlossen: Das Release entsteht als Entwurf, der Tag
        # wird noch einmal aufgeloest, und zeigt er dann woanders hin, wird
        # der Entwurf wieder geloescht (der Tag bleibt, er gehoert nicht diesem
        # Lauf). Nur wenn er stimmt, wird der Entwurf veroeffentlicht.
        #
        # gh statt einer weiteren Action: eine Abhaengigkeit weniger, die
        # contents: write in die Hand bekommt. Gibt es das Release schon
        # (erneuter Lauf), scheitert der Befehl, statt etwas zu ueberschreiben;
        # ein Tag wird nie neu gesetzt, stattdessen steigt die Patch-Nummer.
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [[ "$REF_NAME" != "$tag" ]]; then
            echo "::error::ref '$REF_NAME' is not the checked tag '$tag'"
            exit 1
          fi
          cd artefacts/dist
          sha256sum -c SHA256SUMS

          # `git/ref/` (Einzahl) ist der dokumentierte Endpunkt "Get a
          # reference" und liefert genau ein Objekt oder 404. Die Mehrzahl
          # `git/refs/` ist die alte Form, die bei einem Praefix-Treffer
          # (v0.0.1 neben v0.0.10) eine Liste liefert.
          # Gibt "commit <sha>" aus, annotierte Tags bis zum Commit aufgeloest.
          tag_commit() {
            local type sha
            read -r type sha <<<"$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '"\(.object.type) \(.object.sha)"')"
            for _ in 1 2 3 4 5; do
              [[ "$type" == "tag" ]] || break
              read -r type sha <<<"$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '"\(.object.type) \(.object.sha)"')"
            done
            echo "$type $sha"
          }

          before="$(tag_commit)"
          if [[ "$before" != "commit $CHECKED_SHA" ]]; then
            echo "::error::tag $tag now points at $before, but guard checked $CHECKED_SHA. Nothing is released; tag a new patch number instead of moving a tag."
            exit 1
          fi
          echo "tag $tag points at $CHECKED_SHA, the commit guard checked"

          # Erst als Entwurf: Ein Entwurf ist nicht oeffentlich und loest kein
          # "published" aus. `--verify-tag` bindet ihn an den vorhandenen Tag.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Humanitl $VERSION" \
            --notes-file ../dist-meta/RELEASE_NOTES.md \
            "humanitl_${VERSION}_amd64.deb" \
            "humanitl-${VERSION}-1.x86_64.rpm" \
            "Humanitl-${VERSION}-x86_64.AppImage" \
            "humanitl-${VERSION}-linux-x86_64.tar.gz" \
            "Humanitl-${VERSION}-macos.dmg" \
            "Humanitl-${VERSION}-macos.zip" \
            update-macos.json update-macos.json.sig \
            update-linux-x86_64.json update-linux-x86_64.json.sig \
            update-linux-x86_64-appimage.json update-linux-x86_64-appimage.json.sig \
            SHA256SUMS

          # Das Fenster zwischen Pruefung und Anlegen schliessen: Zeigt der Tag
          # jetzt woanders hin, gehoert der Entwurf nicht zum geprueften
          # Commit und wird wieder geloescht. Den Tag loescht dieser Lauf nicht.
          after="$(tag_commit)"
          if [[ "$after" != "commit $CHECKED_SHA" ]]; then
            if ! gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false; then
              echo "::error::tag $tag moved to $after; guard checked $CHECKED_SHA. Deleting the draft FAILED: delete the draft release $tag by hand, it was never published."
              exit 1
            fi
            echo "::error::tag $tag moved to $after while the release was created; guard checked $CHECKED_SHA. The draft was deleted, nothing was published."
            exit 1
          fi
          echo "after creating the draft, tag $tag still points at $CHECKED_SHA"

          # Only now publish it, as a regular release marked latest.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          echo "published $tag as a release"
      - name: The website shows the new release
        # Ein Release, das dieser Lauf mit GITHUB_TOKEN veröffentlicht, startet keinen
        # anderen Workflow; der Bau von humanitl.de wird deshalb ausdrücklich angestoßen,
        # damit die Download-Seite die neue Version sofort zeigt (HUM-333). Scheitert das,
        # holt der tägliche Lauf es nach; das Release selbst steht dann schon.
        run: |
          gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main ||
            echo "::warning::the website build could not be triggered; its daily run will show $REF_NAME"
