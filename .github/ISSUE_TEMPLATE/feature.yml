name: Feature request
description: Suggest a new capability or a change in behaviour.
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stands in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should Humanitl do instead? Describe it from the user's side.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - daemon
        - proxy
        - sandbox
        - cli
        - app
        - packaging
        - ci
        - docs
        - website
        - not sure
    validations:
      required: true
