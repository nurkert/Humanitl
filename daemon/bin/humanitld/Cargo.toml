[package]
name = "humanitld"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
humanitl-config.workspace = true
humanitl-core.workspace = true
humanitl-ipc.workspace = true
humanitl-proxy.workspace = true
# Der Regelsatz wird beim Start gelesen und in die Proxy-Pipeline gehängt
# (HUM-023); HUM-027 tauscht ihn zur Laufzeit über den `Rules`-RPC.
humanitl-rules.workspace = true
# `humanitl-findings` steht hier nicht mehr: Die Detektoren werden beim Start
# über `humanitl_proxy::Tier1Scanner` gebaut, und die Einstellungen dazu kommen
# aus `humanitl_ipc::summary::findings_settings` — dieselbe Ableitung, die auch
# die Zusammenfassung eines Sandbox-Laufs benutzt (HUM-025, HUM-043).
# Die Aufzeichnung wird beim Start geöffnet und an Warteschlange, Handler und
# gRPC-Dienst gehängt (HUM-026).
humanitl-recorder.workspace = true
# Der Domain-Katalog wird beim Start geladen und hängt am Ereignisstrom
# (HUM-031).
humanitl-catalog.workspace = true
# Der Agent-Adapter liefert die Durchreichregel zum Sprachmodell aus
# `llm.endpoint`; sie wird vor jeder anderen Regel ausgewertet
# (`backlog/CONVENTIONS.md` 4.5, HUM-039, HUM-104).
# `tools/deps-allow.toml` erlaubt die Kante für die Gruppe `bins`.
humanitl-sandbox.workspace = true

clap.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Die Tests zu `load_rules` werten den geladenen Regelsatz aus; `evaluate`
# nimmt den Zeitpunkt als Argument (HUM-104).
chrono.workspace = true
# Der End-to-End-Test schickt dem gestarteten Binary ein `SIGTERM`; nur der
# geordnete Weg raeumt Socket und Token weg.
libc.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
