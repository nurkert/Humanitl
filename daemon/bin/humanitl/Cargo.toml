edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
humanitl-config.workspace = true
humanitl-core.workspace = true
humanitl-ipc.workspace = true
humanitl-sandbox.workspace = true

chrono.workspace = true
