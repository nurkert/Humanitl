[package]
name = "humanitl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# `audit verify --file` und `audit export --file` lesen die Kette selbst, wenn
# der Daemon nicht antwortet; die Pruefung und das Record-Format stehen in
# `humanitl-audit` und werden hier nicht nachgebaut (HUM-070).
humanitl-audit.workspace = true
humanitl-config.workspace = true
humanitl-core.workspace = true
humanitl-ipc.workspace = true
humanitl-sandbox.workspace = true

chrono.workspace = true
clap.workspace = true
# Der Kopf-Hash der Kette kommt ueber die Wire-Form als Bytes und steht in der
# Ausgabe als Hex, wie ueberall sonst im Audit-Log.
hex.workspace = true
# `rules add --expires <RFC 3339>` baut einen `google.protobuf.Timestamp`; die
# Wire-Form kennt keinen anderen Weg, einen Zeitpunkt zu schreiben.
prost-types.workspace = true
serde_json.workspace = true
# `config set` schreibt genau einen Wert in die `config.toml` des Menschen:
# `toml_edit` aendert das Dokument, ohne Kommentare und Reihenfolge zu
# verlieren, und `toml` ist die Gegenprobe, dass wirklich nur dieser eine Wert
# anders ist (dieselbe Paarung wie in `humanitl_config::edit`).
toml.workspace = true
toml_edit.workspace = true
# `sandbox attach` setzt das eigene Terminal in den Rohmodus und liest seine
# Groesse (`tcgetattr`, `tcsetattr`, `tcgetwinsize`). Ohne rustix braeuchte das
# `unsafe`. Noch nicht unter [workspace.dependencies], wie in
# `crates/sandbox/Cargo.toml`; der Parent traegt die Version dort ein.
# `event` kommt mit `--ask terminal` dazu: Der Tastenleser wartet mit `poll`
# statt in einem blockierenden `read`, damit er die Eingabe loslassen kann,
# solange der `$EDITOR` laeuft.
# `fs` kommt mit `audit export` dazu: `renameat2` mit `RENAME_NOREPLACE`, wo ein
# Dateisystem keine harten Verweise kennt (HUM-070).
rustix = { version = "1.1", features = ["stdio", "termios", "event", "fs"] }
# `sandbox check` legt seinen Platzhalter-Socket und die Platzhalter-Dateien
# der CA in einem eigenen Verzeichnis an, das mit dem Prozess verschwindet:
# der Selbsttest darf dem laufenden Daemon nichts wegnehmen.
tempfile.workspace = true
tokio.workspace = true
# `sandbox attach` schickt einen Strom von Tastendruecken an den Daemon;
# `ReceiverStream` ist die Bruecke vom Kanal zum gRPC-Strom.
tokio-stream.workspace = true
tonic.workspace = true

[dev-dependencies]
# Der Integrationstest startet einen echten gRPC-Dienst (den Fake-Daemon aus
# HUM-005) auf einem eigenen Socket und ruft das gebaute Binary dagegen auf.
shlex.workspace = true
# `tests/tty.rs` braucht ein Pseudoterminal, um die Rueckgabe des Rohmodus zu
# messen, und ein Signal, um den Lauf zu beenden. Die Merkmale stehen
# vollstaendig da und nicht als Ergaenzung der Zeile oben: Cargo fasst beide
# zusammen, aber wer hier liest, soll nicht zwei Listen im Kopf vereinigen
# muessen.
rustix = { version = "1.1", features = [
  "stdio",
  "termios",
  "event",
  "pty",
  "process",
] }
