[package]
name = "humanitl-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
humanitl-core.workspace = true
# `edit::set_value` sperrt das Verzeichnis von `config.toml` mit `flock`,
# damit der Daemon (`SetConfig`) und `humanitl config set` einander keinen
# Wert verlieren (HUM-070). `std::fs::File::lock` käme erst mit Rust 1.89,
# und die Untergrenze des Workspace ist 1.88.
rustix.workspace = true
schemars.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Nur für den Test `llm_only_blocks_everything_but_passthrough`: er baut den
# Regelsatz des Profils `llm-only` und wertet ihn aus. Eine Test-Abhängigkeit
# zeigt nicht nach außen (`tools/check_deps.py` überspringt `kind = "dev"`);
# im Bibliothekscode bleibt `humanitl-config` bei `humanitl-core`.
humanitl-rules.workspace = true
chrono.workspace = true
tempfile.workspace = true
