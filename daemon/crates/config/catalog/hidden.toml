# Leaves of the configuration schema without a row in the settings catalog,
# each with the reason (HUM-534). `src/catalog.rs` reads this file;
# `tests/catalog.rs` checks that every schema leaf has a catalog entry or a
# line here, and that every line names a leaf and a known reason. The
# reasons are data, not code, so naming the fields of a sandbox backend
# here does not couple Rust source to a backend (`tools/check_coupling.py`).

[reasons]
file_only = "an expert value: only in config.toml (humanitl config set or edit), no row"
backend_tuning = "tuning of one sandbox backend: only in config.toml, the backend row chooses the backend"
agent_source = "per agent through humanitl agents source and the RPC Agents; the section in the app is HUM-521"
project_only = "chosen per project on the first-start screen (Projects.save_choice, HUM-538); globally only in config.toml"
server_table = "written by LlmServers through the row llm.servers, never by hand"
terminal = "a setting of the terminal client; only in config.toml until the settings TUI edits it (HUM-541)"
env_ca_only = "only the CA variable of a TLS_001 fix goes through SetConfig, never a free value"

