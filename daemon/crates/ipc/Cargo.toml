[package]
name = "humanitl-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
humanitl-catalog.workspace = true
humanitl-config.workspace = true
humanitl-core.workspace = true
humanitl-proxy.workspace = true
# Der Regel-RPC (HUM-027) wertet eine Regel gegen aufgezeichnete Flows aus
# (`dry_run`) und liest den Regelspeicher des Proxys; `tools/deps-allow.toml`
# erlaubt beide Kanten.
humanitl-recorder.workspace = true
humanitl-rules.workspace = true
# Die `Sandbox`-RPC (HUM-040) liest das Profil, baut die Kommandozeile und
# startet sie; `tools/deps-allow.toml` erlaubt die Kante seit Sprint 0.
humanitl-sandbox.workspace = true

chrono.workspace = true

base64.workspace = true
dashmap.workspace = true
bytes.workspace = true
prost.workspace = true
prost-types.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
# Die Endpunkt-Probe (HUM-039) bekommt `llm.endpoint` als Text und liest ihn
# als `Url`, bevor irgendetwas den Rechner verlaesst.
url.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
# `tests/proto_contract.rs` uebersetzt die `.proto`-Dateien selbst und
# vergleicht das Ergebnis mit dem eingecheckten `proto/descriptor.binpb`.
protox.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
