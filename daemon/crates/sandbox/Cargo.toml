[package]
name = "humanitl-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
humanitl-core.workspace = true
humanitl-config.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Der Agent-Adapter (HUM-037): `llm.endpoint` ist eine `url::Url`, und die
# Passthrough-Regel traegt eine feste UUID-Literal-Id.
url.workspace = true
uuid.workspace = true
# Sichere Huellen um memfd_create(2), fcntl(2) und kill(2): der Launcher legt
# die Maskendatei als versiegeltes memfd an, vererbt Deskriptoren ohne
# CLOEXEC an bwrap und beendet die Sandbox mit SIGTERM. Ohne rustix braeuchte
# das `unsafe`, und diese Crate verbietet es (`#![forbid(unsafe_code)]`).
# Noch nicht unter [workspace.dependencies]; der Parent traegt die Version dort
# ein (Handoff HUM-011).
rustix = { version = "1.1", features = ["fs", "process"] }
# Die Zusammenfassung eines Sandbox-Laufs baut aus einem Host-Pfad einen
# Befehl fuer die Zwischenablage (HUM-043, `summary::copy_command`). Der Pfad
# kommt aus einem Verzeichnis, in das der Agent schreiben darf; er wird nur
# dann zu einem Befehl, wenn `shlex::try_quote` ihn zitieren kann und
# `shlex::split` daraus wieder genau diesen einen Pfad macht.
shlex.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Nur im Test: der mitgelieferte Regelsatz des Adapters wird mit dem echten
# Parser gelesen und ausgewertet. Als Abhaengigkeit der Bibliothek waere das
# ein Verstoss gegen `tools/deps-allow.toml`; als Dev-Abhaengigkeit ist es
# erlaubt (`tools/check_deps.py` ueberspringt `kind == "dev"`), und der Adapter
# liefert deshalb den Text der Datei statt geparster Regeln.
humanitl-rules.workspace = true
chrono.workspace = true
