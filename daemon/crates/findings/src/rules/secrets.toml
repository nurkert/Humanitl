# Regel-Set der Secret-Detektoren, im Format von gitleaks (HUM-025).
#
# Jede Regel hat:
#   id           stabiler Name, erscheint in Tests und in Meldungen
#   kind         "api_key" (mit provider) oder "jwt"
#   provider     der Anbieter, wird zu FindingKind::ApiKey(provider)
#   regex        das Muster, gelesen mit regex::bytes
#   source       Herkunft des Musters: die gitleaks-Regel-ID oder "humanitl"
#   header_only  optional; die Regel greift nur in genau diesem Header
#   capture      optional; welche Gruppe der Bereich des Fundes ist (Vorgabe 0)
#
# Die Muster tragen keine verschachtelten Quantifizierer über unbegrenzten
# Klassen: der regex-Crate läuft zwar ohne Backtracking, aber ein solches
# Muster lässt den Automaten wachsen. Eine große feste Wiederholung ist aus
# demselben Grund schlechter als ein offenes {n,}: {20,4096} braucht 4096
# Zustände, {20,} braucht eine Schleife.

[[rules]]
id = "aws-access-token"
kind = "api_key"
provider = "aws"
source = "gitleaks:aws-access-token"
regex = '''\b(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'''

[[rules]]
id = "github-token"
kind = "api_key"
provider = "github"
source = "gitleaks:github-pat"
regex = '''\b(?:ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{36}\b'''

[[rules]]
id = "github-fine-grained-pat"
kind = "api_key"
provider = "github"
source = "gitleaks:github-fine-grained-pat"
regex = '''\bgithub_pat_[0-9A-Za-z_]{82}\b'''

[[rules]]
id = "openai-legacy-key"
kind = "api_key"
provider = "openai"
source = "gitleaks:openai-api-key"
regex = '''\bsk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}\b'''

[[rules]]
id = "openai-scoped-key"
kind = "api_key"
provider = "openai"
source = "humanitl"
regex = '''\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}\b'''

[[rules]]
id = "anthropic-api-key"
kind = "api_key"
provider = "anthropic"
source = "gitleaks:anthropic-api-key"
regex = '''\bsk-ant-api03-[A-Za-z0-9_-]{93}AA\b'''

[[rules]]
id = "slack-token"
kind = "api_key"
provider = "slack"
source = "gitleaks:slack-bot-token"
regex = '''\bxox[baprs]-[0-9A-Za-z-]{10,72}\b'''

[[rules]]
id = "stripe-secret-key"
kind = "api_key"
provider = "stripe"
source = "gitleaks:stripe-access-token"
regex = '''\b(?:sk|rk)_(?:live|test)_[0-9A-Za-z]{24,99}\b'''

[[rules]]
id = "google-api-key"
kind = "api_key"
provider = "google"
source = "gitleaks:gcp-api-key"
regex = '''\bAIza[0-9A-Za-z_-]{35}\b'''

[[rules]]
id = "private-key-header"
kind = "api_key"
provider = "private_key"
source = "gitleaks:private-key"
regex = '''-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'''

[[rules]]
id = "authorization-bearer"
kind = "api_key"
provider = "bearer"
source = "humanitl"
header_only = "authorization"
capture = 1
regex = '''(?i)^bearer\s+([A-Za-z0-9._~+/-]{20,}=*)$'''

[[rules]]
id = "authorization-basic"
kind = "api_key"
provider = "basic"
source = "humanitl"
header_only = "authorization"
capture = 1
regex = '''(?i)^basic\s+([A-Za-z0-9+/]{8,}=*)$'''

[[rules]]
id = "jwt"
kind = "jwt"
source = "gitleaks:jwt"
regex = '''\bey[A-Za-z0-9]{17,}\.ey[A-Za-z0-9/\\_-]{17,}\.(?:[A-Za-z0-9/\\_-]{10,}={0,2})?'''
