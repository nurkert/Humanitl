[package]
name = "humanitl-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
libc.workspace = true
humanitl-core.workspace = true
humanitl-config.workspace = true
# Die Regel-Engine (HUM-022) entscheidet im Proxy-Pfad, was ohne Menschen
# entschieden wird (ADR-007, HUM-023); `tools/deps-allow.toml` erlaubt die
# Kante. `chrono` kommt dazu, weil `RuleSet::evaluate` den Zeitpunkt für
# `expires` braucht.
humanitl-rules.workspace = true
# Die Detektoren (HUM-025) laufen im Proxy-Pfad, bevor eine Regel greift;
# `tools/deps-allow.toml` erlaubt die Kante.
humanitl-findings.workspace = true
# Die Aufzeichnung (HUM-026) haengt im Trichter der Halte-Warteschlange und im
# Handler, der als Einziger die Bytes in der Hand haelt;
# `tools/deps-allow.toml` erlaubt die Kante.
humanitl-recorder.workspace = true
chrono.workspace = true
dashmap.workspace = true
# Die Endpunkt-Probe (HUM-039) liest die Modelllisten von Ollama und einer
# OpenAI-kompatiblen API und nimmt `llm.endpoint` als `Url` entgegen.
serde_json.workspace = true
url.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
sha2.workspace = true
http.workspace = true
bytes.workspace = true
# CA und Leaf-Zertifikate (HUM-014). hudsucker 0.24 verlangt dieselben
# Fassungen (rcgen ^0.14 mit x509-parser, rustls 0.23 via tokio-rustls ^0.26,
# time ^0.3); die Versionen wandern nach daemon/Cargo.toml (Handoff).
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3", default-features = false, features = ["std"] }
zeroize = "1"
# MITM-Proxy-Kern (HUM-015). Eigener Accept-Loop auf hyper 1 statt hudsucker
# (Spike: hudsucker 0.24.1 nimmt nur einen `TcpListener`, keinen
# `UnixListener`; sein Client und seine CA werden ohnehin ersetzt). Diese
# Fassungen wandern nach daemon/Cargo.toml (Handoff).
hyper = { version = "1.11", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile.workspace = true
# Nur im Test: `start_paused` für die Timer der Halte-Warteschlange (HUM-016).
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
# Nur im Test: liest `[env]` aus profiles/sandbox/*.toml, um das Env-Kit abzugleichen.
toml.workspace = true
# Fake-Upstream und Clients der Integrationstests (HUM-015/HUM-017).
axum = "0.8"
hyper = { version = "1.11", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream.workspace = true
