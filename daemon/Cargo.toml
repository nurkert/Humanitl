[workspace]
resolver = "3"
members = [
  "crates/core-types",
  "crates/config",
  "crates/rules",
  "crates/findings",
  "crates/recorder",
  "crates/audit",
  "crates/sandbox",
  "crates/catalog",
  "crates/proxy",
  "crates/ipc",
  "bin/humanitld",
  "bin/humanitl",
  "bin/humanitl-shim",
  "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/nurkert/Humanitl"
rust-version = "1.88"

[workspace.dependencies]
humanitl-core = { path = "crates/core-types" }
humanitl-config = { path = "crates/config" }
humanitl-rules = { path = "crates/rules" }
humanitl-findings = { path = "crates/findings" }
humanitl-recorder = { path = "crates/recorder" }
humanitl-audit = { path = "crates/audit" }
humanitl-sandbox = { path = "crates/sandbox" }
humanitl-catalog = { path = "crates/catalog" }
humanitl-proxy = { path = "crates/proxy" }
humanitl-ipc = { path = "crates/ipc" }

tokio = { version = "1", features = ["full"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Shared third-party versions. Crates opt in with `dep.workspace = true`.
# Add a new entry here, never a bare version in a member crate.
http = "1.5"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
url = "2.5"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
schemars = "1.2"
toml = "1.1"
serde_yaml_ng = "0.10"
globset = "0.4"
regex = "1.13"
idna = "1.1"
psl = "2.1"
sha2 = "0.11"
hmac = "0.13"
dashmap = "6.2"
clap = { version = "4.6", features = ["derive", "env"] }
aho-corasick = "1.1"
tempfile = "3"
base64 = "0.22"
libc = "0.2"
seccompiler = "0.5"
# Entpacken gepackter Bodies fuer die Findings (HUM-025), mit Cap und Ratio.
flate2 = "1"
brotli = "8"
# Aufzeichnung (HUM-026): SQLite eingebettet gebaut, damit kein System-SQLite
# mit anderer Version die Migrationen ueberrascht.
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
shlex = "2"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
# `Diagnostic` is the error type of this codebase by design (ADR-012); it is
# larger than clippy's default threshold, and boxing every error would push
# the design decision into every signature. Allowed once, here, on purpose.
result_large_err = "allow"

# Das Profil, mit dem `humanitl-shim` ausgeliefert wird (HUM-012).
#
# Der Shim ist das einzige Binary, das in die Sandbox eingehaengt wird, und die
# Sandbox hat keine Bibliotheken des Hosts: er muss statisch sein
# (`ldd` sagt "not a dynamic executable") und klein bleiben (unter 2 MB). Ein
# eigenes Profil statt `[profile.release]`, weil `opt-level = "z"`,
# `lto = "fat"` und `panic = "abort"` fuer den Daemon und die Bibliotheken die
# falschen Werte waeren; gebaut wird er mit
#
#   cargo rustc -p humanitl-shim --bin humanitl-shim --profile shim \
#     -- -C target-feature=+crt-static -C relocation-model=static
#
# beziehungsweise mit `--target x86_64-unknown-linux-musl`, wenn die Toolchain
# das Ziel hat. `tests/escape/run.sh` baut ihn genau so und prueft beides.
[profile.shim]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
