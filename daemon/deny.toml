[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Jede Ausnahme nennt Grund und Prüfdatum. Ist das Datum überschritten, wird
# sie neu bewertet oder entfernt, nicht stillschweigend verlängert.
ignore = [
  # unsafe-libyaml ist archiviert, nicht verwundbar: Es gibt keine bekannte
  # Lücke, nur keine Pflege mehr. Es kommt über serde_yaml_ng und liest
  # ausschließlich lokale Dateien des Nutzers und des Pakets (rules.yaml,
  # Katalog), nie Daten aus dem Netz oder vom Agenten. Regeln aus dem RPC
  # werden vor dem Schreiben validiert und nur serialisiert (Emitter); geparst
  # wird nur die lokale Datei. Der Wechsel auf einen Parser in sicherem Rust
  # (serde-saphyr) ändert Fehlertexte, Fundstellen und die Ausgabe von
  # `to_string` und ist deshalb ein eigenes Folge-Issue, nicht Teil von
  # HUM-236. Prüfen bis 2027-01-16.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, no known vulnerability; parses only local rules and catalog files; RPC rules are validated first and only serialized (emitter); replacement tracked separately, review by 2027-01-16" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0",
  "MPL-2.0", "Zlib", "GPL-3.0-only",
  # webpki-roots liefert die Wurzelzertifikate von Mozilla. Das ist ein
  # Datensatz, kein Code, und traegt deshalb eine Datenlizenz: CDLA-Permissive
  # 2.0 erlaubt Weitergabe und Aenderung ohne Bedingungen fuer den Empfaenger.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
# Workspace members reference each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
