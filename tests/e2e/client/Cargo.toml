# Der Testklient des M1-Demoskripts (HUM-021).
#
# Ein eigenes, winziges Cargo-Projekt neben dem Skript und kein Mitglied des
# Arbeitsbereichs unter `daemon/`: Das Demoskript braucht einen gRPC-Klienten,
# solange `humanitl flows` aus HUM-064 noch nicht steht, und ein Testhelfer
# soll dafür weder `daemon/Cargo.toml` anfassen noch im ausgelieferten
# Arbeitsbereich auftauchen. Sobald die Kommandozeile `humanitl flows decide`
# kennt, nimmt `lib.sh` sie und dieses Verzeichnis kann verschwinden.
#
# Die Sperrdatei ist eine Kopie von `daemon/Cargo.lock`, damit hier dieselben
# Fassungen übersetzt werden wie dort; mit demselben `CARGO_TARGET_DIR` fällt
# der Bau dadurch auf die schon gebauten Artefakte zurück.
[package]
name = "humanitl-e2e-client"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/nurkert/Humanitl"
rust-version = "1.88"
publish = false

[[bin]]
name = "e2e-client"
path = "src/main.rs"

[dependencies]
humanitl-ipc = { path = "../../../daemon/crates/ipc" }

serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
