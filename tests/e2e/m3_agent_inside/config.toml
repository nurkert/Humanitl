# Die Konfiguration des M3-Demolaufs (HUM-046), als Vorlage.
#
# `run.sh` ersetzt darin `@UPSTREAM_ADDR@`, `@TEST_CA@` und `@LLM_ENDPOINT@`
# und legt das Ergebnis als `$XDG_CONFIG_HOME/humanitl/config.toml` des
# Wegwerf-Baums ab. Der Daemon findet es dort von selbst; ein eigener
# `--config`-Schalter ist dafür nicht nötig (`humanitl_config::discover_with`).
#
# Zwei der Schlüssel hier sind Test-Hebel und im Alltag falsch:
# `resolver.overrides` und `resolver.test_ca`, beide im Tier `expert`. Der
# Rest sind gewöhnliche Einstellungen — `llm.endpoint` (Tier `basic`) ist die
# Einrichtung dieser Maschine und zeigt im Demolauf auf den Mock statt auf ein
# echtes Modell, `sandbox.env` (Tier `advanced`) gibt dem Agenten eine
# Variable mit. Alle fünf sind für das Projekt-Profil gesperrt
# (`x-project-scope = "denied"`): Ein geklontes Repository darf weder den
# Resolver umlenken noch eine fremde Wurzel nachreichen noch dem Agenten eine
# Umgebung setzen.

[hold]
# Die Frist ist hier nur eines: das Budget, in dem die Kommandozeile die drei
# nacheinander gehaltenen Anfragen entscheiden muss. Anders als im M2-Lauf
# läuft keine Anfrage absichtlich in die Zeitüberschreitung — das misst M2, und
# ein zweites Mal dieselbe Aussage kostet hier nur Laufzeit. Zwanzig Sekunden
# sind reichlich für drei Entscheidungen mit je einem eigenen Prozess; auf einem
# langsamen Läufer bleibt Luft.
#
# `run.sh` setzt denselben Wert zusätzlich über die Umgebung, weil
# `start_daemon` die Frist so entgegennimmt.
timeout_secs = 20

[ui]
# Der Lauf zeigt keine Benachrichtigungen; im Kopfhörer eines CI-Runners hört
# sie ohnehin niemand, und ein Portal-Aufruf wäre eine weitere Abhängigkeit.
notifications = false
# Die Hinweiszeile im Terminal des Agenten steht ausdrücklich an, obwohl sie
# ohnehin die Vorgabe ist: Der Lauf prüft sie (Schritt 6), und eine Zusicherung
# über eine Zeile, die eine spätere Änderung der Vorgabe still abschalten
# könnte, wäre keine.
terminal_notices = true

[llm]
# Das Sprachmodell dieser Sitzung: der Mock aus `tests/e2e/mock_llm/`. Aus
# diesem Wert baut der Agent-Adapter die Durchreichregel (Rang 1,
# `backlog/CONVENTIONS.md` 4.5) mit den Inferenzpfaden aus
# `daemon/crates/sandbox/src/agent/opencode.rs`; alles andere an derselben
# Adresse geht durch die Warteschlange.
endpoint = "@LLM_ENDPOINT@"

# Die Modelle, die der Mock bedient. Zwei Dinge hängen daran, und beide sind
# der Grund, warum die Liste hier steht und nicht leer bleibt:
#
#   1. Der Mock lehnt ein Modell ab, das er nicht bedient (`404`). Ein
#      Testdoppel, das jede Anfrage freundlich beantwortet, verdeckt genau den
#      Fehler, für den man es hat.
#   2. Der Agent-Adapter setzt den ersten Eintrag in die `opencode.json` der
#      Sandbox (`agents/opencode/opencode.json.tmpl`, `{{DEFAULT_MODEL}}`).
#      Ohne Eintrag stünde dort der Platzhalter, ein echtes OpenCode fragte
#      nach einem Modell, das es nicht gibt, und der Lauf mit echtem OpenCode
#      scheiterte an etwas anderem, als er messen will.
models = ["mock"]

[resolver]
# Der zweite Host des Laufs zeigt auf das Ziel. Die Adresse stammt aus
# TEST-NET-2 (RFC 5737) und liegt im eigenen Netz-Namensraum des Laufs auf
# `lo`: nicht privat, also vom Proxy erreichbar, und nirgends geroutet, also
# ohne Weg nach draußen. Loopback ginge nicht — der Proxy weist eine private
# Adresse ab (`UpstreamError::PrivateAddress`), und die Freigabe ließe sich
# damit nie belegen (`backlog/CONVENTIONS.md` 4.22).
#
# **`models.dev` steht mit Absicht nicht in dieser Liste.** Die mitgelieferte
# Regel `…0001` blockt den Host, und ein Block fällt, bevor irgendein Name
# aufgelöst wird (ADR-006). Ohne Eintrag ist der Beleg dafür stärker: Käme der
# Block erst nach einer Auflösung, endete der Fluss als `upstream_dns` statt
# als Block, und Schritt 4 sähe es.
overrides = { "example.com" = "@UPSTREAM_ADDR@" }

# Die Wurzel des Testzertifikats, das der Fake-Upstream auf Port 443 zeigt.
# Sie entsteht bei jedem Lauf neu und liegt im Wegwerf-Baum, nie im Repository.
#
# Der Daemon nimmt sie nur an, wenn er ausdrücklich mit `--allow-test-ca`
# gestartet wurde; `run.sh` übergibt das Flag über `start_daemon`. Der
# Schlüssel allein bewirkt nichts — dann meldet der Daemon `CONFIG_011` und
# vertraut nichts, und jede Anfrage über `https` endete mit `502 upstream_tls`
# (HUM-087, `docs/SECURITY.md` 5, `backlog/CONVENTIONS.md` 4.22).
test_ca = "@TEST_CA@"

[sandbox]
# Die eine Variable, die der Agent dieses Laufs von außen braucht: Der Port des
# Mocks steht erst zur Laufzeit fest, und ein Skript, das ihn erraten müsste,
# prüfte die falsche Adresse. Die beiden anderen Ziele stehen wörtlich im
# Agentenskript, damit dort zu lesen ist, wohin es geht.
env = { LLM = "@LLM_ENDPOINT@" }
