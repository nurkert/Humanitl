include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/core/ipc/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # `flutter pub get` traegt diese beiden selbst ein. Unter `app/build` und
    # `app/linux` liegt heute kein Dart, sie sind also wirkungslos; sie stehen
    # hier, damit der naechste `pub get` sie nicht erneut anhaengt.
    - build/**
    - linux/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_relative_imports: true
    public_member_api_docs: true
    always_declare_return_types: true
    avoid_print: true
