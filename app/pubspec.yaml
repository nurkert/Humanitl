name: humanitl
description: "Human-in-the-loop moderation for what an AI agent sends to the internet."
publish_to: "none"
version: 0.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  humanitl_ui:
    path: packages/ui
  # gRPC-Client und Laufzeit fuer den erzeugten Proto-Code (HUM-003).
  # Die Version von `protobuf` (6.x) gehoert zur Version des Codegenerators
  # `protoc_plugin` (25.x); siehe docs/PROTOCOL.md.
  grpc: ^5.1.0
  protobuf: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
