name: humanitl
description: "Human-in-the-loop moderation for what an AI agent sends to the internet."
publish_to: "none"
version: 0.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Versions are exact where the package shapes generated code or the window:
# `pubspec.lock` is gitignored, so the pubspec is the only pin that reaches CI.
# Every pin below resolves with Flutter 3.44.0 / Dart 3.12.0 (HUM-019).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  humanitl_ui:
    path: packages/ui
  # gRPC-Client und Laufzeit fuer den erzeugten Proto-Code (HUM-003).
  # Die Version von `protobuf` (6.x) gehoert zur Version des Codegenerators
  # `protoc_plugin` (25.x); siehe docs/PROTOCOL.md.
  grpc: ^5.1.0
  protobuf: ^6.0.0
  # `Int64` fuer uint64-Felder des Vertrags; Version folgt `protobuf`.
  fixnum: ^1.1.1
  # Zustand: Riverpod 3 mit Codegenerator (`dart run build_runner build`).
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2
  # Werttypen: freezed 3.x ist die letzte Linie fuer Dart 3.12; 4.x verlangt
  # Dart 3.13. JSON nur fuer Diagnostics und DaemonInfo (Protokolle, HUM-058).
  freezed_annotation: 3.1.0
  json_annotation: 4.11.0
  # Von `flutter_localizations` in Flutter 3.44 exakt auf 0.20.2 festgelegt.
  intl: 0.20.2
  # Fenstertitel und Mindestgroesse (nur nach `ensureInitialized`).
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  riverpod_generator: 4.0.3
  freezed: 3.2.5
  json_serializable: 6.13.0
  alchemist: 0.14.0
  # Zeitraffer fuer die Skript-Tests des FakeDaemonClient; Version wie in
  # flutter_test.
  fake_async: 1.3.3

flutter:
  uses-material-design: true
  # `flutter gen-l10n` laeuft mit `flutter pub get`; Konfiguration in l10n.yaml.
  generate: true
