name: humanitl
description: "Human-in-the-loop moderation for what an AI agent sends to the internet."
publish_to: "none"
version: 0.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.2"

# Versions are exact where the package shapes generated code or the window.
# `pubspec.lock` dieser Anwendung ist versioniert: die Komponentenbibliothek
# bringt dreizehn Pakete mit, die meisten mit Caret-Bereichen, und ohne Lock
# loest die CI bei jedem Lauf neu auf — ein Release eines dieser Pakete aendert
# dann den Bau ohne einen einzigen Commit. Die Lock-Datei von
# `app/packages/ui` bleibt ignoriert: das ist eine Bibliothek, und fuer die
# gilt der Lock des Aufrufers.
# Every pin below resolves with Flutter 3.47.2 / Dart 3.13.2 (HUM-019).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  humanitl_ui:
    path: packages/ui
  # gRPC-Client und Laufzeit fuer den erzeugten Proto-Code (HUM-003).
  # Die Version von `protobuf` (6.x) gehoert zur Version des Codegenerators
  # `protoc_plugin` (25.x); siehe docs/PROTOCOL.md.
  grpc: ^5.1.0
  protobuf: ^6.0.0
  # `Int64` fuer uint64-Felder des Vertrags; Version folgt `protobuf`.
  fixnum: ^1.1.1
  # Zustand: Riverpod 3 mit Codegenerator (`dart run build_runner build`).
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  # Werttypen: freezed 4.x, seit Flutter 3.47.2 Dart 3.13 mitbringt. JSON nur
  # fuer Diagnostics und DaemonInfo (Protokolle, HUM-058).
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  # Von `flutter_localizations` in Flutter 3.47.2 auf `^0.20.3` gefordert.
  intl: 0.20.3
  # Fenstertitel und Mindestgroesse (nur nach `ensureInitialized`).
  window_manager: 0.5.2
  # Speichern-Dialog des History-Exports (HUM-032). Exakt gepinnt: der Picker
  # ist ein foederiertes Plugin, und die Linux-Fassung bindet den
  # XDG-Desktop-Portal ueber D-Bus ein, also entscheidet die Version, welcher
  # Dialog erscheint. Der Export schreibt die Datei selbst; `saveFile` liefert
  # nur den Pfad (CONVENTIONS 3.9, HUM-032 Fallstricke).
  file_picker: 12.2.0
  # Tray und Desktop-Notification sprechen unter Linux D-Bus, und `dbus` ist
  # eine reine Dart-Bibliothek: kein Plugin, also kein Eintrag in
  # `linux/flutter/generated_plugin_registrant.cc` und keine zusaetzliche
  # Systembibliothek zur Bauzeit. Die naheliegenden Pakete kosten beides --
  # `tray_manager` verlangt `libayatana-appindicator3-dev`, ohne die schon
  # `flutter build linux` scheitert, und `flutter_local_notifications` bringt
  # denselben D-Bus-Verkehr hinter einem Plugin mit. Siehe HUM-034.
  dbus: 0.7.15
  # Der Terminal-Emulator des Sandbox-Bildschirms (HUM-042). Exakt gepinnt:
  # Er malt das Fenster, und ein Wechsel der Fassung wechselt das Aussehen und
  # den Umfang der Escape-Folgen, die er versteht. Die Bytes kommen gefiltert
  # aus dem Daemon; das Widget registriert zusaetzlich keinen OSC-Handler.
  xterm2: 5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.16.1
  riverpod_generator: 4.0.9
  freezed: 4.0.1
  json_serializable: 6.14.1
  alchemist: 0.14.0
  # Zeitraffer fuer die Skript-Tests des FakeDaemonClient; Version wie in
  # flutter_test.
  fake_async: 1.3.3

flutter:
  uses-material-design: true
  # `flutter gen-l10n` laeuft mit `flutter pub get`; Konfiguration in l10n.yaml.
  generate: true
