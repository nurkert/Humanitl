    icon: ai.svg
    homepage: https://models.dev
    source: https://models.dev
    risk_note:
      en: "OpenCode fetches this list at every start, before you have decided anything."
      de: "OpenCode holt diese Liste bei jedem Start, bevor irgendetwas entschieden ist."

