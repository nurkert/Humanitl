# Der gebündelte Domain-Katalog (HUM-031).
#
# Jeder Eintrag ist eine Behauptung über einen Dienst, und jede Behauptung
# nennt unter `source` die Seite des Betreibers, auf der sie nachlesbar ist.
# Ein Eintrag sagt, was hinter einem Namen steckt. Er sagt nicht, dass eine
# Anfrage dorthin in Ordnung ist: derselbe Host trägt ein `git clone` und einen
# Datenabfluss (BACKLOG.md 4.3).
#
# `hosts` benutzt die Glob-Semantik der Regeln (CONVENTIONS.md 3.3): ein Name
# ohne Stern trifft exakt, `*` steht für genau ein Label, `**` für ein oder
# mehr, und `**.example.com` schließt `example.com` selbst ein. Verglichen
# werden ganze Labels, nie Zeichenketten; `**.github.com` trifft deshalb weder
# `evil-github.com` noch `github.com.evil.io`.
#
# Trifft mehr als ein Muster, gewinnt der erste Eintrag dieser Datei.
#
# Die Form prüft `catalog/domains.schema.json`; die Werte prüft
# `humanitl-catalog` beim Laden. Diese Fassung deckt die Ziele ab, bei denen
# ein Coding-Agent im Alltag landet; auf ungefähr zweihundert Einträge wächst
# der Katalog in HUM-059.
version: 1
entries:
  - id: github
    name: GitHub
    hosts: ["github.com", "**.github.com", "**.githubusercontent.com"]
    category: scm
    description:
      en: "Source hosting with issues, releases and the REST and GraphQL API."
      de: "Quellcode-Hosting mit Issues, Releases und der REST- und GraphQL-API."
    typical: ["git clone", "git push", "gh api", "release download"]
    icon: scm.svg
    homepage: https://github.com
    source: https://docs.github.com/en/rest
    risk_note:
      en: "A push, a gist or a release upload sends data out; from the outside it looks like a fetch."
      de: "Ein Push, ein Gist oder ein Release-Upload schickt Daten nach außen und sieht dabei aus wie ein Abruf."

  - id: gitlab
    name: GitLab
    hosts: ["gitlab.com", "**.gitlab.com"]
    category: scm
    description:
      en: "Source hosting with issues, CI pipelines and a REST API."
      de: "Quellcode-Hosting mit Issues, CI-Pipelines und einer REST-API."
    typical: ["git clone", "git push", "glab api"]
    icon: scm.svg
    homepage: https://gitlab.com
    source: https://docs.gitlab.com/ee/api/rest/
    risk_note:
      en: "A push sends data out; from the outside it looks like a fetch."
      de: "Ein Push schickt Daten nach außen und sieht dabei aus wie ein Abruf."

  - id: npm
    name: npm registry
    hosts: ["registry.npmjs.org", "**.npmjs.org", "**.npmjs.com"]
    category: registry
    description:
      en: "Package registry for Node.js; npm, pnpm, yarn and npx read it."
      de: "Paket-Registry für Node.js; npm, pnpm, yarn und npx lesen von hier."
    typical: ["npm install", "pnpm add", "npx"]
    icon: registry.svg
    homepage: https://www.npmjs.com
    source: https://docs.npmjs.com/cli/v10/using-npm/registry

  - id: pypi
    name: PyPI
    hosts: ["pypi.org", "**.pypi.org", "files.pythonhosted.org"]
    category: registry
    description:
      en: "Package index for Python; the archives themselves come from files.pythonhosted.org."
      de: "Paket-Index für Python; die Archive selbst liegen auf files.pythonhosted.org."
    typical: ["pip install", "uv add", "poetry install"]
    icon: registry.svg
    homepage: https://pypi.org
    source: https://docs.pypi.org/api/

  - id: crates-io
    name: crates.io
    hosts: ["crates.io", "static.crates.io", "index.crates.io"]
