      de: "Cloud-API der GPT-Modelle, unter anderem für Chat-Completions und Embeddings."
    typical: ["chat completions", "embeddings"]
    icon: ai.svg
    homepage: https://openai.com
    source: https://platform.openai.com/docs/api-reference
    risk_note:
      en: "Cloud model: the whole prompt leaves your machine, including whatever the agent put into it."
      de: "Cloud-Modell: der ganze Prompt verlässt den Rechner, mitsamt allem, was der Agent hineingeschrieben hat."

