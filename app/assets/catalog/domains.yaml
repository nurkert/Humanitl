      en: "Package registry for Rust; cargo reads the index from index.crates.io and the archives from static.crates.io."
      de: "Paket-Registry für Rust; cargo liest den Index von index.crates.io und die Archive von static.crates.io."
    typical: ["cargo build", "cargo add", "cargo publish"]
    icon: registry.svg
    homepage: https://crates.io
    source: https://doc.rust-lang.org/cargo/reference/registry-index.html

