// Der einzige Vertrag zwischen Daemon, UI und CLI (ADR-003, ARCHITECTURE 1.3).
//
// Aenderungen sind additiv: Feldnummern werden nie recycelt, Enums bekommen
// neue Werte hinten. Wie man die Datei aendert, steht in `docs/PROTOCOL.md`.
syntax = "proto3";

package humanitl.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "humanitl/v1/common.proto";
import "humanitl/v1/rules.proto";

option java_multiple_files = true;

// ---------- Service ----------

// Alle Faehigkeiten des Daemons. UI und CLI sind gleichberechtigte Clients;
// es gibt keinen zweiten Weg in den Daemon (ARCHITECTURE 3b).
service Humanitl {
  // Version und Faehigkeiten des Daemons. UI verweigert hoehere Proto-Major.
  rpc GetInfo(google.protobuf.Empty) returns (Info);
  // Ereignisstrom. Bei Lagged: Client synchronisiert ueber ListFlows(since).
  rpc Subscribe(SubscribeRequest) returns (stream FlowEvent);
  rpc ListFlows(ListFlowsRequest) returns (FlowPage);
  rpc GetFlow(FlowRef) returns (FlowDetail);
  rpc GetBody(BodyRef) returns (stream BodyChunk);
  // Entscheidet einen oder mehrere gehaltene Flows. `allow_edited` mit mehr
  // als einer Flow-ID ist ein Fehler: der Server antwortet je Flow mit
  // `DecideResult.diagnostic` und dem Code `IPC_002`.
  rpc Decide(DecideRequest) returns (DecideResponse);
  rpc Rules(RulesRequest) returns (RulesResponse);
  rpc Sandbox(SandboxRequest) returns (stream SandboxEvent);
  rpc Terminal(stream TerminalInput) returns (stream TerminalOutput);
  rpc Audit(AuditRequest) returns (AuditResponse);
  rpc GetConfig(GetConfigRequest) returns (ConfigSnapshot);
  rpc SetConfig(SetConfigRequest) returns (ConfigSnapshot);
  // Maschinenpruefung wie `flutter doctor` (HUM-075), seit HUM-436 dazu je
  // Sandbox-Backend eine Gruppe von Zeilen (`DoctorReport.backends`). Bis
  // Minor 34 nahm der Aufruf `google.protobuf.Empty`; `DoctorRequest` ohne
  // gesetztes Feld ist auf der Leitung dieselbe leere Nachricht, und ein
  // aelterer Client bekommt denselben Bericht wie zuvor.
  rpc Doctor(DoctorRequest) returns (DoctorReport);
  // LAN-Suche nach LLM-Servern, nur auf ausdruecklichen Wunsch (HUM-076).
  rpc DiscoverLlm(DiscoverRequest) returns (stream DiscoverResult);
  // Prueft genau einen Endpunkt, host-seitig, nur lesend (HUM-039).
  rpc ProbeLlm(ProbeLlmRequest) returns (ProbeLlmResponse);
  // Was ein Sandbox-Lauf im Projektverzeichnis hinterlassen hat (HUM-043).
  // `Sandbox` ist ein Strom ueber die laufende Sandbox; diese RPC liefert die
  // gespeicherte Zusammenfassung eines Laufs nach seiner Kennung, auch wenn er
  // laengst beendet ist.
  rpc GetSessionSummary(SessionSummaryRef) returns (SessionSummary);
  // Der Zugangsschluessel des LLM-Endpunkts: Stand abfragen, setzen, entfernen
  // (HUM-140). Der Schluessel geht nur hinein, nie heraus: Keine Antwort
  // dieses Dienstes traegt ihn, nur ob einer hinterlegt ist und wo.
  rpc LlmKey(LlmKeyRequest) returns (LlmKeyStatus);
  // Die gespeicherten Modellserver: auflisten, anlegen, umbenennen,
  // entfernen, aktivieren (HUM-289). Ein Wechsel gilt ab der naechsten
  // Sitzung; eine laufende behaelt ihren Server. Keine Antwort traegt einen
  // Schluessel, nur den Verweis darauf.
  rpc LlmServers(LlmServersRequest) returns (LlmServerList);
  // Eine weitere Shell in der laufenden Sandbox, neben dem Agenten und mit
  // einem eigenen Terminal (HUM-299). Die Antwort nennt ihre Kennung; das
  // Terminal oeffnet `Terminal` mit `Open.shell_id`. Der Shim startet sie von
  // innen, sie traegt dieselben Grenzen wie der Agent, endet mit ihrem
  // Prozess oder mit der Sandbox, und hoechstens vier leben gleichzeitig.
  rpc Exec(ExecRequest) returns (ExecResponse);
  // Updates von Humanitl selbst (HUM-382): `Check` fragt das letzte Release
  // auf GitHub und prueft dessen signiertes Manifest, `Apply` laedt das Zip
  // des Manifests, prueft Groesse, SHA-256 und Signatur des Buendels und
  // tauscht App, Archiv-Ordner oder AppImage aus; ein Paket aus apt oder dnf
  // aktualisiert der Client mit `UpdateStatus.upgrade_command`. `Check` antwortet mit genau einem
  // `UpdateEvent.status`, `Apply` mit Fortschritt und am Ende genau einem
  // `UpdateEvent.installed`. Jede Weigerung kommt als Status mit Diagnostic.
  rpc Update(UpdateRequest) returns (stream UpdateEvent);
  // Die Pause des Abfangens (HUM-407): lesen, pausieren, wieder einschalten.
  // Waehrend der Pause wird nichts gehalten; was keine Regel entscheidet,
  // geht mit `DECISION_SOURCE_PAUSED` durch. Block-Regeln, die harte Sperre
  // gepruefter Geheimnisse, die Grenzen der Sandbox und die Aufzeichnung
  // bleiben. Die Pause lebt nur im Speicher des Daemons und endet beim
  // Einschalten, beim Start eines neuen Laufs und mit dem Daemon. Jede
  // Antwort ist der Stand danach; jeder Wechsel kommt zusaetzlich als
  // `FlowEvent.intercept` in `Subscribe`. Nichts davon erreicht die Sandbox.
  rpc Intercept(InterceptRequest) returns (InterceptStatus);
  // Die Sandbox-Backends dieses Systems (HUM-432): je Backend die
  // Isolationsstufe, ob ein Start damit ginge, ob die Konfiguration es waehlt,
  // und was fehlt, als `Diagnostic`; unter Podman dazu die Laufzeit `crun`
  // mit eigener Verfuegbarkeit, unter Linux auf x86-64 dazu das VM-Backend der
  // Kernel-Stufe (seit Minor 39). Die Antwort fragt das System wie
  // die Suche vor einem Start und startet nichts; den Probestart macht
  // `Doctor` (HUM-436). Oberflaeche und Kommandozeile pruefen nichts selbst
  // (ADR-018). Mit `SandboxBackendsRequest.plan` misst die Antwort an der
  // Konfiguration, die ein Start mit diesem Plan bekaeme, samt dem
  // Projekt-Profil seines Ordners, dem Profil der Sitzung und `Plan.backend`
  // (HUM-440); ohne Plan an der Konfiguration ohne Wunsch, wie sie auf der
  // Platte steht, mit dem Projekt-Profil des gespeicherten Ordners. Ein
  // Daemon vor Minor 34 kennt den Aufruf nicht (`UNIMPLEMENTED`), einer vor
  // Minor 38 nimmt `Empty` und antwortet immer wie ohne Plan.
  rpc SandboxBackends(SandboxBackendsRequest) returns (SandboxBackendList);
  // Der Entscheidungs-Proxy des Nutzers hinter Humanitl (HUM-511,
  // ADR-0022): Stand, Verbindung pruefen, Zugangsdaten setzen oder
  // entfernen. `CheckConnection` baut ueber `egress.proxy`, wie die Konfiguration
  // jetzt auf der Platte steht, einen Tunnel zu einem festen Ziel und den
  // TLS-Handschlag darin auf; eine Anfrage sendet er nicht, damit dort
  // niemand entscheiden muss. Keine Antwort traegt die Zugangsdaten. Ein
  // Daemon vor Minor 41 kennt den Aufruf nicht (`UNIMPLEMENTED`).
  rpc Egress(EgressRequest) returns (EgressStatus);
  // Das Agent-Depot (HUM-518, ADR-0023): je bekanntem Agenten die wirksame
  // Quelle mit Herkunft und Sperre, die installierte Version aus
  // `manifest.json`, die Signatur, ob eine Anmeldung liegt, die letzte
  // Rueckschrift und die Groesse; dazu Quelle setzen und Depot entfernen.
  // Nichts davon startet ein Programm aus dem Depot. Eine Firmenvorgabe, die
  // die Quelle sperrt, lehnt `SetSource` auf `host` mit `AGENT_010` ab;
  // `Remove` lehnt ab, solange eine Sitzung das Depot nutzt. Ein Daemon vor
  // Minor 44 kennt den Aufruf nicht (`UNIMPLEMENTED`).
  rpc Agents(AgentsRequest) returns (AgentsStatus);
  // Das Projektregister (HUM-532, ADR-0024): bekannte Projekte mit letztem
  // Start, Agent, Laeufen und laufender Sitzung (`list`), ein Projekt mit
  // seiner Wahl und deren Herkunft (`get`), und die Projektwahl speichern
  // (`save_choice`). Die Wahl ist eine Ebene auf dem Host, nie im
  // Projektordner; ein Schluessel ausserhalb ihrer Liste, ein gesperrter
  // Wert oder eine gesenkte Untergrenze ist `CONFIG_024`. Geloescht wird
  // hier nichts. Ein Daemon vor Minor 45 kennt den Aufruf nicht
  // (`UNIMPLEMENTED`).
  rpc Projects(ProjectsRequest) returns (ProjectsResponse);
}

// ---------- Info ----------

// Selbstauskunft des Daemons.
message Info {
  // Semver des Daemons.
  string daemon_version = 1;
  // Major der Proto. Aktuell 1.
  uint32 proto_major = 2;
  // Minor der Proto. Steigt bei additiven Aenderungen.
  uint32 proto_minor = 3;
  // Zum Beispiel `sandbox.run`, `proxy.h1`, `proxy.h2`, `findings.regex`.
  // Der alte Name von `sandbox.run` bleibt als Alias, auch unter macOS (HUM-376).
  repeated string capabilities = 4;
  // Aktuelle Session, leer wenn keine laeuft.
  string session_id = 5;
  // Der Stand der Pause des Abfangens (HUM-407), mit `instance` gleich
  // `session_id`; fehlt bei einem Daemon ohne Proxy-Sitzung. Der Herzschlag
  // der Oberflaeche liest ihn mit jedem `GetInfo`, zusammen mit
  // `capabilities` und `session_id`, und haelt so die Anzeige auch dann
  // richtig, wenn ein Ereignis verloren ging.
  InterceptStatus intercept = 6;
}

// ---------- Kern ----------

// Lebenszyklus eines Flows (CONVENTIONS.md 3.2).
enum FlowState {
  FLOW_STATE_UNSPECIFIED = 0;
  FLOW_STATE_RECEIVED = 1;
  FLOW_STATE_ANALYZED = 2;
  FLOW_STATE_HELD = 3;
  FLOW_STATE_DECIDED = 4;
  FLOW_STATE_FORWARDED = 5;
  FLOW_STATE_RESPONDED = 6;
  FLOW_STATE_RECORDED = 7;
  // Upstream-Fehler nach Allow oder Forwarded, siehe UpstreamError.
  FLOW_STATE_FAILED = 8;
}

// Art der getroffenen Entscheidung.
enum DecisionKind {
  DECISION_KIND_UNSPECIFIED = 0;
  DECISION_KIND_ALLOW = 1;
  DECISION_KIND_ALLOW_EDITED = 2;
  DECISION_KIND_BLOCK = 3;
  DECISION_KIND_TIMED_OUT = 4;
}

// Warum blockiert wurde. Der HTTP-Status je Grund steht in CONVENTIONS.md 3.2.
enum BlockReason {
  BLOCK_REASON_UNSPECIFIED = 0;
  BLOCK_REASON_USER = 1;
  BLOCK_REASON_RULE = 2;
  BLOCK_REASON_TIMEOUT = 3;
  BLOCK_REASON_BODY_CAP = 4;
  BLOCK_REASON_AUTHORITY_MISMATCH = 5;
  BLOCK_REASON_NO_ROUTE = 6;
  BLOCK_REASON_HOLD_MEMORY = 7;
  BLOCK_REASON_HOLD_MAX_FLOWS = 8;
  BLOCK_REASON_CLIENT_TIMEOUT = 9;
  BLOCK_REASON_PRIVATE_ADDRESS = 10;
  // Ein Geheimnis mit aufgehender Pruefsumme, hard_block_checksum_secrets an.
  BLOCK_REASON_SECRET = 11;
  // Kein Block durch irgendwen: Der Client hat die TLS-Verbindung zum Proxy
  // abgebrochen oder abgelehnt, bevor eine Anfrage zu entscheiden war, oder
  // den Tunnel danach leer geschlossen. Nichts ging zum Ziel. Clients zeigen
  // den Flow als "abgebrochen", nie als Blockierung; die Ursache steht in
  // FlowSummary.error (HUM-316, PROTO_MINOR 24).
  BLOCK_REASON_CLIENT_ABORTED = 12;
}

// Wer entschieden hat.
enum DecisionSource {
  DECISION_SOURCE_UNSPECIFIED = 0;
  DECISION_SOURCE_USER = 1;
  DECISION_SOURCE_RULE = 2;
  DECISION_SOURCE_TIMEOUT = 3;
  DECISION_SOURCE_PASSTHROUGH = 4;
  DECISION_SOURCE_SYSTEM = 5;
  // Waehrend einer Pause des Abfangens ohne Halten durchgelassen (HUM-407):
  // weder ein Mensch noch eine Regel, und immer ein `allow`.
  DECISION_SOURCE_PAUSED = 6;
  // An den Entscheidungs-Proxy hinter Humanitl weitergereicht, statt hier zu
  // warten (`hold.ask_mode = "upstream"`, ADR-0022, HUM-512): immer ein
  // `allow` im Sinn von "weitergereicht". Was dort entschieden wurde, sagt
  // nur der Status der Antwort; ein Client nennt den Fluss nie "erlaubt"
  // (PROTO_MINOR 42).
  DECISION_SOURCE_UPSTREAM = 7;
}

// Grund, warum eine erlaubte Anfrage den Upstream nicht erreicht hat
// (CONVENTIONS.md 3.2, 4.10). Nie als `Responded` mit Status 502 verbuchen.
enum UpstreamError {
  UPSTREAM_ERROR_UNSPECIFIED = 0;
  UPSTREAM_ERROR_DNS = 1;
  UPSTREAM_ERROR_CONNECT = 2;
  UPSTREAM_ERROR_TLS = 3;
  UPSTREAM_ERROR_PRIVATE_ADDRESS = 4;
  UPSTREAM_ERROR_TIMEOUT = 5;
  // Die Anfrage ging ueber den Entscheidungs-Proxy (`egress.proxy`) hinaus,
  // und die Verbindung endete ohne Antwort, geschlossen vom Proxy oder vom
  // Ziel dahinter, etwa „Drop" in Burp Suite ohne Fehlerseite. Keine
  // Entscheidung von Humanitl (HUM-555, PROTO_MINOR 51).
  UPSTREAM_ERROR_PROXY_CLOSED = 6;
}

// Ein HTTP-Header. Der Wert ist `bytes`, weil Header nicht garantiert UTF-8
// sind und der Decoder sonst scheitert.
message Header {
  string name = 1;
  bytes value = 2;
}

// Verweis auf einen Body. Bodies reisen nie inline in Ereignissen; der Inhalt
// kommt ueber GetBody.
message BodyRef {
  bytes sha256 = 1;
  uint64 size = 2;
  // Der Recorder hat nur einen Praefix gespeichert.
  bool truncated = 3;
  string content_type = 4;
  // Content-Encoding der aufgezeichneten Bytes, leer fuer identity. Fuellt der
  // Daemon in FlowDetail; der Client reicht es in GetBody zurueck.
  string content_encoding = 5;
  // Nur in GetBody gelesen: wahr, wenn der Daemon nach content_encoding
  // entpacken soll. Kann er das nicht, liefert er die rohen Bytes und nennt
  // die Kodierung in BodyChunk.encoding_left.
  bool decoded = 6;
}

// Ziel einer Anfrage, normalisiert (A-Label, lowercase, ohne trailing dot).
message Authority {
  string host = 1;
  uint32 port = 2;
  bool is_ip_literal = 3;
  // U-Label fuer die Anzeige, kann vom `host` abweichen.
  string display_host = 4;
}

// Eine vollstaendige HTTP-Anfrage ohne Body-Inhalt.
message HttpRequest {
  Method method = 1;
  // Rohwert bei METHOD_OTHER.
  string method_raw = 2;
  Scheme scheme = 3;
  Authority authority = 4;
  string path_and_query = 5;
  repeated Header headers = 6;
  BodyRef body = 7;
  // Zum Beispiel `HTTP/1.1` oder `HTTP/2`.
  string version = 8;
}

// Statuszeile und Header einer Antwort.
message HttpResponseHead {
  uint32 status = 1;
  repeated Header headers = 2;
  string version = 3;
}

// Wie sicher ein Fund ist.
enum FindingTier {
  FINDING_TIER_UNSPECIFIED = 0;
  FINDING_TIER_CHECKSUM = 1;
  FINDING_TIER_REGEX = 2;
  FINDING_TIER_USER_TERM = 3;
}

// Wo im Request ein Fund liegt.
enum FindingLocation {
  FINDING_LOCATION_UNSPECIFIED = 0;
  FINDING_LOCATION_HEADER = 1;
  FINDING_LOCATION_QUERY = 2;
  FINDING_LOCATION_BODY = 3;
}

// Ein moeglicher Geheimnisfund im Request.
message Finding {
  // Zum Beispiel `api_key.github`, `email`, `iban`, `user_term`.
  string kind = 1;
  FindingLocation location = 2;
  // Nur bei FINDING_LOCATION_HEADER gesetzt.
  string header_name = 3;
  uint64 span_start = 4;
  uint64 span_end = 5;
  FindingTier tier = 6;
  bytes value_hash = 7;
  // Gekuerzte Anzeige, zum Beispiel `ghp_ab...`.
  string display_prefix = 8;
  // Der Nutzer hat den Fund bearbeitet oder bewusst quittiert.
  bool resolved = 9;
}

// Wie dringend ein Diagnostic ist.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_BLOCKING = 4;
}

// Was der Nutzer tun kann, um die Ursache zu beheben.
message FixAction {
  oneof action {
    SetEnv set_env = 1;
    Rule add_rule = 2;
    google.protobuf.Empty install_service = 3;
    ChangeSetting change_setting = 4;
    string copy_command = 5;
    string open_url = 6;
    string remount_read_only = 7;
    EditSetting edit_setting = 8;
  }

  // Umgebungsvariable setzen.
  message SetEnv {
    string key = 1;
    string value = 2;
  }

  // Konfigurationsschluessel aendern. Der Wert ist immer einer, den
  // `humanitl config set` fuer diesen Schluessel annimmt (HUM-507).
  message ChangeSetting {
    string key = 1;
    string value = 2;
  }

  // Ein Feld der Konfiguration oeffnen, dessen Wert nur der Mensch kennt:
  // die Oberflaeche zeigt das Feld (oder die Ordnerauswahl), die
  // Kommandozeile den Befehl dafuer; gesetzt wird nichts (HUM-507). Ein
  // Daemon vor 1.50 schickte dafuer ein `ChangeSetting` mit leerem Wert.
  message EditSetting {
    string key = 1;
  }
}

// Ein Befund mit Ursache und Vorschlag. Jeder Fehlerpfad liefert einen.
message Diagnostic {
  // Register `BEREICH_NNN`, zum Beispiel `SANDBOX_001` (CONVENTIONS.md 4.6).
  string code = 1;
  Severity severity = 2;
  string title = 3;
  string why = 4;
  FixAction fix = 5;
  string docs_url = 6;
}

// Was der Katalog ueber die Ziel-Domain weiss (HUM-031).
//
// Alles darin kommt aus mitgelieferten Daten; zur Laufzeit wird nie etwas
// geholt (ADR-006). Jedes Feld ist eine Beobachtung, keine Bewertung: es gibt
// hier kein "vertrauenswuerdig" und keine Punktzahl, aus der die Oberflaeche
// eines bauen koennte. Ein leeres Feld heisst immer "unbekannt", nie
// "unbedenklich", und die Oberflaeche schreibt es auch so hin
// (CONVENTIONS.md 4.13).
message DomainInfo {
  // Registrierbare Domain laut Public Suffix List, zum Beispiel `github.com`
  // fuer `api.github.com`. Leer bei einer IP-Adresse (das Panel zeigt dann
  // "IP address") und bei einem Namen, dessen Suffix die Liste nicht kennt.
  string apex = 1;
  // Die `id` des Eintrags aus `catalog/domains.yaml`, dessen Host-Muster den
  // Host trifft; leer, wenn keines trifft. Leer heisst "nicht im Katalog" und
  // sonst nichts: der Katalog kennt heute einige Dutzend Dienste und waechst
  // mit jedem Release. Name,
  // Beschreibung, Quelle und Symbol schlaegt die Oberflaeche in ihrer eigenen
  // Kopie derselben Datei nach; hier reist nur die Kennung.
  //
  // Ein Treffer ist keine Freigabe. Ueber `api.github.com` laeuft ein
  // `git clone` und ein Datenabfluss (BACKLOG.md 4.3).
  string catalog_id = 2;
  // Verbreitungsrang des Apex (nicht des vollen Hosts), 0 wenn der Apex nicht
  // in den vorderen 100 000 Raengen der gebuendelten Liste steht oder keine
  // Liste geladen ist.
  //
  // Ausgeliefert wird ein Ausschnitt der Majestic Million (CC BY 3.0); der
  // Rang misst dort, von wie vielen verschiedenen Netzen aus auf eine Domain
  // verwiesen wird. Herkunft, Datum, Pruefsummen und Lizenz stehen in
  // `catalog/RANKS-LICENSE`.
  //
  // Der Rang ist Reichweite, kein Urteil, und die Oberflaeche beschriftet ihn
  // so. Ein niedriger Rang macht eine Anfrage nicht sicher, ein fehlender
  // macht sie nicht verdaechtig.
  //
  // Der Feldname bleibt `tranco_rank`, obwohl keine Tranco-Daten mehr
  // ausgeliefert werden: `humanitl-ipc` und `app/lib/core/domain/flow.dart`
  // lesen ihn bereits, und ein Umbenennen waere eine quelltextbrechende
  // Aenderung ueber drei Crates und die Oberflaeche hinweg. Der Rust-Typ
  // `humanitl_catalog::DomainInfo` nennt das Feld `popularity_rank`; die
  // Umbenennung hier gehoert in einen eigenen Commit (docs/PROTOCOL.md).
  uint32 tranco_rank = 3;
  // Wann dieser Host in dieser Sitzung zum ersten Mal vorkam. Die Zaehler
  // leben im Daemon-Prozess: "zum ersten Mal" heisst "zum ersten Mal in
  // dieser Sitzung", nie "zum ersten Mal ueberhaupt".
  google.protobuf.Timestamp first_seen = 4;
  // Wie oft dieser Host in dieser Sitzung vorkam, diese Anfrage
  // eingeschlossen. In `FlowEvent.Received` immer mindestens 1. Saettigt bei
  // 2^32-1, statt umzulaufen.
  uint32 seen_count = 5;
}

// ---------- Flows ----------

// Verweis auf einen Flow.
message FlowRef {
  string flow_id = 1;
}

// Zeilendarstellung eines Flows, wie sie Liste und Queue brauchen.
message FlowSummary {
  string flow_id = 1;
  string session_id = 2;
  google.protobuf.Timestamp received_at = 3;
  Method method = 4;
  string method_raw = 5;
  Scheme scheme = 6;
  Authority authority = 7;
  string path = 8;
  FlowState state = 9;
  DecisionKind decision = 10;
  DecisionSource decision_source = 11;
  BlockReason block_reason = 12;
  string rule_id = 13;
  uint32 status = 14;
  uint64 request_size = 15;
  uint64 response_size = 16;
  google.protobuf.Duration duration = 17;
  uint32 finding_count = 18;
  bool edited = 19;
  bool passthrough = 20;
  // Nur bei FLOW_STATE_HELD gesetzt.
  google.protobuf.Timestamp deadline = 21;
  // Optional, zum Beispiel `webfetch` oder `curl`; leer wenn unbekannt.
  string origin_tool = 22;
  // Bei FLOW_STATE_FAILED gesetzt, und an einer Zeile aus der Aufzeichnung,
  // deren `error` ein `upstream_*` ist (HUM-555).
  UpstreamError upstream_error = 23;
  // Woran der Flow gescheitert ist, als kurzer fester Bezeichner; leer, wenn
  // nichts gescheitert ist. `upstream_dns`, `upstream_connect`, `upstream_tls`,
  // `upstream_private_address:<ip>`, `upstream_timeout` fuer einen
  // gescheiterten Weg nach draussen, `upstream_proxy_closed` fuer einen
  // Entscheidungs-Proxy dahinter, der ohne Antwort schloss (HUM-555),
  // `tls_handshake_failed:<klasse>` fuer einen Client in der Sandbox, der
  // den Handschlag zum Proxy abgebrochen oder den Tunnel leer geschlossen hat (HUM-045, HUM-316). Die Klasse ist eine von
  // `alert_unknown_ca`, `alert_bad_certificate`, `alert_other`,
  // `eof_before_finished`, `reset_before_finished`, `closed_after_handshake`;
  // Zeilen vor HUM-316 tragen `tls_handshake_failed` ohne Klasse. Wer den Fall
  // erkennen will, vergleicht den Teil vor dem ersten `:`.
  //
  // Nicht dasselbe wie `upstream_error`: Das Enum gilt nur bei
  // FLOW_STATE_FAILED, waehrend ein abgebrochener Handschlag als
  // FLOW_STATE_RECORDED verbucht wird. Und nicht dasselbe wie `block_reason`:
  // dort steht, warum jemand geblockt hat, hier, woran es gescheitert ist.
  string error = 24;
  // Wahr fuer eine Anfrage an den reservierten Namen `humanitl.internal`, die
  // der Proxy selbst beantwortet hat (ADR-0014, HUM-073, HUM-103).
  //
  // Das Feld steht **neben** `decision`, nicht darin: Ueber eine Meta-Anfrage
  // entscheidet niemand, sie geht nirgendwo hin, und `decision` bleibt deshalb
  // DECISION_KIND_UNSPECIFIED. Eine Zaehlung ueber Entscheidungen zaehlt einen
  // Meta-Fluss nie mit; der Filterterm `meta:true` liefert genau sie,
  // `meta:false` genau die uebrigen, und ohne den Term erscheinen beide.
  //
  // In einem `FlowEvent` ist das Feld immer false: Ein Meta-Fluss ist fertig,
  // bevor ein Zuhoerer etwas mit ihm anfangen koennte, und erscheint deshalb
  // nur in der Aufzeichnung (ListFlows, GetFlow).
  bool meta = 25;
  // Die registrierbare Domain des Hosts nach der Public Suffix List, als
  // A-Label wie `authority.host`: `b.github.io` fuer `a.b.github.io`, denn
  // `github.io` steht im privaten Abschnitt der Liste und jede Unterdomain
  // darunter hat einen eigenen Betreiber.
  //
  // Leer heisst "der Daemon weiss es nicht": keine Antwort des Katalogs, ein
  // IP-Literal oder ein Name, der nur aus einem Suffix besteht. Leer heisst
  // nie "unbedenklich" und wird nie geraten; wer gruppiert, nimmt dann den
  // Host selbst. Derselbe Wert, den `apex:` im Filter vergleicht.
  string apex = 26;
  // Die Notiz, die der Mensch beim Blocken an den Agenten gerichtet hat; leer,
  // wenn es keine gibt (HUM-072, HUM-117).
  //
  // Sie steht so hier, wie der Agent sie im 403-Rumpf und in
  // `X-Humanitl-Note` gelesen hat: durch dieselbe Saeuberung gegangen
  // (`humanitl_core::block::sanitize_note`), also ohne Zeilenumbrueche, ohne
  // Steuerzeichen und auf 500 Zeichen begrenzt. Der Daemon saeubert vor dem
  // Speichern, nie beim Lesen; wer sie anzeigt, zeigt sie als Klartext.
  //
  // Nur eine Block-Entscheidung traegt eine. Eine Freigabe, ein Ablauf und
  // eine Anfrage ohne Entscheidung lassen das Feld leer, und leer heisst hier
  // immer "es gibt keine", nie "der Daemon weiss es nicht".
  string decision_note = 27;
  // Die Kennung des Katalogeintrags, den der Daemon zum Host gefunden hat;
  // leer, wenn er keinen gefunden hat (HUM-031, HUM-094).
  //
  // Derselbe Wert, den `DomainInfo.catalog_id` zu demselben Fluss traegt: der
  // Daemon fragt den Katalog einmal, beim Eintreffen, und die Antwort steht
  // danach in der Zeile. Ein Client, der eine Gruppe nach dem Dienst benennen
  // will, liest sie hier und nicht aus einer zweiten Abfrage; ein Neustart der
  // Oberflaeche verliert sie nicht, denn die Aufzeichnung fuehrt die Spalte.
  //
  // Leer heisst "der Daemon kennt den Dienst nicht": kein Katalog geladen, ein
  // IP-Literal oder ein Host, auf den kein Muster passt. Leer heisst nie
  // "unbedenklich", und geraten wird nichts. Der Name, die Beschreibung und
  // das Typische zu dieser Kennung stehen im gebuendelten `catalog/domains.yaml`,
  // nicht auf der Leitung.
  string catalog_id = 28;
  // Wie viele Funde mit der Freigabe hinausgingen, ohne ersetzt und ohne
  // bestaetigt zu sein; derselbe Wert wie `FlowEvent.Decided.unresolved_findings`
  // (HUM-160). Nach "Trotzdem senden" steht hier 0, nach dem Halten der
  // Freigabe die Zahl der offenen Funde.
  //
  // Fehlt das Feld, ging nichts hinaus, oder die Zeile stammt aus der Zeit, als
  // der Daemon noch nicht zaehlte. Es fehlt nie an einer Stelle, an der eine
  // Null richtig waere, und eine Null wird nie geraten.
  optional uint32 unresolved_findings = 29;
  // Warum diese Anfrage nicht ungeaendert hinausgehen darf: der Befund
  // `HOLD_004` der harten Sperre (`hold.hard_block_checksum_secrets`,
  // HUM-159). Gesetzt fuer einen Flow der laufenden Sitzung, dessen Scan ein
  // pruefsummen-bestaetigtes Geheimnis fand, solange der Daemon ihn kennt;
  // `Decide(Allow)` auf ihn endet mit genau diesem Befund. Die Oberflaeche
  // zeigt daran „Senden nicht moeglich", ohne die Konfiguration zu lesen
  // (ADR-018).
  //
  // Fehlt das Feld, hat der Daemon keine Sperre angesagt. Das heisst nie, dass
  // Senden erlaubt ist: Das entscheidet der Daemon bei jedem `Allow`.
  Diagnostic send_refusal = 30;
}

// Alles, was der Detail-Bereich zu einem Flow zeigt.
message FlowDetail {
  FlowSummary summary = 1;
  HttpRequest request = 2;
  // Nur bei DECISION_KIND_ALLOW_EDITED gesetzt.
  HttpRequest edited_request = 3;
  HttpResponseHead response = 4;
  BodyRef response_body = 5;
  repeated Finding findings = 6;
  repeated Diagnostic diagnostics = 7;
  DomainInfo domain = 8;
  // Anfang des Request-Bodys (`request.body`) fuer die Anzeige: UTF-8,
  // verlustbehaftet (ungueltige Bytes werden zu U+FFFD), hoechstens 4096
  // Zeichen (Unicode-Skalare, nicht Bytes). Leer bei leerem Body. Der
  // vollstaendige Inhalt kommt ueber GetBody(request.body); ob die Vorschau
  // gekuerzt ist, sagt `request.body.size`. Nur hier, nie in einem
  // FlowEvent (CONVENTIONS.md 3.6).
  string body_preview = 9;
  // Wahr, wenn die Detektoren nicht die ganze Anfrage gesehen haben
  // (`ScanReport::truncated`, HUM-025). Eine leere Fundliste zu einer nur
  // teilweise durchsuchten Anfrage ist kein Freispruch, und die Oberflaeche
  // muss den Unterschied zeigen koennen (CONVENTIONS.md 4.13). Der Befund,
  // der die Luecke erklaert (`FINDINGS_002`), steht zusaetzlich als
  // `FlowEvent.Diagnostic` am selben Flow.
  //
  // Der Daemon weiss das nur, solange der Flow in seiner Registry steht, also
  // fuer die laufende Sitzung; die Aufzeichnung fuehrt die Spalte nicht. Fuer
  // einen Flow aus einer frueheren Sitzung ist das Feld deshalb `false`, und
  // `false` heisst hier "nicht als gekuerzt bekannt".
  bool findings_truncated = 10;
  // Dieselbe Notiz wie `summary.decision_note`, damit ein Client, der nur das
  // Detail in der Hand haelt, sie nicht aus der Zeile nachschlagen muss
  // (HUM-117). Leer heisst "es gibt keine".
  string decision_note = 11;
}

// Abonnement des Ereignisstroms.
message SubscribeRequest {
  // Ab welchem Flow nachgeliefert wird. Leer bedeutet: ab jetzt.
  string since_flow_id = 1;
  bool include_passthrough = 2;
}

// Ein Ereignis des Stroms. Bodies reisen nie mit.
message FlowEvent {
  google.protobuf.Timestamp at = 1;

  oneof event {
    Received received = 2;
    Analyzed analyzed = 3;
    Held held = 4;
    Decided decided = 5;
    FlowRef forwarded = 6;
    ResponseHeaders response_headers = 7;
    ResponseChunk response_chunk = 8;
    FlowRef recorded = 9;
    FlowRef timed_out = 10;
    Lagged lagged = 11;
    // Sessionweite Diagnostics, zum Beispiel eine TLS-Ablehnung ohne SNI, die
    // noch keinem Flow zuzuordnen ist.
    Diagnostic diagnostic = 12;
    RulesChanged rules_changed = 13;
    AgentAsk agent_ask = 14;
    Failed failed = 15;
    // Diagnostics, die zu genau einem Flow gehoeren: LLM_005 an einer
    // durchgereichten Anfrage, FINDINGS_002 an einem unvollstaendigen Scan,
    // PROXY_005 an einem abgelehnten Uebergang. Der Strom ist sessionweit, es
    // gibt also keinen impliziten Kontext; ohne `flow_id` koennte kein Client
    // die Meldung ihrem Flow zuordnen (HUM-039).
    FlowDiagnostic flow_diagnostic = 16;
    // Die Pause des Abfangens hat begonnen oder ist zu Ende (HUM-407). Kein
    // Flow; wer den Strom nach `Lagged` neu aufbaut, liest den Stand ueber
    // `Intercept{status}`.
    InterceptChanged intercept = 17;
    // Die Aufloesung der Konfiguration kann sich geaendert haben (HUM-534):
    // nach `SetConfig`, `Projects.save_choice`, dem Loeschen einer Wahl durch
    // `Projects.cleanup`, einem Wechsel ueber `LlmServers`, `LlmKey`,
    // `Egress` oder `Agents`, und wenn sich `config.toml` auf der Platte
    // geaendert hat. Kein Flow; wer es sieht, laedt mit `GetConfig` neu.
    ConfigChanged config_changed = 18;
  }

  // Was sich an der Konfiguration geaendert hat.
  message ConfigChanged {
    // Die betroffenen Schluessel; leer heisst: unbekannt, jeder kann es sein
    // (eine von Hand geaenderte `config.toml`).
    repeated string keys = 1;
    // Die Kennung des Projekts, dessen Projektwahl sich geaendert hat; leer
    // fuer die globale Ebene.
    string project_id = 2;
  }

  // Ein neuer Flow ist eingetroffen.
  message Received {
    FlowSummary summary = 1;
    // Der Domain-Kontext zu `summary.authority.host`, aus dem gebuendelten
    // Katalog (HUM-031). Fehlt das Feld, weiss der Daemon nichts ueber die
    // Domain; die Oberflaeche zeigt dann die Unbekannt-Karte und faellt nicht
    // auf eine leere Zeile zurueck.
    DomainInfo domain = 2;
  }

  // Die Findings-Analyse ist fertig.
  message Analyzed {
    string flow_id = 1;
    repeated Finding findings = 2;
  }

  // Der Flow wartet auf eine Entscheidung.
  message Held {
    string flow_id = 1;
    google.protobuf.Timestamp deadline = 2;
    // Belegter Hold-Puffer in Bytes ueber alle wartenden Flows (HUM-057).
    uint64 queue_bytes = 3;
    // Anzahl wartender Flows (HUM-057).
    uint32 queue_count = 4;
  }

  // Es wurde entschieden.
  message Decided {
    string flow_id = 1;
    DecisionKind kind = 2;
    DecisionSource source = 3;
    BlockReason block_reason = 4;
    string rule_id = 5;
    // Notiz des Nutzers, erscheint im 403-Body und im Header
    // `X-Humanitl-Note` (ARCHITECTURE 8.2). Hoechstens 500 Zeichen; CR und
    // LF werden zu Leerzeichen, andere Steuerzeichen (< 0x20 ausser Tab)
    // entfernt, bevor der Text in den Header geht (HUM-072).
    string note = 6;
    // Wie viele Funde mit dieser Freigabe hinausgehen, ohne ersetzt und ohne
    // bestaetigt zu sein (HUM-160). Bei `allow` die Funde aus `Analyzed`
    // ohne `DecideRequest.acknowledged_findings`, bei `allow_edited` die des
    // zweiten Scans ueber die bearbeitete Fassung.
    //
    // Fehlt das Feld, geht nichts hinaus (Block, Ablauf) oder niemand hat
    // gezaehlt; eine Null heisst dagegen "gezaehlt, keiner offen".
    optional uint32 unresolved_findings = 7;
  }

  // Die Antwort-Header sind da.
  message ResponseHeaders {
    string flow_id = 1;
    HttpResponseHead head = 2;
    bool streaming = 3;
  }

  // Fortschritt einer Antwort. Traegt keine Daten, nur den Zaehler.
  message ResponseChunk {
    string flow_id = 1;
    uint64 bytes_so_far = 2;
  }

  // Der Client war zu langsam, Ereignisse sind verloren. Der Client holt
  // sich den Zustand ueber ListFlows(since) zurueck.
  message Lagged {
    uint64 dropped = 1;
  }

  // Die erlaubte Anfrage hat das Ziel nicht erreicht: DNS, Connect, TLS,
  // private Adresse oder Timeout nach Allow oder Forwarded. Der Client
  // bekommt 502; der Flow ist FLOW_STATE_FAILED, nie FLOW_STATE_RESPONDED
  // (CONVENTIONS.md 3.2, 4.10).
  message Failed {
    string flow_id = 1;
    UpstreamError error = 2;
    // Aufgeloeste Adresse als Text, nur bei UPSTREAM_ERROR_PRIVATE_ADDRESS;
    // sonst leer. Traegt `UpstreamError::PrivateAddress(IpAddr)` ueber die
    // Leitung.
    string resolved_ip = 3;
  }

  // Der Regelsatz hat sich geaendert, Clients laden ihn neu (HUM-035).
  message RulesChanged {
    // Monoton steigend, damit Clients doppelte Ereignisse erkennen.
    uint64 revision = 1;
  }

  // Der Agent hat ueber `POST http://humanitl.internal/ask` um etwas
  // gebeten (HUM-073). Eine Bitte, keine Aktion.
  message AgentAsk {
    string ask_id = 1;
    // Freitext, hoechstens 2 KiB.
    string text = 2;
    // Host aus einer URL im Text, falls eine erkennbar war.
    string suggested_host = 3;
    // Pfad derselben URL, ohne Query und Fragment; leer, wenn die URL keinen
    // Pfad nannte oder er nicht als Muster taugt. Er engt die vorgeschlagene
    // Regel auf das ein, worum der Agent gebeten hat: ohne ihn gaelte sie
    // fuer jeden Pfad des Hosts (HUM-073).
    string suggested_path = 4;
  }

  // Ein Diagnostic, das zu genau einem Flow gehoert.
  message FlowDiagnostic {
    string flow_id = 1;
    Diagnostic diagnostic = 2;
  }

  // Ein Wechsel der Pause des Abfangens (HUM-407).
  message InterceptChanged {
    // Der Stand nach dem Wechsel.
    InterceptStatus status = 1;
    // Warum die Pause endete; UNSPECIFIED, wenn sie gerade begonnen hat.
    InterceptResumeReason resumed = 2;
  }
}

// Abfrage der Flow-Historie.
message ListFlowsRequest {
  // Syntax wie im History-Screen, zum Beispiel `host:github.com state:blocked`.
  string filter = 1;
  string since_flow_id = 2;
  string cursor = 3;
  // Default 200, Maximum 1000.
  uint32 limit = 4;
  // Zum Beispiel `received_at desc`.
  string order_by = 5;
  bool include_passthrough = 6;
}

// Eine Seite der Flow-Historie.
message FlowPage {
  repeated FlowSummary flows = 1;
  string next_cursor = 2;
  // Die Gesamtzahl der Treffer. Der Recorder zaehlt nur bis zu einer Obergrenze,
  // damit eine grosse History keine Abfrage blockiert; ist sie erreicht, ist
  // `total` eine Untergrenze und `capped` steht. Wer die Zahl anzeigt, muss das
  // sagen (CONVENTIONS 4.13: eine geschaetzte Zahl wird als geschaetzt
  // gekennzeichnet). Ohne dieses Feld muesste die Oberflaeche aus dem Wert
  // raten, ob er exakt ist.
  uint64 total = 3;
  bool capped = 4;
}

// Ein Stueck eines Bodys.
message BodyChunk {
  bytes data = 1;
  uint64 offset = 2;
  bool last = 3;
  // Kodierung, die noch auf data liegt: leer nach erfolgreichem Entpacken
  // oder bei identity; sonst der Name aus BodyRef.content_encoding. Bricht das
  // Entpacken am Budget ab, endet der Strom mit last = true auf dem, was
  // entpackt wurde, und encoding_left bleibt leer: die Bytes sind echt
  // entpackt, es sind nur weniger.
  string encoding_left = 4;
}

// ---------- Decide ----------

// Eine vom Menschen bearbeitete Anfrage, so wie sie hinausgehen soll.
//
// Anders als `HttpRequest` traegt sie den Body selbst, nicht nur einen
// `BodyRef`: der Daemon kennt den bearbeiteten Inhalt sonst nirgends. Das
// ist die einzige Stelle des Vertrags, an der ein Body in Richtung Daemon
// reist. Sie ist von `FlowEvent` aus unerreichbar; `proto_contract.rs`
// prueft das, damit die Regel "Bodies nie in Ereignissen" (CONVENTIONS.md
// 3.6) unberuehrt bleibt.
message EditedRequest {
  Method method = 1;
  // Rohwert bei METHOD_OTHER; ist er gesetzt, gilt er.
  string method_raw = 2;
  // Vollstaendige URL: `scheme://host[:port]/path?query`, ohne Fragment.
  // Fehlt der Port, gilt der Standard-Port des Schemas.
  string url = 3;
  repeated Header headers = 4;
  // Der vollstaendige Body, so wie er hinausgeht.
  bytes body = 5;
}

// Entscheidung ueber einen oder mehrere gehaltene Flows.
message DecideRequest {
  // Batch moeglich; `allow_edited` verlangt genau eine ID.
  repeated string flow_ids = 1;

  // Feld 3 trug `allow_edited` als `HttpRequest`, das den Body nur als
  // `BodyRef` kennt; eine bearbeitete Anfrage konnte ihren Body nicht
  // uebertragen.
  //
  // Feld 6 trug `acknowledge_findings` als `bool`. Kein Handler hat es je
  // gelesen und kein Client hat es je gesetzt; die Bestaetigung offener
  // Funde steht seit HUM-160 als `repeated uint32 acknowledged_findings = 8`
  // da, mit unvertraeglichem Typ.
  //
  // Beide Nummern werden nicht wiederverwendet (docs/PROTOCOL.md 4).
  reserved 3, 6;
  reserved "acknowledge_findings";

  oneof decision {
    google.protobuf.Empty allow = 2;
    // Nur bei genau einer flow_id, sonst Diagnostic `IPC_002`. Traegt die
    // ganze Anfrage samt Body; eine unlesbare Anfrage (Methode, URL) wird
    // mit `IPC_002` abgelehnt, nie stillschweigend zu `allow`.
    EditedRequest allow_edited = 7;
    Block block = 4;
  }

  // Optionale Regel, die vor dem Fortsetzen angelegt wird. Scheitert das
  // Anlegen, wird nicht entschieden.
  Rule remember = 5;

  // Die Funde, die der Mensch gesehen hat und bewusst stehen laesst
  // ("Trotzdem senden", HUM-160): Indizes in die Liste aus `Analyzed`
  // (dieselbe Reihenfolge wie `FlowDetail.findings`). Der Daemon verbucht sie
  // als bestaetigt, und `Decided.unresolved_findings` zaehlt sie nicht mehr.
  //
  // Nur mit `allow` und genau einer `flow_id`; mit `allow_edited` zeigten die
  // Indizes in eine Fassung, die nicht hinausgeht. Sonst, und fuer einen Index
  // ausserhalb der Liste, `IPC_004`. Doppelte Indizes zaehlen einmal. Eine
  // Bestaetigung hebt die harte Sperre `HOLD_004` nie auf.
  repeated uint32 acknowledged_findings = 8;

  // Blockieren mit optionaler Begruendung fuer den Agenten.
  message Block {
    // Erscheint im 403-Body unter `note:` und im Header `X-Humanitl-Note`.
    // Hoechstens 500 Zeichen; der Server ersetzt CR und LF durch
    // Leerzeichen, entfernt andere Steuerzeichen (< 0x20 ausser Tab) und
    // beschraenkt den Header-Wert auf sichtbares ASCII; Nicht-ASCII bleibt
    // nur im Body (HUM-072).
    string note = 1;
  }
}

// Ergebnis einer Entscheidung.
message DecideResponse {
  repeated DecideResult results = 1;
  // Spiegel von `created_rule.rule_id` fuer Clients, die nur die ID brauchen.
  string created_rule_id = 2;
  // Die aus `remember` angelegte Regel, mit vom Daemon gesetzter ID.
  Rule created_rule = 3;
}

// Ergebnis pro Flow.
message DecideResult {
  string flow_id = 1;
  bool applied = 2;
  Diagnostic diagnostic = 3;
}

// ---------- Rules ----------

// Eine Operation auf dem Regelsatz.
message RulesRequest {
  oneof op {
    google.protobuf.Empty list = 1;
    Rule add = 2;
    Rule update = 3;
    // Regel-ID.
    string remove = 4;
    Reorder reorder = 5;
    DryRun dry_run = 6;
    // Regel-ID einer Session-Regel, die dauerhaft werden soll.
    string make_permanent = 7;
    // Liest `rules.yaml` neu ein. Lehnt die Engine die Datei ab, bleiben die
    // geltenden Regeln in Kraft und die Befunde stehen in `diagnostics`.
    // Session-Regeln bleiben unberuehrt, sie stehen nie in der Datei.
    google.protobuf.Empty reload = 8;
    // Fragt den geltenden Regelsatz, was er zu genau dieser Anfrage sagt.
    Test test = 9;
    // Schaltet eine mitgelieferte Regel ab oder wieder an. Andere Regeln
    // lehnt der Daemon mit RULES_010 ab: eine eigene Regel loescht man.
    SetDisabled set_disabled = 10;
  }

  // Eine mitgelieferte Regel abschalten oder wieder anschalten.
  message SetDisabled {
    string rule_id = 1;
    bool disabled = 2;
  }

  // Eine Anfrage, wie sie der Proxy sehen wuerde, aber nur zum Fragen.
  //
  // Der Daemon wertet sie mit derselben Engine aus wie im Proxy-Pfad und
  // aendert dabei nichts: kein Flow, keine Entscheidung, keine Aufzeichnung.
  // Die RPC gibt es, damit CLI und Oberflaeche eine Regel pruefen koennen,
  // ohne eine zweite Auswertung mitzubringen (ADR-018).
  message Test {
    Method method = 1;
    // Vollstaendige URL: `scheme://host[:port]/path?query`, ohne Fragment.
    // Fehlt der Port, gilt der Standard-Port des Schemas.
    string url = 2;
    // Optional. UPGRADE_WEBSOCKET trifft nur Regeln mit `upgrade: websocket`.
    Upgrade upgrade = 3;
  }

  // Neue Reihenfolge, vollstaendig.
  message Reorder {
    repeated string rule_ids_in_order = 1;
  }

  // Probelauf gegen die zuletzt aufgezeichneten Flows.
  message DryRun {
    Rule rule = 1;
    // Wie viele Flows geprueft werden. Default 500.
    uint32 limit = 2;
  }
}

// Antwort auf eine Regel-Operation.
//
// `rules` ist immer der vollstaendige Regelsatz nach der Operation, in der
// Reihenfolge, in der ausgewertet wird: erst die Session-Regeln, dann die
// dauerhaften des Nutzers, dann die mitgelieferten (CONVENTIONS.md 4.5).
message RulesResponse {
  repeated Rule rules = 1;
  repeated FlowSummary dry_run_matches = 2;
  // Spiegel des ersten Eintrags aus `diagnostics`, fuer Clients, die nur einen
  // Befund anzeigen.
  Diagnostic diagnostic = 3;
  // Alle Befunde der Operation. Ein `reload` legt hier ab, was sich geaendert
  // hat (`RULES_011`) oder warum die Datei abgelehnt wurde.
  repeated Diagnostic diagnostics = 4;
  // Wie viele aufgezeichnete Flows der Probelauf geprueft hat. Nur bei
  // `dry_run` gesetzt; `dry_run_matches` ist die Teilmenge, die getroffen hat.
  uint32 dry_run_scanned = 5;
  // Was der Regelsatz zu der geprueften Anfrage sagt. Nur bei `test` gesetzt.
  RuleTest test = 6;
}

// Das Ergebnis von `RulesRequest.Test`.
//
// Es sagt, was mit dieser Anfrage geschaehe, wenn sie jetzt ankaeme, und
// nichts darueber hinaus: Der Regelsatz kennt weder Findings noch die
// Halte-Warteschlange, und ein `allow` hier heisst nicht, dass die Anfrage
// auch hinausginge (ein Ziel im privaten Netz lehnt der Proxy weiter ab).
message RuleTest {
  // Die geltende Aktion. Ohne Treffer ist das RULE_ACTION_ASK: die Vorgabe des
  // Vertrags, nicht die Entscheidung einer Regel (ADR-007).
  RuleAction action = 1;
  // Wahr, wenn eine Regel getroffen hat. Nur damit laesst sich ein `ask` aus
  // einer Regel von der Vorgabe unterscheiden.
  bool matched = 2;
  // Die Regel, die getroffen hat; leer, wenn keine traf. Die ganze Regel steht
  // in `rules` derselben Antwort.
  string rule_id = 3;
  // Platz der treffenden Regel in ihrer Gruppe, 1-basiert (siehe
  // `Rule.position`); 0, wenn keine traf.
  uint32 position = 4;
}

// ---------- Sandbox ----------

// Zustand der Sandbox.
enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_STOPPED = 1;
  SANDBOX_STATE_STARTING = 2;
  SANDBOX_STATE_RUNNING = 3;
  SANDBOX_STATE_STOPPING = 4;
  SANDBOX_STATE_FAILED = 5;
}

// Ob die Sandbox verweigerte Versuche meldet (HUM-138).
enum RefusalReporting {
  // Der Shim hat noch nichts dazu gesagt.
  REFUSAL_REPORTING_UNSPECIFIED = 0;
  REFUSAL_REPORTING_ON = 1;
  // Verweigert wird weiter, gemeldet nicht (`SANDBOX_019`).
  REFUSAL_REPORTING_OFF = 2;
}

// Welche Haelfte der Socket-Sperre verweigert hat (HUM-138).
enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;
  // Die Familie steht nicht in `allow_families`.
  REFUSAL_REASON_FAMILY = 1;
  // Die Familie ist erlaubt, der Typ nicht.
  REFUSAL_REASON_TYPE = 2;
  // Der Sammelposten fuer alle Paare ueber der Grenze des Shims.
  REFUSAL_REASON_OVERFLOW = 3;
}

// Die drei Garantien, die nach dem Start geprueft werden.
enum IsolationCheck {
  ISOLATION_CHECK_UNSPECIFIED = 0;
  ISOLATION_CHECK_NO_NETWORK_INTERFACE = 1;
  ISOLATION_CHECK_SINGLE_SOCKET = 2;
  ISOLATION_CHECK_SECCOMP_ACTIVE = 3;
}

// Eine Operation auf der Sandbox.
message SandboxRequest {
  oneof op {
    Start start = 1;
    google.protobuf.Empty stop = 2;
    google.protobuf.Empty status = 3;
    google.protobuf.Empty isolation_check = 4;
    // Liefert die vollstaendige Kommandozeile, ohne zu starten.
    google.protobuf.Empty argv = 5;
    // Wie `status`, aber fuer ein Projektverzeichnis, das noch nicht gilt.
    Plan plan = 6;
    // Beendet den Daemon, wenn keine Sitzung ihn haelt (HUM-284): Pruefen und
    // Riegeln geschehen unter dem Schloss, unter dem ein Start seinen
    // Anspruch nimmt, und ab dem Riegel bekommt kein Start mehr einen. Die
    // Antwort ist genau ein `SandboxEvent.retire`; danach endet der Daemon
    // mit dem gewoehnlichen Abschied, und die Socket-Aktivierung startet bei
    // der naechsten Verbindung das Programm, das jetzt installiert ist. Ein
    // Daemon vor Minor 19 kennt die Operation nicht und antwortet mit einer
    // Momentaufnahme wie auf `status`.
    google.protobuf.Empty retire_if_idle = 7;
    // Die Aenderungen einer Wegwerf-Sandbox, die auf eine Entscheidung
    // warten (HUM-350). Die Antwort ist genau ein `SandboxEvent.changes`;
    // ohne wartende Aenderungen oder solange die Sandbox laeuft ein
    // `Diagnostic` (`SANDBOX_031`). Ein Daemon vor Minor 25 antwortet mit
    // einer Momentaufnahme wie auf `status`.
    google.protobuf.Empty changes = 8;
    // Uebernimmt die gewaehlten Aenderungen in das Projektverzeichnis und
    // verwirft den Rest (HUM-350). Die Antwort ist ein
    // `SandboxEvent.changes_outcome`. Scheitert eine Pruefung vor dem ersten
    // Schreiben, kommt nur ein `Diagnostic` (`SANDBOX_031`), nichts ist
    // geschrieben, und die Schicht bleibt fuer einen zweiten Versuch.
    ApplyChanges apply_changes = 9;
    // Verwirft alle wartenden Aenderungen (HUM-350). Die Antwort ist ein
    // `SandboxEvent.changes_outcome` mit `outcome = "discarded"`.
    DiscardChanges discard_changes = 10;
    // Zieht ein Abbild als Wurzel der Sandbox in den lokalen Speicher der
    // Container-Engine, auf ausdruecklichen Wunsch (HUM-439). Kein Start
    // zieht je; nur diese Operation tut es. Das Ziehen nutzt das Netz des
    // Daemons direkt, nicht durch den Proxy, und ein Client sagt das, bevor
    // er sie schickt. Die Antwort ist genau ein `SandboxEvent.image_pulled`,
    // oder ein `Diagnostic`: `CONFIG_003` fuer einen Verweis ohne Digest oder
    // ohne Registry, `SANDBOX_043`, wenn das Ziehen scheitert oder danach
    // nicht genau dieser Digest vorliegt, `SANDBOX_048`, solange das Backend
    // mit Abbildern nicht zugelassen ist, `SANDBOX_034` fuer ein Backend ohne
    // Abbilder. Mit `ImagePull.plan` zieht das Backend, das ein Start mit
    // diesem Plan bekaeme (HUM-500). Ein Daemon vor Minor 36 antwortet mit
    // einer Momentaufnahme wie auf `status`.
    ImagePull image_pull = 11;
    // Bricht ein laufendes Ziehen ab (HUM-457): das mit dieser
    // `ImagePull.pull_id`. Der Daemon beendet die Prozessgruppe des Ziehens
    // mit `SIGKILL` und antwortet, wenn das Ziehen zurueckgekehrt ist, mit
    // genau einem `SandboxEvent.image_pull_cancelled`. Das abgebrochene
    // Ziehen selbst endet auf seinem eigenen Strom mit `SANDBOX_043`.
    // Laeuft kein Ziehen mit dieser Kennung, oder endete es von selbst, ohne
    // dass die Engine unterbrochen wurde, ist die Antwort
    // `cancelled = false` und kein Fehler; dann gilt das Ergebnis des
    // Ziehens. Eine leere oder unlesbare Kennung ist `IPC_005`. Ein Daemon
    // vor Minor 37 antwortet mit einer Momentaufnahme wie auf `status`.
    CancelImagePull cancel_image_pull = 12;
    // Merkt die Bestaetigung des Hinweises auf Cloud-Inferenz fuer genau
    // diesen Agenten und Anbieter (HUM-516), im Datenverzeichnis des Daemons,
    // nie im Projekt. Die Antwort ist genau ein
    // `SandboxEvent.cloud_inference_acknowledged`, bei einer Kennung oder
    // einem Host, die keine sind, ein `Diagnostic` (`CONFIG_003`). Danach
    // traegt `Status.cloud_inference.acknowledged` fuer diese Kombination
    // `true`, und kein Client fragt beim Start noch einmal. Ein Daemon vor
    // Minor 43 antwortet mit einer Momentaufnahme wie auf `status`.
    AcknowledgeCloudInference acknowledge_cloud_inference = 13;
    // Wohin die Inferenz eines Starts mit genau diesen Angaben ginge
    // (HUM-516), `cli_overrides` eingeschlossen, ohne dass etwas startet oder
    // gemerkt wird. Die Antwort ist genau ein
    // `SandboxEvent.cloud_inference_check`, bei einer Konfiguration, die
    // sich nicht aufloesen laesst, ein `Diagnostic`. Ein Client fragt damit
    // vor dem Start, ob er einmal nachfragen muss.
    Start check_cloud_inference = 14;
  }

  // Welches Abbild gezogen wird (HUM-439).
  message ImagePull {
    // `name@sha256:<64 hex>`, mit der Registry im Namen. Leer heisst: das
    // eingestellte Abbild der Sandbox.
    string reference = 1;
    // Die Kennung dieses Ziehens, eine UUID, die der Client waehlt
    // (HUM-457). Er kennt sie so, bevor der Daemon antwortet, und kann
    // abbrechen, sobald er geschickt hat. Leer heisst: nicht abbrechbar,
    // wie vor Minor 37. Eine unlesbare Kennung, oder eine, unter der gerade
    // ein anderes Ziehen laeuft, ist `IPC_005`, und nichts wird gezogen.
    string pull_id = 2;
    // Der Plan des Starts, fuer den gezogen wird, wie
    // `SandboxBackendsRequest.plan` (HUM-500). Das Backend des Ziehens ist
    // dann das, das ein Start mit diesem Plan bekaeme: `Plan.backend` als
    // Wahl der Sitzung, Projekt-Profil, Untergrenze, Zulassung und das
    // Backend, das das Sandbox-Profil verlangt; waehrend eine Sitzung
    // laeuft, deren Konfiguration. Ein Name, den das Schema nicht kennt, ist
    // `CONFIG_003` wie beim Start, und nichts wird gezogen. Fehlt der Plan,
    // gilt `sandbox.backend` der gespeicherten Konfiguration, wie vor
    // Minor 40. Ein Daemon vor Minor 40 kennt das Feld nicht und zieht mit
    // der Einstellung.
    Plan plan = 3;
  }

  // Welches Ziehen abgebrochen wird (HUM-457).
  // Welche Kombination aus Agent und Anbieter bestaetigt ist (HUM-516).
  message AcknowledgeCloudInference {
    // Wie `CloudInference.agent`, etwa `opencode`.
    string agent = 1;
    // Wie `CloudInference.provider`, etwa `api.anthropic.com`.
    string provider = 2;
  }

  message CancelImagePull {
    // Die `ImagePull.pull_id` des Ziehens.
    string pull_id = 1;
  }

  // Welche Aenderungen einer Wegwerf-Sandbox uebernommen werden (HUM-350).
  message ApplyChanges {
    // Der Lauf, wie `DisposableChanges.sandbox_id`. Leer heisst: der eine,
    // dessen Aenderungen warten; ein anderer ist `SANDBOX_031`.
    string sandbox_id = 1;
    // Die `DisposableChange.id` der gewaehlten Aenderungen. Leer heisst:
    // alle, und das wird abgelehnt, wenn die Liste abgeschnitten ist.
    repeated string ids = 2;
    // Auch Dateien schreiben, die der Mensch seit dem Start im Projekt
    // geaendert hat, und zwar jede gewaehlte: gleichbedeutend mit
    // `overwrite_ids` = alle Kennungen in `ids` (bei leerem `ids` alle). Ohne
    // den Schalter und ohne Eintrag in `overwrite_ids` ist jeder Konflikt ein
    // Abbruch vor dem ersten Schreiben. Die Kommandozeile setzt ihn fuer
    // `humanitl sandbox apply --overwrite`; die Oberflaeche setzt ihn nie,
    // sondern nennt jede bestaetigte Datei einzeln (HUM-351).
    bool overwrite = 3;
    // Die Kennungen (`DisposableChange.id`), deren Konflikt jemand einzeln
    // bestaetigt hat (HUM-351). Ein Eintrag mit Konflikt wird nur
    // ueberschrieben, wenn seine Kennung hier steht oder `overwrite` gilt;
    // ein anderer Konflikt bricht ab, auch wenn er erst nach der Auswahl
    // entstand. Ein Daemon vor Minor 26 kennt das Feld nicht und bricht an
    // jedem Konflikt ab.
    repeated string overwrite_ids = 4;
  }

  // Welche Aenderungen verworfen werden: immer alle (HUM-350).
  message DiscardChanges {
    // Wie `ApplyChanges.sandbox_id`.
    string sandbox_id = 1;
  }

  // Start einer Sandbox-Session.
  message Start {
    // Das bwrap-Profil unter `profiles/sandbox/`, zum Beispiel `default`.
    // Das ist nicht das Profil der Sitzung; das steht in `session_profile`.
    string profile = 1;
    string work_dir = 2;
    // `ro` oder `rw`.
    string work_mode = 3;
    repeated string command = 4;
    // Das Profil der Sitzung (`profiles/*.toml`, HUM-066), zum Beispiel
    // `llm-only`. Leer heisst: das Profil, das die Aufloesung ohne Wunsch
    // waehlt. Der Daemon loest die Konfiguration fuer genau diesen Start
    // erneut auf; Regelspeicher, Haltefrist und Durchreiche entstehen daraus
    // neu (HUM-067).
    string session_profile = 5;
    // `ui`, `terminal`, `none` oder `upstream` (HUM-512, nur mit
    // `egress.proxy`, den der laufende Daemon auch nutzt; sonst `CONFIG_003`).
    // Leer heisst: der Wert aus dem Profil.
    string ask_mode = 6;
    // Einzelne Konfigurationswerte fuer diese Sitzung, auf der Ebene der
    // Kommandozeile. Der Daemon nimmt nur die Pfade seiner Erlaubnisliste an
    // und antwortet auf jeden anderen mit `CONFIG_003`: Ein Client, der jeden
    // Pfad setzen duerfte, koennte die Einhaengeflaeche der Sandbox und den
    // Prozess darin bestimmen.
    repeated CliOverride cli_overrides = 7;
    // Woher der Client `work_dir` hat (HUM-293). Der Daemon nennt die Quelle
    // in jedem `SANDBOX_006` ueber dieses Verzeichnis; ohne Angabe heisst sie
    // "the work_dir of the request". Leer bei leerem `work_dir`.
    WorkDirSource work_dir_source = 8;
    // `auto`, `direct` oder `disposable` (HUM-350, HUM-357). Leer heisst:
    // `sandbox.mode` aus der Konfiguration. `auto` faellt auf `direct`
    // zurueck, wo das System keine Wegwerf-Sandbox kann, und meldet das mit
    // `SANDBOX_033`; `disposable` lehnt dort mit `SANDBOX_030` ab. Mit `disposable` liegt das Projektverzeichnis nur
    // lesbar unter einer Schicht im Arbeitsspeicher, und nach dem Ende
    // warten die Aenderungen auf `changes`, `apply_changes` oder
    // `discard_changes`.
    string sandbox_mode = 9;
    // Der Name eines gespeicherten Modellservers (`llm.servers`), der fuer
    // genau diesen Lauf gilt (HUM-400): `humanitl run --llm NAME` oder die
    // Wahl im Startbereich. Leer heisst: die Wahl von Projekt, Profil oder
    // `llm.active`. Er waehlt nur unter den Servern, die der Nutzer
    // gespeichert hat; ein Name ohne Eintrag ist `CONFIG_021`, und nichts
    // startet. Ein Daemon vor Minor 28 kennt das Feld nicht und nimmt die
    // Wahl ohne ihn.
    string llm_server = 10;
    // Der Mensch hat den Hinweis auf Cloud-Inferenz fuer genau diesen Agenten
    // und Anbieter bestaetigt (HUM-516), so wie der Client sie gezeigt hat.
    // Stimmen beide mit dem ueberein, was die Aufloesung dieses Starts
    // ergibt, merkt der Daemon die Bestaetigung und startet; sonst lehnt er
    // mit `LLM_011` und dem Anbieter ab, den der Start wirklich haette.
    CloudNoticeFor acknowledge_cloud_inference = 11;
    // Der Client hat den Hinweis fuer diesen Agenten und Anbieter gezeigt,
    // ohne fragen zu koennen (HUM-516): ohne Terminal oder mit `--json` eine
    // Zeile auf stderr. Stimmt er mit der Aufloesung ueberein, startet der
    // Daemon und merkt nichts. Ohne passendes Feld lehnt der Daemon einen
    // Start mit einer unbestaetigten Kombination mit `LLM_011` ab; er
    // entscheidet an der ganz aufgeloesten Konfiguration des Starts,
    // `cli_overrides` eingeschlossen.
    CloudNoticeFor cloud_notice_shown = 12;
  }

  // Ein Konfigurationswert, den der Client fuer diese Sitzung setzt.
  message CliOverride {
    // Der Pfad im Schema, zum Beispiel `llm.endpoint`.
    string path = 1;
    // Der Wert als Text, genau wie auf der Kommandozeile.
    string value = 2;
  }

  // Der Schnappschuss, den ein Start mit diesen Angaben haette, ohne dass
  // etwas startet. Leere Felder bedeuten: nimm den Wert der Konfiguration.
  // Damit sieht der Mensch die Mounts, die Umgebung und die Kommandozeile
  // eines Projektverzeichnisses, bevor er es einhaengt (HUM-040).
  message Plan {
    string profile = 1;
    string work_dir = 2;
    // `ro` oder `rw`.
    string work_mode = 3;
    // Wie `Start.work_dir_source` (HUM-293).
    WorkDirSource work_dir_source = 4;
    // Wie `Start.llm_server` (HUM-400): Der Schnappschuss nennt in
    // `Status.llm_server` den Server, den ein Start mit dieser Wahl bekaeme.
    string llm_server = 5;
    // Wie `Start.session_profile` (HUM-400): Der Schnappschuss ist dann der,
    // den ein Start mit diesem Profil der Sitzung bekaeme, samt dem Server,
    // den das Profil waehlt. Ein Profil, das es nicht gibt, ist `CONFIG_001`
    // wie beim Start. Leer heisst: das Profil ohne Wunsch.
    string session_profile = 6;
    // Wie `sandbox.backend` in `Start.cli_overrides` (HUM-440): Der
    // Schnappschuss ist der eines Starts mit diesem Backend, samt den
    // Befunden, die einen solchen Start aufhielten (`SANDBOX_034` bis
    // `SANDBOX_036`, `SANDBOX_048`, die Suche des Backends). Ein Name, den
    // das Schema nicht kennt, ist `CONFIG_003` wie beim Start. Leer heisst:
    // `sandbox.backend` der Konfiguration. Waehrend eine Sitzung laeuft, gilt
    // ihr Backend. Ein Daemon vor Minor 38 kennt das Feld nicht und nimmt die
    // Einstellung.
    string backend = 7;
    // Wie `Start.cli_overrides` (HUM-559): dieselben Werte der Sitzung, mit
    // derselben Erlaubnisliste und derselben Pruefung; ein Pfad ausserhalb
    // ist `CONFIG_003` wie beim Start. Der Schnappschuss ist dann der eines
    // Starts mit diesen Werten, vor allem mit der Untergrenze
    // `sandbox.min_isolation`, die nur hebt: Liegt das gewaehlte Backend
    // darunter, nennt der Plan `SANDBOX_035` wie der Start. Steht
    // `sandbox.backend` hier und in `backend`, gilt `backend`. Waehrend eine
    // Sitzung laeuft, gelten ihre Werte. Ein Daemon vor Minor 55 kennt das
    // Feld nicht und zeigt den Plan ohne diese Werte.
    repeated CliOverride cli_overrides = 8;
  }
}

// Welcher gespeicherte Modellserver fuer eine Sitzung gilt und woher die
// Wahl kommt (HUM-400).
//
// Der Server ist die Durchreiche der Sitzung und der einzige Endpunkt, der
// ihren Schluessel bekommt. Fehlt die Nachricht im Schnappschuss, gilt kein
// gespeicherter Server: keiner ist eingetragen, oder ein Endpunkt aus einer
// hoeheren Ebene (`--llm URL`, `HUMANITL_LLM__ENDPOINT`) steht an seiner
// Stelle, und dann geht kein hinterlegter Schluessel hinaus.
message LlmServerChoice {
  enum Source {
    // Keine Angabe: ein Daemon vor Minor 28.
    SOURCE_UNSPECIFIED = 0;
    // Dieser eine Lauf: `Start.llm_server`, `humanitl run --llm NAME` oder
    // eine Umgebungsvariable.
    SOURCE_RUN = 1;
    // `llm.server` im Projekt-Profil; `detail` ist sein Pfad.
    SOURCE_PROJECT = 2;
    // `llm.server` in einem Profil der Sitzung; `detail` ist sein Name.
    SOURCE_PROFILE = 3;
    // Die Vorgabe des Nutzers: `llm.active` (oder `llm.server` in
    // `config.toml`).
    SOURCE_DEFAULT = 4;
  }
  // Der Name des Servers.
  string name = 1;
  Source source = 2;
  // Pfad des Projekt-Profils oder Name des Profils, je nach `source`;
  // sonst leer.
  string detail = 3;
  // `CONFIG_021`, wenn der Name keinen gespeicherten Server nennt: Dann gilt
  // kein Endpunkt und kein Schluessel, und ein Start lehnt mit genau diesem
  // Befund ab. Fehlt, wenn es den Server gibt.
  Diagnostic refusal = 4;
  // `CONFIG_022`, wenn das Projekt einen anderen gespeicherten Server als
  // den Standard waehlt und diese Wahl fuer diesen Projektordner noch nicht
  // bestaetigt ist (`LlmServersRequest.ConfirmProject`); ein Start lehnt
  // dann mit genau diesem Befund ab (HUM-405). Fehlt sonst.
  Diagnostic unconfirmed = 5;
  // Der Projektordner, dessen Profil die Wahl trifft, bei `SOURCE_PROJECT`;
  // sonst leer (HUM-405). Fuer die Anzeige bereinigt.
  string project_dir = 6;
  // Derselbe Ordner unbereinigt, genau wie der Daemon ihn aufloest; nur
  // fuer `LlmServersRequest.ConfirmProject.project_dir` zurueck, nie zur
  // Anzeige (HUM-405, Review).
  string project_path = 7;
}

// Woher ein Projektverzeichnis kommt, das ein Client in `work_dir` schickt
// (HUM-293). Die Angabe aendert keine Pruefung und keine Einhaengung; sie
// steht nur im Satz eines `SANDBOX_006`, damit der Mensch an der richtigen
// Stelle nachsieht und nicht in einer `config.toml`, in der nichts steht.
message WorkDirSource {
  enum Kind {
    // Keine Angabe: ein Client vor HUM-293.
    KIND_UNSPECIFIED = 0;
    // `--work` (`--sandbox-work-dir`) auf der Kommandozeile.
    KIND_FLAG = 1;
    // Das aktuelle Verzeichnis des Clients, weil nichts gesetzt ist.
    KIND_CURRENT_DIRECTORY = 2;
    // `sandbox.work_dir` in einer Konfigurationsdatei; `detail` ist ihr Pfad.
    KIND_CONFIG_FILE = 3;
    // Eine Umgebungsvariable; `detail` ist ihr Name.
    KIND_ENVIRONMENT = 4;
    // `sandbox.work_dir` in einem Profil; `detail` ist sein Name.
    KIND_PROFILE = 5;
  }
  Kind kind = 1;
  // Pfad, Variablenname oder Profilname, je nach `kind`; sonst leer.
  string detail = 2;
}

// Wie ein Pfad in der Sandbox eingehaengt ist. Die Mode-Angabe kommt aus der
// Kommandozeile selbst, nicht aus einer zweiten Buchfuehrung daneben.
enum MountMode {
  MOUNT_MODE_UNSPECIFIED = 0;
  // `--ro-bind`: der Host-Pfad, nur lesbar.
  MOUNT_MODE_RO = 1;
  // `--bind`: der Host-Pfad, schreibbar.
  MOUNT_MODE_RW = 2;
  // `--tmpfs`: leeres Dateisystem im Speicher, nichts vom Host.
  MOUNT_MODE_TMPFS = 3;
  // `--ro-bind-data`: eine Datei aus dem Speicher des Daemons, meist leer;
  // so werden Pfade maskiert und die Dateien des Agenten gelegt.
  MOUNT_MODE_MASKED = 4;
  // `--proc`: eine eigene `procfs`-Instanz dieses PID-Namensraums.
  MOUNT_MODE_PROC = 5;
  // `--dev`: das minimale `devtmpfs` von bubblewrap.
  MOUNT_MODE_DEV = 6;
  // `--symlink`: ein Verweis, kein Mount.
  MOUNT_MODE_SYMLINK = 7;
  // Unter Seatbelt: Das Profil verbietet Lesen und Schreiben. Ein Pfad ohne
  // Einhaengung, nur eine Regel (HUM-376).
  MOUNT_MODE_DENIED = 8;
  // Die Wurzel ist ein Abbild der Container-Engine (HUM-439). `Mount.src`
  // traegt den Verweis samt Digest (`name@sha256:...`), keinen Pfad auf dem
  // Rechner. Ein Client vor Minor 36 kennt den Wert nicht.
  MOUNT_MODE_IMAGE = 9;
}

// Woher ein Mount oder eine Umgebungsvariable stammt.
enum ValueOrigin {
  VALUE_ORIGIN_UNSPECIFIED = 0;
  // Aus dem Sandbox-Profil.
  VALUE_ORIGIN_PROFILE = 1;
  // Vom Agent-Adapter beigesteuert.
  VALUE_ORIGIN_ADAPTER = 2;
  // Aus der Sitzung: Projektverzeichnis, Proxy-Socket, CA, Shim.
  VALUE_ORIGIN_SESSION = 3;
  // Aus den Erweiterungen des Nutzers im Profil (`mounts.extra_ro`,
  // `mounts.extra_rw`). Sie stehen getrennt, weil der Satz im
  // Einhaenge-Reiter genau sie als Ausnahme nennen muss: alles, was ausser
  // dem Projektverzeichnis vom Rechner des Nutzers hineinreicht.
  VALUE_ORIGIN_USER = 4;
}

// Ein Pfad, den der Agent in der Sandbox sieht.
message Mount {
  // Der Pfad in der Sandbox.
  string dst = 1;
  // Der Pfad **auf dem Host**; leer, wo es keinen gibt (tmpfs, proc, dev, und
  // ein Verweis) oder wo der Inhalt aus dem Speicher des Daemons kommt. Die
  // Oberflaeche beschriftet jedes nichtleere `src` mit „auf diesem Rechner";
  // was dort steht, muss deshalb wirklich ein Wirtspfad sein.
  string src = 2;
  MountMode mode = 3;
  ValueOrigin origin = 4;
  // Wohin ein `MOUNT_MODE_SYMLINK` zeigt, in der Sandbox. Leer bei jedem
  // anderen Modus. Ein eigenes Feld, weil das Ziel eines Verweises innerhalb
  // der Sandbox liegt und kein Wirtspfad ist.
  string link_target = 5;
  // Unter Seatbelt gibt es keine eigene Sicht auf das Dateisystem: `dst` und
  // `src` sind derselbe echte Pfad, und die Namen, unter denen die Profildatei
  // ihn fuehrt (`/work`, `/tmp`), stehen hier, durch `, ` getrennt. Leer, wo
  // die Datei ihn nicht nennt, und immer unter Linux (HUM-376).
  string profile_path = 6;
}

// Eine Umgebungsvariable, die die Sandbox setzt.
message EnvVar {
  string key = 1;
  // Der Wert. Leer, wenn `withheld` gilt.
  string value = 2;
  ValueOrigin origin = 3;
  // Der Wert wurde zurueckgehalten und ist gar nicht erst auf der Leitung.
  //
  // Zurueckgehalten wird nach einer Erlaubnisliste, nicht nach einer Liste
  // verdaechtiger Namen: gezeigt werden nur die Werte, die belegen, wohin der
  // Agent darf (Proxy, Zertifikate, Pfade, Sprache) und die der Adapter zur
  // Steuerung setzt. Jeder andere Wert bleibt zurueck. Eine Namensliste fuer
  // Geheimnisse waere prinzipiell unvollstaendig — `AWS_ACCESS_KEY_ID` und
  // `DATABASE_URL` heissen nicht danach und tragen doch eines —, und die
  // Vorgabe muss auf der sicheren Seite stehen (HUM-040).
  bool withheld = 4;
}

// Ergebnis einer Isolationspruefung.
message CheckResult {
  IsolationCheck check = 1;
  bool passed = 2;
  string evidence = 3;
  Diagnostic diagnostic = 4;
}

// Welcher Strom der Sandbox eine Ausgabe geschrieben hat.
enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

// Ein Ereignis der Sandbox.
message SandboxEvent {
  oneof event {
    Status status = 1;
    CheckResult check = 2;
    // Eine Zeile der Kommandozeile, wie sie das UI anzeigt.
    string argv_line = 3;
    Diagnostic diagnostic = 4;
    LogLine log = 5;
    // Ausgabe des Agenten, waehrend er laeuft.
    OutputChunk output = 6;
    // Der Agent ist beendet.
    Exit exit = 7;
    // Was der Lauf im Projektverzeichnis hinterlassen hat (HUM-043). Kommt
    // einmal, nachdem der Agent beendet ist, ohne dass ein Client danach
    // fragen muss. Dieselbe Nachricht liefert `GetSessionSummary` spaeter
    // wieder; sie steht in der Aufzeichnung.
    SessionSummary summary = 8;
    // Was der Filter dem Agenten an Sockets verweigert hat, zusammengefasst
    // (HUM-138). Kommt, wenn sich der Stand aendert, hoechstens alle zwei
    // Sekunden, und einmal nach dem Ende des Agenten. Jede Nachricht traegt
    // den ganzen Stand und ersetzt die vorige. Nur auf dem Strom des Starts,
    // der die Sitzung begonnen hat; jeder andere Client liest den Stand aus
    // `Status.refusals`, wenn er die Momentaufnahme holt (HUM-202).
    Refusals refusals = 9;
    // Die Antwort auf `SandboxRequest.retire_if_idle` (HUM-284).
    Retire retire = 10;
    // Die wartenden Aenderungen einer Wegwerf-Sandbox (HUM-350). Kommt
    // einmal nach dem Ende des Agenten auf dem Strom des Starts und als
    // Antwort auf `SandboxRequest.changes`.
    DisposableChanges changes = 11;
    // Was mit den Aenderungen geschehen ist, als Antwort auf
    // `apply_changes` und `discard_changes` (HUM-350).
    DisposableOutcome changes_outcome = 12;
    // Die Antwort auf `SandboxRequest.image_pull` (HUM-439).
    ImagePulled image_pulled = 13;
    // Die Antwort auf `SandboxRequest.cancel_image_pull` (HUM-457).
    ImagePullCancelled image_pull_cancelled = 14;
    // Die Antwort auf `SandboxRequest.acknowledge_cloud_inference` (HUM-516).
    CloudInferenceAcknowledged cloud_inference_acknowledged = 15;
    // Die Antwort auf `SandboxRequest.check_cloud_inference` (HUM-516).
    CloudInferenceCheck cloud_inference_check = 16;
  }

  // Ob ein Abbruch ein laufendes Ziehen traf (HUM-457).
  // Die gespeicherte Bestaetigung, in der Form, in der der Daemon sie
  // ablegt: `provider` kanonisch, wie `CloudInference.provider`.
  message CloudInferenceAcknowledged {
    string agent = 1;
    string provider = 2;
  }

  // Wohin die Inferenz des geprueften Starts ginge; `cloud_inference` fehlt,
  // wenn sie lokal bliebe.
  message CloudInferenceCheck {
    CloudInference cloud_inference = 1;
  }

  message ImagePullCancelled {
    // Wahr: Der Daemon hat die Engine unterbrochen, und das Ziehen ist
    // beendet. Falsch: Unterbrochen wurde nichts; es lief kein Ziehen unter
    // der Kennung, oder es endete von selbst.
    bool cancelled = 1;
    // Nur mit `cancelled`: wie viele Prozesse der Prozessgruppe des Ziehens
    // nach dem `SIGKILL` noch liefen (ein Zombie zaehlt nicht). Null heisst:
    // Von diesem Ziehen laeuft nichts mehr. Ein Prozess, der sich mit
    // `setsid` aus der Gruppe loeste, wird weder beendet noch gezaehlt.
    uint32 still_running = 2;
  }

  // Ein Abbild, das gezogen und danach mit genau seinem Digest im lokalen
  // Speicher gefunden wurde (HUM-439).
  message ImagePulled {
    // Der Verweis, wie er gezogen wurde: `name@sha256:<hex>`.
    string reference = 1;
    // Der Digest, `sha256:<hex>`.
    string digest = 2;
    // Die Kennung des Abbilds in der Container-Engine.
    string image_id = 3;
  }

  // Ob der Daemon sich verabschiedet (HUM-284).
  message Retire {
    // Wahr: keine Sitzung hielt ihn, der Riegel steht, und er endet jetzt.
    // Falsch: eine Sitzung haelt ihn (ein Start mit Anspruch oder eine
    // gehaltene Sandbox), und er laeuft weiter.
    bool retired = 1;
  }

  // Die verweigerten `socket(2)`-Aufrufe eines Laufs (HUM-138).
  //
  // Gezaehlt, nicht protokolliert: ein Eintrag je Paar aus Familie und Typ,
  // hoechstens sechzehn plus ein Sammelposten. Nicht darin steht ein
  // `connect(2)`, das an der leeren Routing-Tabelle scheitert: das ist kein
  // verweigerter Aufruf, sondern die Netzlosigkeit der Sandbox, und die steht
  // als Garantie 1 im Isolations-Reiter.
  message Refusals {
    RefusalReporting reporting = 1;
    // Warum nicht gemeldet wird, wie der Shim es nennt (`errno16`); leer,
    // solange gemeldet wird.
    string off_reason = 2;
    repeated Refusal entries = 3;
  }

  // Die Versuche eines Paares aus Familie und Typ.
  message Refusal {
    // Der verweigerte Aufruf; heute immer `socket`.
    string syscall = 1;
    // `AF_UNIX`, `AF_NETLINK`, `AF_<n>` fuer eine Familie ohne Namen, `*`
    // fuer den Sammelposten.
    string family = 2;
    // `SOCK_DGRAM`, `SOCK_RAW`, `SOCK_<n>`, `*` fuer den Sammelposten.
    string socket_type = 3;
    RefusalReason reason = 4;
    // Wie oft, seit der Agent laeuft.
    uint64 count = 5;
    google.protobuf.Timestamp first_at = 6;
    google.protobuf.Timestamp last_at = 7;
  }

  // Ein Stueck Ausgabe des Agenten.
  //
  // Die Bytes sind gefiltert, bevor sie den Daemon verlassen: OSC 52
  // (Zwischenablage) und OSC 8 (Verweise) sind entfernt, denn die Ausgabe des
  // Agenten ist einer der fuenf erklaerten Seitenkanaele (BACKLOG.md 4.2).
  // Ein PTY gibt es hier nicht; das kommt mit HUM-042.
  message OutputChunk {
    OutputStream stream = 1;
    bytes data = 2;
  }

  // Der Agent hat sich beendet.
  message Exit {
    // Sein Exit-Code, oder 128 plus die Nummer des Signals, das ihn beendet
    // hat.
    int32 code = 1;
  }

  // Momentaufnahme der Sandbox.
  message Status {
    SandboxState state = 1;
    string sandbox_id = 2;
    string session_id = 3;
    string backend = 4;
    string llm_endpoint = 5;
    string work_dir = 6;
    string work_mode = 7;
    // Wann die laufende Sandbox gestartet wurde; fehlt, solange keine laeuft.
    google.protobuf.Timestamp started_at = 8;
    // Name des Sandbox-Profils, zum Beispiel `default`.
    string profile = 9;
    // Jeder Pfad, den der Agent sieht, in der Reihenfolge der Kommandozeile.
    repeated Mount mounts = 10;
    // Jede Umgebungsvariable, die die Sandbox setzt, alphabetisch.
    repeated EnvVar env = 11;
    // Die vollstaendige Kommandozeile als eine Zeile, so wie eine Shell sie
    // liest. Der Beleg, an dem sich alles Uebrige nachpruefen laesst.
    string argv_preview = 12;
    // Ob in der Sandbox noch ein Prozess laeuft. Eine Sitzung, deren Agent
    // sich beendet hat, steht noch als `running`, hat aber niemanden mehr,
    // den ein Stopp unterbrechen koennte; die Oberflaeche fragt dann nicht
    // nach (HUM-040).
    bool agent_running = 13;
    // Der Stand der verweigerten Versuche der laufenden Sandbox, fuer einen
    // Client, der den Start nicht selbst begleitet hat (HUM-138): zum
    // Zeitpunkt der Momentaufnahme, ohne Folgeereignisse. Fehlt, solange
    // keine Sandbox laeuft.
    Refusals refusals = 14;
    // Der Befund zur Durchreiche an das Modell im laufenden Lauf (HUM-251):
    // `LLM_001` mit `ChangeSetting` auf `llm.endpoint`, solange die letzte
    // Anfrage, die die Durchreiche freigab, an der Verbindung scheiterte
    // (Name, Verbindung, TLS oder Frist). Fehlt, solange keine scheiterte,
    // sobald wieder eine Antwort kam, und ausserhalb eines Laufs. Aendert er
    // sich, kommt auf dem Strom des Starts eine neue Momentaufnahme; jeder
    // andere Client liest ihn, wenn er sie holt.
    Diagnostic llm = 15;
    // Der Modus, den ein Start mit diesem Plan und leerem
    // `Start.sandbox_mode` bekaeme (HUM-357): `direct` oder `disposable`, nie
    // `auto`. Der Daemon loest `sandbox.mode` dafuer gegen das auf, was das
    // System kann. Gilt fuer den naechsten Start, auch waehrend eine Sandbox
    // laeuft. Leer im Schnappschuss eines Befunds (`failed`) und bei einem
    // Daemon vor Minor 27.
    string sandbox_mode = 16;
    // Warum `sandbox_mode` nicht ist, was `sandbox.mode` verlangt (HUM-357):
    // `SANDBOX_033`, wenn die Vorgabe `auto` auf `direct` zurueckfaellt, oder
    // `SANDBOX_030`, wenn ein ausdrueckliches `disposable` hier nicht geht
    // und der Start ablehnen wird. Fehlt, wenn der Modus gilt wie verlangt.
    Diagnostic sandbox_mode_notice = 17;
    // Der gespeicherte Modellserver dieser Sitzung und woher die Wahl kommt
    // (HUM-400). Waehrend eine Sandbox laeuft der ihre; sonst der, den ein
    // Start mit diesem Plan bekaeme, mit dem Projekt-Profil des
    // Projektverzeichnisses und `Plan.llm_server`. `llm_endpoint` ist dann
    // sein Endpunkt. Fehlt, wenn kein gespeicherter Server gilt, und bei
    // einem Daemon vor Minor 28.
    LlmServerChoice llm_server = 18;
    // Das Regelwerk, das die Sandbox wirklich begrenzt, wenn das Backend eines
    // hat: unter Seatbelt der Text von `sandbox.sb`. Leer unter Linux, dort
    // sagt `argv_preview` alles, und im Schnappschuss eines Befunds. Was erst
    // der Start festlegt, steht als `SESSION_PORT` und `AGENT_PORT` darin
    // (HUM-376).
    string policy_text = 19;
    // Die eine Tuer in die Sandbox, wie das Backend sie plant (HUM-429): die
    // Art in `snake_case` und die Adresse, unter der die Sandbox sie
    // erreicht, durch ein Leerzeichen getrennt, zum Beispiel
    // `socket_file /run/humanitl/proxy.sock` unter Linux oder
    // `loopback_port 127.0.0.1:SESSION_PORT` unter Seatbelt, wo erst der
    // Start den Port vergibt. Leer im Schnappschuss eines Befunds und bei
    // einem Daemon vor Minor 33.
    string door = 20;
    // Die Isolationsstufe des Backends in `backend` (HUM-432), dieselbe wie
    // `SandboxBackend.isolation_level` in `SandboxBackends`. Waehrend eine
    // Sandbox laeuft die ihre, sonst die des Backends, das ein Start mit
    // diesem Plan bekaeme. `UNSPECIFIED` im Schnappschuss eines Befunds, in
    // dem keine Wahl zustande kam, und bei einem Daemon vor Minor 34.
    IsolationLevel isolation_level = 21;
    // Der Weg hinaus, den der laufende Daemon fuer den Verkehr des Agenten
    // nimmt (HUM-511): direkt, oder ueber den Entscheidungs-Proxy aus
    // `egress.proxy`, wie er beim Start des Daemons galt. Fehlt bei einem
    // Daemon vor Minor 41.
    EgressRoute egress = 22;
    // Wer eine Anfrage ohne Regel entscheidet (`hold.ask_mode`, HUM-512):
    // `ui`, `terminal`, `none` oder `upstream`. Waehrend eine Sandbox laeuft
    // der Modus ihrer Sitzung, sonst der, den die Konfiguration ohne Wunsch
    // des Starts ergibt. Mit `upstream` entscheidet der Entscheidungs-Proxy
    // aus `egress`; die Oberflaeche nennt ihn und wer aufloest. Leer im
    // Schnappschuss eines Befunds und bei einem Daemon vor Minor 42.
    string ask_mode = 23;
    // Ob der Agent dieser Sitzung seine Inferenz an einen Anbieter ausserhalb
    // dieses Rechners schickt (HUM-516): waehrend eine Sandbox laeuft fuer
    // ihre Konfiguration, sonst fuer die eines Starts mit diesem Plan. Fehlt,
    // wenn der Endpunkt auf dem Loopback, im eigenen Netz oder auf einem
    // gespeicherten Server mit `local = true` liegt, ohne Endpunkt, im
    // Schnappschuss eines Befunds (ausser nach `LLM_011`: dann der Agent und
    // der Anbieter, die bestaetigt werden muessen) und bei einem Daemon vor
    // Minor 43. Die
    // Oberflaeche zeigt es als Tag oben in der Sitzung, die Kommandozeile
    // beim Start und in der Statuszeile.
    CloudInference cloud_inference = 24;
  }

  // Eine Zeile aus dem Log der Sandbox.
  message LogLine {
    google.protobuf.Timestamp at = 1;
    string line = 2;
  }
}

// ---------- Cloud-Inferenz (HUM-516) ----------

// Ein Agent, dessen Inferenz an einen Anbieter ausserhalb dieses Rechners
// geht. Was der Agent liest, geht als Teil seiner Anfragen dorthin; Humanitl
// isoliert das System und haelt jede andere Verbindung an, die Inferenz ist
// bewusst freigegeben. Der Hinweis blockiert nichts.
message CloudInference {
  // Die Kennung des Adapters (`agent.adapter`), etwa `opencode`.
  string agent = 1;
  // Der Host des Anbieters in kanonischer Form, ohne Port und Pfad, etwa
  // `api.anthropic.com`.
  string provider = 2;
  // Ob der Mensch den Hinweis fuer diesen Agenten und Anbieter schon einmal
  // bestaetigt hat (`SandboxRequest.acknowledge_cloud_inference`). Falsch
  // heisst: Ein Client fragt vor dem Start einmal nach.
  bool acknowledged = 3;
  // Der ganze Hinweis als `LLM_010` (Warnung), mit dem englischen Satz in
  // `why`, fuer einen Client ohne eigenen Text.
  Diagnostic notice = 4;
}

// Agent und Anbieter, fuer die ein Client den Hinweis auf Cloud-Inferenz
// gezeigt oder bestaetigt hat (HUM-516). Die Antwort gilt nur fuer genau
// diese Kombination.
message CloudNoticeFor {
  // Wie `CloudInference.agent`.
  string agent = 1;
  // Wie `CloudInference.provider`.
  string provider = 2;
}

// ---------- Entscheidungs-Proxy (HUM-511) ----------

// Der Weg hinaus fuer den Verkehr des Agenten (ADR-0022).
message EgressRoute {
  // `host:port` des Entscheidungs-Proxys; leer heisst direkt.
  string proxy = 1;
  // Wer den Namen des Ziels aufloest: `proxy` oder `humanitl`
  // (`egress.proxy_resolve`); ohne Proxy immer `humanitl`.
  string resolve = 2;
}

// Auftrag an `Egress`. Genau eine Operation.
message EgressRequest {
  // Nur den Stand lesen.
  message Status {}
  // Tunnel und TLS-Handschlag zum festen Ziel ueber `egress.proxy`.
  // `CheckConnection` und nicht `Check`: Der Dart-Generator benennt ein
  // Feld `check` um, weil jede Nachricht schon eine Methode `check()` hat.
  message CheckConnection {}
  // Zugangsdaten `NUTZER:PASSWORT` im Schluesselbund ablegen und
  // `egress.proxy_auth_ref` darauf richten. Sie stehen danach nie in
  // `config.toml`, in keiner Antwort, in keinem Log.
  message SetAuth {
    string credentials = 1;
  }
  // Die Zugangsdaten entfernen und `egress.proxy_auth_ref` herausnehmen.
  message RemoveAuth {}
  oneof op {
    Status status = 1;
    CheckConnection check_connection = 2;
    SetAuth set_auth = 3;
    RemoveAuth remove_auth = 4;
  }
}

// Der Stand des Entscheidungs-Proxys, ohne Zugangsdaten.
message EgressStatus {
  // Die Einstellungen, wie `config.toml` sie jetzt sagt; `proxy` als
  // `host:port`, leer ohne `egress.proxy`.
  EgressRoute configured = 1;
  // `egress.proxy_ca`; leer ohne.
  string proxy_ca = 2;
  // Wahr, wenn `egress.proxy_auth_ref` gesetzt ist und der Speicher die
  // Zugangsdaten haelt.
  bool auth_set = 3;
  // `egress.proxy_auth_ref`, etwa `secret-service:humanitl/egress-proxy`;
  // leer ohne.
  string auth_ref = 4;
  // Der Weg, den der laufende Daemon seit seinem Start nimmt. Weicht er von
  // `configured` ab, gilt die Datei erst nach einem Neustart.
  EgressRoute active = 5;
  // Nur nach `Check`: das feste Ziel, `example.com:443`.
  string check_target = 6;
  // Nur nach `Check`: wahr, wenn Tunnel und TLS-Handschlag standen.
  bool reachable = 7;
  // Was dazu zu sagen ist: der Befund des Checks (`PROXY_012` bis
  // `PROXY_017`), der Rueckfall der Zugangsdaten auf die Datei
  // (`CONFIG_019`), oder Zugangsdaten, die der Speicher nicht haelt.
  repeated Diagnostic diagnostics = 8;
}

// ---------- Sandbox-Backends (HUM-432) ----------

// Wie stark ein Backend die Sandbox vom Host trennt, von schwach nach stark.
// Dieselben drei Namen wie `sandbox.min_isolation`.
enum IsolationLevel {
  ISOLATION_LEVEL_UNSPECIFIED = 0;
  // Eine Richtlinie des Kerns ueber einem Prozess, der die echten Pfade
  // sieht (Seatbelt unter macOS).
  ISOLATION_LEVEL_POLICY = 1;
  // Eigene Namensraeume ueber dem geteilten Kern des Hosts (das Backend des
  // Systems unter Linux, Podman mit `crun`).
  ISOLATION_LEVEL_NAMESPACES = 2;
  // Ein eigener Gastkern in einer Micro-VM (das VM-Backend der Kernel-Stufe,
  // seit Minor 39; davor Podman mit einer zweiten Laufzeit, nie zugelassen).
  ISOLATION_LEVEL_KERNEL = 3;
}

// Die Anfrage von `SandboxBackends` (HUM-440). Ohne gesetztes Feld auf der
// Leitung dieselbe leere Nachricht wie `Empty` vor Minor 38.
message SandboxBackendsRequest {
  // Der Plan, an dessen Konfiguration die Liste gemessen wird, wie
  // `SandboxRequest.plan`: Projekt-Profil des Ordners (leeres `work_dir`
  // heisst der gespeicherte Ordner), Profil der Sitzung und `backend`
  // werden zusammengefuehrt wie bei einem Start mit diesem Plan. Ein
  // Ordner, der keiner sein darf, ist `SANDBOX_006` wie im Plan. Ohne Plan
  // gilt die Konfiguration ohne Wunsch, wie vor Minor 38.
  SandboxRequest.Plan plan = 1;
}

// Die Antwort von `SandboxBackends`.
message SandboxBackendList {
  // Die Backends, die es auf dieser Art System geben kann, in fester
  // Reihenfolge: unter Linux das Backend des Systems und `podman`, auf x86-64
  // seit Minor 39 dazu das VM-Backend der Kernel-Stufe, unter macOS nur das
  // Backend des Systems. Ein Client zeigt einen Namen, den er nicht kennt,
  // mit seiner Stufe und seinen Befunden, statt ihn zu verwerfen.
  repeated SandboxBackend backends = 1;
  // Die Untergrenze `sandbox.min_isolation`, der strengste Wert aller
  // Ebenen der Konfiguration, an der die Liste misst, samt dem
  // Projekt-Profil, das sie fuer seinen Ordner heben kann.
  IsolationLevel min_isolation = 2;
  // Der Name des Backends, das `auto` auf diesem System meint, einer der
  // Namen in `backends` (HUM-440). Ob ein Start mit `auto` ginge, sagt
  // dessen Eintrag. Leer bei einem Daemon vor Minor 38.
  string auto_backend = 3;
}

// Ein Sandbox-Backend und was ihm auf diesem System fehlt.
message SandboxBackend {
  // Der Name, wie ihn `sandbox.backend` schreibt, ohne `auto`.
  string name = 1;
  // Die Stufe, die das Backend bietet; unter Podman die der gewaehlten
  // Laufzeit (`sandbox.podman.runtime`).
  IsolationLevel isolation_level = 2;
  // Ob ein Start mit diesem Backend die Wahl bestuende, gemessen an der
  // Konfiguration der Anfrage (siehe `SandboxBackends`): Es ist zugelassen, auf dem System vorhanden, liegt nicht unter
  // `min_isolation`, und das Sandbox-Profil verlangt kein anderes. Sonst
  // steht der Grund in `diagnostics`. Falsch heisst nie, dass ein anderes
  // Backend einspringt.
  bool available = 3;
  // Ob `sandbox.backend` dieser Konfiguration dieses Backend waehlt, mit
  // Plan samt `Plan.backend`; `auto` ist `SandboxBackendList.auto_backend`.
  // Hoechstens eines.
  bool selected = 4;
  // Was einem Start im Weg steht, mit `why` und, wo es einen gibt, `fix`:
  // `SANDBOX_034` (nicht vorhanden), `SANDBOX_036` (das Sandbox-Profil
  // verlangt ein anderes), `SANDBOX_035` (unter der Untergrenze),
  // `SANDBOX_048` (noch nicht zugelassen) oder der Befund der Suche des
  // Backends (`SANDBOX_001` bis `SANDBOX_003`, beim VM-Backend `SANDBOX_045`
  // mit der ersten fehlenden Voraussetzung). Leer, wenn `available`.
  repeated Diagnostic diagnostics = 5;
  // Die Laufzeiten des Backends, wo es welche waehlt: unter Podman `crun`,
  // bis Minor 38 auch eine zweite der Kernel-Stufe, die nie zugelassen war.
  // Leer bei einem Backend ohne Laufzeit.
  repeated SandboxRuntime runtimes = 6;
}

// Eine Laufzeit eines Backends (`sandbox.podman.runtime`).
message SandboxRuntime {
  // `crun`.
  string name = 1;
  // Die Stufe mit dieser Laufzeit.
  IsolationLevel isolation_level = 2;
  // Wie `SandboxBackend.available`, fuer genau diese Laufzeit.
  bool available = 3;
  // Ob `sandbox.podman.runtime` diese Laufzeit waehlt.
  bool selected = 4;
  // Wie `SandboxBackend.diagnostics`, fuer genau diese Laufzeit.
  repeated Diagnostic diagnostics = 5;
}

// ---------- Zusammenfassung eines Sandbox-Laufs ----------

// Verweis auf die Zusammenfassung eines Sandbox-Laufs.
//
// Der Schluessel ist die Sandbox-Kennung allein: Sie ist eine UUIDv7 und damit
// fuer sich eindeutig, und sie ist der eine Wert, den `humanitl sessions
// summary <id>` zur Hand hat. Die Sitzung steht in der Antwort.
// Eine Aenderung der oberen Schicht einer Wegwerf-Sandbox (HUM-350).
//
// Wie in `FileChange` ist jeder Pfad Anzeige und nie wieder ein Pfad: Die
// Namen schreibt der Agent, der Daemon saeubert sie. Ausgewaehlt wird ueber
// `id`.
message DisposableChange {
  // Die ersten 16 Hex-Zeichen des SHA-256 ueber die rohen Bytes des Pfades;
  // die Kennung fuer `ApplyChanges.ids`.
  string id = 1;
  // Der Pfad relativ zum Projektverzeichnis, gesaeubert.
  string path = 2;
  // Ob die Anzeige den echten Namen veraendert hat.
  bool mangled = 3;
  FileChangeKind kind = 4;
  // Was der Eintrag danach ist, bei `REMOVED` was er vorher war: `file`,
  // `dir`, `symlink` oder `other`.
  string entry = 5;
  // Die Groesse danach, 0 fuer Geloeschtes.
  uint64 size = 6;
  // Die Rechte, mit denen geschrieben wuerde (nur `rwx`).
  uint32 mode = 7;
  // SHA-256 des neuen Inhalts einer Datei, hex; leer fuer alles andere.
  string sha256 = 8;
  // Das Ziel eines Symlinks, gesaeubert.
  string symlink_target = 9;
  // Der Unterschied im Format `diff -u`, Steuerzeichen maskiert, hoechstens
  // 64 KiB. Leer, wenn es keinen Text-Diff gibt (`binary`) oder es keine
  // Datei ist.
  string diff = 10;
  // Eine Datei ohne Text-Diff: Binaerinhalt, ueber 1 MiB oder zu viele
  // geaenderte Zeilen. Dann sagen `size` und `sha256`, was sich geaendert hat.
  bool binary = 11;
  // Warum der Mensch zuerst hinsehen sollte: Die Datei im Projekt hat sich
  // seit dem Start geaendert. Leer: unveraendert. Uebernommen wird sie nur mit
  // `ApplyChanges.overwrite`.
  string conflict = 12;
  // Warum diese Aenderung nie auf den Host geschrieben wird (ein Symlink aus
  // dem Projekt hinaus, ein Geraet, eine FIFO, ein Socket). Leer: sie darf.
  string refused = 13;
  // Die Bits, die nie geschrieben werden: setuid, setgid, sticky.
  uint32 stripped_bits = 14;
  // Ob die Datei in der oberen Schicht mehrere Namen hat; geschrieben wird
  // sie trotzdem je Name als eigene Datei.
  bool hardlinked = 15;
}

// Die wartenden Aenderungen einer Wegwerf-Sandbox (HUM-350).
message DisposableChanges {
  string sandbox_id = 1;
  // Das Projektverzeichnis auf dem Host.
  string work_dir = 2;
  // Sortiert nach Pfad.
  repeated DisposableChange changes = 3;
  // Ob die Liste abgeschnitten ist; dann wird „alle uebernehmen" abgelehnt.
  bool truncated = 4;
}

// Was mit den Aenderungen einer Wegwerf-Sandbox geschehen ist (HUM-350).
message DisposableOutcome {
  string sandbox_id = 1;
  // `applied`: die gewaehlten sind geschrieben, der Rest verworfen;
  // `discarded`: alle verworfen; `partial`: das Schreiben brach ab, die
  // geschriebenen stehen in `applied`, die Schicht wartet weiter.
  string outcome = 2;
  // Die geschriebenen Pfade, gesaeubert.
  repeated string applied = 3;
  // Die verworfenen Pfade, gesaeubert.
  repeated string discarded = 4;
}

message SessionSummaryRef {
  string sandbox_id = 1;
}

// Was mit einer Datei im Projekt geschehen ist.
enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_ADDED = 1;
  FILE_CHANGE_KIND_MODIFIED = 2;
  FILE_CHANGE_KIND_REMOVED = 3;
  FILE_CHANGE_KIND_SYMLINK_ADDED = 4;
  FILE_CHANGE_KIND_MODE_CHANGED = 5;
}

// Eine Zeile der Tabelle „Changed files".
//
// **Jeder Pfad in dieser Nachricht ist Anzeige und nie wieder ein Pfad.** Die
// Namen schreibt der Agent; der Daemon schickt sie durch
// `humanitl_core::block::sanitize_note`, bevor sie auf die Leitung gehen. Wer
// mit `path` eine Datei oeffnet, oeffnet eine andere oder keine: Zwei
// verschiedene Namen koennen dieselbe Anzeige ergeben.
message FileChange {
  // Der Pfad relativ zum Projektverzeichnis, gesaeubert.
  string path = 1;
  // Die ersten 16 Hex-Zeichen des SHA-256 ueber die rohen Bytes des Pfades.
  // Er macht zwei Zeilen unterscheidbar, deren Anzeige gleich aussieht.
  string path_hash = 2;
  // Ob die Anzeige den echten Namen veraendert hat.
  bool mangled = 3;
  FileChangeKind kind = 4;
  // Die Groesse nach der Aenderung, 0 fuer Geloeschtes.
  uint64 size = 5;
  // Ob der Pfad zu den Git-Metadaten gehoert (`.git/index` und die Refs, nicht
  // `.git/hooks`). Die Oberflaeche fasst sie zusammen.
  bool git_metadata = 6;
  // Der Eintrag aus `SessionSummary.unprotected`, unter dem diese Aenderung
  // liegt; leer, wenn eine Maske darueber lag oder keine vorgesehen war.
  string unprotected_by = 7;
  // Warum der Fundscan in diese Datei nicht gesehen hat.
  //
  // `SCAN_SKIP_UNSPECIFIED` heisst: gelesen, oder es gab nichts zu lesen (ein
  // Verzeichnis, ein Verweis, etwas Geloeschtes, eine Rechte-Aenderung). Jeder
  // andere Wert heisst: In dieser Datei wurde **nicht** gesucht. Ohne das Feld
  // saehe eine Zusammenfassung, in der eine 5-MiB-Datei uebersprungen wurde,
  // genauso aus wie eine, in der nichts gefunden wurde.
  ScanSkip unscanned = 8;
}

// Warum der Fundscan eine geaenderte Datei nicht gelesen hat.
enum ScanSkip {
  SCAN_SKIP_UNSPECIFIED = 0;
  // Groesser, als der Scan liest (4 MiB).
  SCAN_SKIP_TOO_LARGE = 1;
  // Nicht lesbar: Rechte, verschwunden, kein gewoehnlicher Inhalt mehr.
  SCAN_SKIP_UNREADABLE = 2;
  // Das Byte-Budget des Laufs reichte fuer sie nicht mehr.
  SCAN_SKIP_BUDGET = 3;
}

// Ein Symlink, den der Lauf angelegt hat.
message SymlinkEscape {
  // Der Verweis, relativ zum Projektverzeichnis, gesaeubert.
  string path = 1;
  string path_hash = 2;
  bool mangled = 3;
  // Das Ziel, woertlich wie es im Verweis steht, gesaeubert und nie aufgeloest.
  string target = 4;
  // Ob das Ziel aus dem Projektverzeichnis hinausfuehrt.
  bool escapes = 5;
  // Ein Befehl fuer die Zwischenablage, aus dem **rohen** Host-Pfad gebaut;
  // leer, wenn sich der Pfad nicht woertlich zitieren laesst. Er entsteht im
  // Daemon und nie aus `path`: Aus der Anzeige gebaut zeigte er auf eine
  // andere Datei.
  string fix_command = 6;
}

// Ein Fund in einer Datei, die dieser Lauf geaendert hat.
//
// Nicht `Finding`: Dort liegt ein Fund in einer Anfrage (`FindingLocation` mit
// Header, Query, Body), hier in einer Datei mit Pfad und Zeile. Der Wert
// bleibt in der Datei; hier steht nur, was `humanitl_core::Finding` hergibt.
message SummaryFinding {
  // Die Datei relativ zum Projektverzeichnis, gesaeubert.
  string path = 1;
  string path_hash = 2;
  bool mangled = 3;
  // Die Zeile, 1-basiert. Der Daemon rechnet sie; die Oberflaeche hat die
  // Datei nicht.
  uint32 line = 4;
  // Die Art, zum Beispiel `api_key:aws` oder `custom:executable-on-host`.
  //
  // Die Schreibweise ist die Anzeige von `humanitl_core::FindingKind` mit
  // Doppelpunkt, nicht die Punktform von `Finding.kind`: Diese Zeichenkette
  // wird als Teil der Zusammenfassung in der Aufzeichnung abgelegt, und der
  // gespeicherte Text ist derselbe, den die RPC ausgibt.
  string kind = 5;
  FindingTier tier = 6;
  // Hoechstens acht Zeichen des Originals, danach `…`. Leer, wo es keinen
  // gefundenen Wert gibt.
  string display_prefix = 7;
  // SHA-256 des gefundenen Werts als Hex. Leer, wo es keinen gibt.
  string value_hash = 8;
}

// Was ein Sandbox-Lauf im Projektverzeichnis hinterlassen hat (HUM-043).
//
// `/work` mit Schreibrecht ist der erste der beiden offenen Kanaele
// (BACKLOG.md 4.2). Er wird nicht geschlossen, sondern beobachtet: ein
// Schnappschuss vor dem Start, einer nach dem Ende, und diese Nachricht ist
// ihr Unterschied.
message SessionSummary {
  string session_id = 1;
  string sandbox_id = 2;
  // Wann die Zusammenfassung entstand.
  google.protobuf.Timestamp created = 3;
  // Das Projektverzeichnis auf dem Host, aus der Konfiguration und nie aus dem
  // Baum. „Open folder" nimmt diesen Pfad.
  string work_dir = 4;
  // Die Aenderungen, sortiert nach Pfad.
  repeated FileChange changes = 5;
  // Die Funde in geaenderten Dateien.
  repeated SummaryFinding findings = 6;
  // Die Symlinks, die dieser Lauf angelegt hat.
  repeated SymlinkEscape symlinks = 7;
  // Die Pfade, ueber denen in diesem Lauf keine Maske und kein `tmpfs` lag,
  // weil es sie im Projekt nicht gab. Sie kommen aus dem Profil, nicht vom
  // Agenten.
  repeated string unprotected = 8;
  // So viele Bytes hat der Fundscan gelesen.
  uint64 scanned_bytes = 9;
  // Ob ein Budget gegriffen hat: im Schnappschuss, in einer der Listen oder im
  // Scan. Eine abgeschnittene Zusammenfassung darf nie aussehen wie eine
  // vollstaendige.
  bool truncated = 10;
  // Die Befunde zu dieser Zusammenfassung (`SANDBOX_022` bis `SANDBOX_026`).
  // Sie stehen mit in der Nachricht, damit `GetSessionSummary` dieselbe
  // Auskunft gibt wie das Ereignis am Ende des Laufs.
  repeated Diagnostic diagnostics = 11;
}

// ---------- Terminal ----------

// Eingabe an das Terminal der Sandbox. Genau ein Client darf schreiben.
message TerminalInput {
  oneof input {
    Open open = 1;
    bytes data = 2;
    Resize resize = 3;
    google.protobuf.Empty close = 4;
  }

  // Verbindungsaufbau.
  message Open {
    string sandbox_id = 1;
    uint32 cols = 2;
    uint32 rows = 3;
    // Nur lesen. Mehrere Leser sind erlaubt, ein zweiter Schreiber nicht
    // (Diagnostic `TERM_001`).
    bool read_only = 4;
    // Das Terminal einer weiteren Shell aus `Exec` (HUM-299); leer ist das
    // Terminal des Agenten. Eine Kennung, die es nicht (mehr) gibt, beantwortet
    // der Strom mit `IPC_006`.
    string shell_id = 5;
  }

  // Neue Geometrie des Schreibers.
  message Resize {
    uint32 cols = 1;
    uint32 rows = 2;
  }
}

// Ausgabe des Terminals.
message TerminalOutput {
  oneof output {
    bytes data = 1;
    Exit exit = 2;
    Diagnostic diagnostic = 3;
    // Geometrie des Schreibers; Leser rendern letterboxed.
    Resize resize = 4;
    // Eine Zeile des Daemons zu einem gehaltenen oder entschiedenen Fluss,
    // schon gesaeubert und ohne Steuerzeichen. Sie steht neben den Bytes und
    // nicht darin: Wer eine eigene Anzeige dafuer hat (die Oberflaeche zeigt
    // einen Streifen ueber dem Terminal), zeichnet sie dort, und wer am
    // Terminal sitzt, schreibt sie zwischen die Bytes des Agenten. Sie kommt
    // an einer Grenze zwischen zwei Folgen, nie mitten in einer.
    string notice = 5;
  }

  // Der Prozess ist beendet.
  message Exit {
    int32 code = 1;
  }

  // Neue Geometrie.
  message Resize {
    uint32 cols = 1;
    uint32 rows = 2;
  }
}

// Eine weitere Shell in der laufenden Sandbox (HUM-299).
message ExecRequest {
  // Leer heisst die Sitzung, die laeuft; sonst genau ihre Kennung.
  string sandbox_id = 1;
  // Das Kommando in der Sandbox. Leer: eine interaktive Shell, `bash`, wenn
  // die Sandbox eines findet, sonst `sh`.
  repeated string command = 2;
  // Die Groesse des Terminals; 0 nimmt die Vorgabe.
  uint32 cols = 3;
  uint32 rows = 4;
}

// Die gestartete Shell.
message ExecResponse {
  // Die Kennung der Shell in ihrer Sandbox, fuer `TerminalInput.Open.shell_id`.
  string shell_id = 1;
  // Das Kommando, das wirklich gestartet wurde.
  repeated string command = 2;
  // Die Sandbox, in der sie laeuft.
  string sandbox_id = 3;
}

// ---------- Audit ----------

// Eine Operation auf dem Audit-Log.
message AuditRequest {
  oneof op {
    google.protobuf.Empty verify = 1;
    Export export = 2;
    google.protobuf.Empty head = 3;
    Query query = 4;
  }

  // Export des Logs.
  message Export {
    // `jsonl` oder `csv`.
    string format = 1;
    string out_path = 2;
    bool redact_hosts = 3;
    // Zeitraum, beide Grenzen einschliesslich; ungesetzt heisst ohne Grenze
    // (HUM-051). Der Zeitraum ist derselbe, den die Tabelle gerade zeigt.
    google.protobuf.Timestamp from = 4;
    google.protobuf.Timestamp to = 5;
  }

  // Eine Seite der Records, aelteste Nummer zuletzt (HUM-051).
  //
  // Die Tabelle laedt nie die ganze Kette: Sie fragt Seite um Seite ueber
  // `cursor`, und der Cursor gehoert dem untersten Record der letzten Seite.
  message Query {
    // Praefix der Art, zum Beispiel `flow.` oder `flow.decided`; leer heisst
    // jede Art.
    string kind_prefix = 1;
    // Sitzung als UUID-Text; leer heisst jede Sitzung.
    string session = 2;
    // Zeitraum, beide Grenzen einschliesslich; ungesetzt heisst ohne Grenze.
    google.protobuf.Timestamp from = 3;
    google.protobuf.Timestamp to = 4;
    // Groesse der Seite; 0 heisst die Vorgabe des Daemons.
    uint32 limit = 5;
    // Der Cursor aus `AuditResponse.next_cursor`; leer heisst von vorn.
    string cursor = 6;
  }
}

// Warum die Pruefung etwas nicht beweisen konnte, obwohl die Kette haelt
// (HUM-050 `VerifyWarning`, HUM-051).
message AuditWarning {
  // `no_hmac_key` oder `unanchored_tail`.
  string kind = 1;
  // Wie viele Records hinter dem letzten Anker stehen; nur bei
  // `unanchored_tail`.
  uint64 records = 2;
}

// Ein Record der Kette, so wie er in `audit.jsonl` steht (HUM-051).
message AuditEntry {
  uint64 seq = 1;
  // Der Zeitstempel im Format des Logs: UTC, Mikrosekunden, immer `Z`. Als
  // Text und nicht als `Timestamp`, weil genau diese Zeichen im Hash stehen.
  string ts = 2;
  // Die Art, zum Beispiel `flow.decided`.
  string kind = 3;
  // Die Sitzung als UUID-Text oder `-`.
  string session = 4;
  // `data` des Records als JSON-Objekt.
  string data_json = 5;
  // Die vollstaendige kanonische Zeile, Byte fuer Byte wie in der Datei.
  string line = 6;
}

// Antwort auf eine Audit-Operation.
message AuditResponse {
  bool ok = 1;
  // Bei `verify` und `head`: wie viele Records die Kette haelt. Bei `query`:
  // wie viele Records der Filter trifft, ueber alle Seiten, nicht nur die
  // gelieferte (HUM-051). Bei `export`: wie viele Records in die Datei gingen.
  uint64 entries = 2;
  bytes head_hash = 3;
  // Erster Eintrag, dessen Hash nicht passt. Nur wenn `ok` falsch ist.
  uint64 first_bad_seq = 4;
  string out_path = 5;
  Diagnostic diagnostic = 6;
  // Die Nummer des letzten Records (HUM-051).
  uint64 head_seq = 7;
  // Wie viele Anker es gibt.
  uint64 anchors = 8;
  // Wann der letzte Anker entstand; ungesetzt, wenn es keinen gibt.
  google.protobuf.Timestamp last_anchor_at = 9;
  // Warum die Kette bricht, in `snake_case` (`hash_mismatch`, `seq_gap`,
  // `prev_mismatch`, `mac_mismatch`, `non_canonical_line`, `anchor_mismatch`,
  // `truncated_below_anchor`). Leer, wenn sie haelt.
  string break_reason = 10;
  repeated AuditWarning warnings = 11;
  // Die Records einer `Query`, sonst leer.
  repeated AuditEntry records = 12;
  // Wo die naechste Seite beginnt; leer, wenn es keine gibt.
  string next_cursor = 13;
  // Wahr, wenn `anchors` und `last_anchor_at` gesetzt sind. Ein Daemon, der
  // die Felder 7 bis 13 nicht kennt, laesst es falsch; der Client liest dann
  // „nicht gemeldet" statt „null Anker" (HUM-051). Ein eigenes Feld und kein
  // `optional`, weil die Anwesenheit an beiden Feldern zugleich haengt.
  bool anchors_reported = 14;
  // Bei `verify` und `head`: der Zeitstempel des Records in `head_seq`, mit
  // genau den Zeichen, die in seiner Zeile stehen (HUM-162). Als Text und
  // nicht als `Timestamp`, aus demselben Grund wie `AuditEntry.ts`: diese
  // Zeichen stehen im Hash. Leer, wenn es keinen Kopf gibt, und bei einem
  // Daemon, der das Feld nicht kennt.
  string head_ts = 15;
}

// ---------- Config ----------

// Abfrage der effektiven Konfiguration.
message GetConfigRequest {
  bool include_schema = 1;
  // Die Konfiguration eines Projekts aus dem Register (HUM-532): sein Ordner
  // waehlt das Projekt-Profil, und seine Projektwahl ist die Ebene mit der
  // Herkunft `project-choice`. Leer heisst: ohne Projekt, wie bisher.
  // Seit 1.47 auch ein absoluter Ordner (HUM-534): Er wird kanonisiert und im
  // Register gesucht; ein Ordner, den das Register nicht kennt, wird ohne
  // Projektwahl aufgeloest, mit seinem Projekt-Profil, wie ein Start dort.
  // Eine unbekannte Kennung gibt die globale Aufloesung, ohne Fehler.
  string project_id = 2;
  // Der Einstellungskatalog in `ConfigSnapshot.catalog` (HUM-534):
  // Kategorien, Texte, Bedienart, Herkunft und Sperre je Eintrag.
  bool include_catalog = 3;
  // Die Sprache der Texte des Katalogs, `en` oder `de`; leer heisst
  // `ui.language` der Aufloesung.
  string language = 4;
}

// Die effektive Konfiguration samt Herkunft je Feld.
message ConfigSnapshot {
  // Effektive Config als TOML.
  string toml = 1;
  // JSON-Schema, nur wenn `include_schema` gesetzt war.
  string json_schema = 2;
  repeated FieldOrigin origins = 3;
  repeated Diagnostic diagnostics = 4;
  // Dieselbe effektive Config als JSON-Objekt, fuer Clients ohne TOML-Leser
  // (HUM-069). Leer, wenn die Aufloesung scheiterte; der Grund steht dann in
  // `diagnostics`.
  string values_json = 5;
  // Die globale `config.toml`, in die `SetConfig` schreibt, als absoluter
  // Pfad. Die Oberflaeche bietet sie zum Oeffnen an.
  string config_path = 6;
  // Nur mit `GetConfigRequest.include_catalog` (HUM-534).
  SettingsCatalog catalog = 7;
}

// Der Einstellungskatalog (HUM-534, ADR-0024 Punkt 3): die eine Quelle, aus
// der App und TUI ihre Einstellungen zeichnen. Kein Client haelt eine eigene
// Liste.
message SettingsCatalog {
  // Die Sprache der Texte: `en` oder `de`.
  string language = 1;
  // In der Reihenfolge der linken Spalte.
  repeated SettingsCategory categories = 2;
  // Je Kategorie in der Reihenfolge ihrer Seite.
  repeated SettingsEntry entries = 3;
}

// Eine Kategorie der Einstellungen.
message SettingsCategory {
  string id = 1;
  // Die Stelle in der linken Spalte, ab 0.
  uint32 order = 2;
  string title = 3;
}

// Ein Wert einer Auswahl mit seinem Namen.
message SettingsChoice {
  // Der Wert, wie `SetConfig` ihn nimmt.
  string value = 1;
  string title = 2;
}

// Die Sperre eines Eintrags durch eine Firmenvorgabe. Fehlt sie, ist der
// Eintrag nicht gesperrt.
message SettingLock {
  // Die Vorgabe, die sperrt, etwa der Pfad der Vorgabedatei.
  string locked_by = 1;
  // Immer gesetzt: ein gesperrter Wert ist in jedem Client nur lesbar.
  bool read_only = 2;
  // Ein Satz, warum, fuer die Anzeige an der Zeile.
  string reason = 3;
}

// Ein Eintrag des Katalogs.
message SettingsEntry {
  // Der Schluessel der Konfiguration oder die Kennung einer besonderen Zeile
  // ohne eigenen Schluessel, etwa `daemon.restart`.
  string id = 1;
  // Die Kennung der Kategorie.
  string category = 2;
  // Die Stelle in der Kategorie, ab 0.
  uint32 order = 3;
  string title = 4;
  // Ein kurzer Satz unter dem Namen; leer, wenn es keinen gibt.
  string help = 5;
  // Die laengere Erklaerung hinter dem Info-Knopf; leer, wenn es keine gibt.
  string details = 6;
  // Woerter, die den Eintrag in der Suche auch finden; nie gezeigt.
  repeated string keywords = 7;
  // `switch`, `choice`, `text`, `number`, `secret_ref`, `path` oder
  // `special`. Eine Zeile `special` zeichnet der Client mit dem Bedienelement,
  // das er dieser `id` zuordnet; ein `secret_ref` wird nie aufgeloest
  // gezeigt und nie ueber `SetConfig` geschrieben.
  string control = 8;
  // Bei `choice` die Werte mit ihren Namen.
  repeated SettingsChoice choices = 9;
  // Ob eine laufende Sitzung den alten Wert behaelt.
  bool next_session = 10;
  // `basic`, `advanced` oder `expert`.
  string tier = 11;
  // Leer fuer jeden Client, `app` fuer eine Einstellung des App-Fensters
  // selbst, die die TUI nicht zeigt.
  string client = 12;
  // Die Herkunft des wirksamen Werts wie in `FieldOrigin.origin`, dazu
  // `policy` fuer eine Sperre; leer fuer eine Zeile ohne Schluessel.
  string origin = 13;
  // Gesetzt, wenn eine Firmenvorgabe den Schluessel sperrt.
  SettingLock lock = 14;
  // Ob der Schluessel auf der Erlaubnisliste der Projektwahl steht (HUM-532).
  // Nur dann schreibt ein Client ihn fuer ein Projekt, und zwar ueber
  // `Projects.save_choice`, nie ueber `SetConfig`.
  bool in_project_choice = 15;
}

// Woher der Wert eines Feldes stammt.
message FieldOrigin {
  string key = 1;
  // `default`, `global`, `profile_builtin`, `profile_global`,
  // `profile_project`, `project-choice` (HUM-532), `env`, `cli` oder
  // `policy` (eine Sperre der Firmenvorgabe, HUM-534).
  string origin = 2;
}

// Setzt genau einen Konfigurationsschluessel.
message SetConfigRequest {
  string key = 1;
  string value = 2;
  // Fuer `llm.endpoint` und `llm.models`: der gespeicherte Server, dessen
  // Ansicht der Client bearbeitet hat (HUM-289). Ist inzwischen ein anderer
  // aktiv, schreibt der Daemon nichts und antwortet `CONFIG_021`; so landet
  // ein Wert, der fuer den einen Server getippt wurde, nie im anderen. Leer
  // heisst: ohne diese Pruefung.
  string expected_server = 3;
}

// ---------- Doctor ----------

// Ergebnis einer einzelnen Maschinenpruefung.
enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_OK = 1;
  CHECK_STATUS_WARN = 2;
  CHECK_STATUS_FAIL = 3;
}

// Eine Zeile der Doctor-Ausgabe.
message DoctorCheck {
  // Stabiler Bezeichner, zum Beispiel `bwrap` oder `userns`.
  string id = 1;
  CheckStatus status = 2;
  // Was gemessen wurde, zum Beispiel `bubblewrap 0.11.0`.
  string evidence = 3;
  // Gesetzt, sobald der Status nicht CHECK_STATUS_OK ist.
  Diagnostic diagnostic = 4;
}

// Die vollstaendige Doctor-Ausgabe, in Anzeigereihenfolge.
message DoctorReport {
  repeated DoctorCheck checks = 1;
  // Je Sandbox-Backend dieser Art System eine Gruppe (HUM-436), in fester
  // Reihenfolge wie in `SandboxBackendList.backends`. Leer bei einem Daemon
  // vor Minor 35.
  repeated DoctorBackend backends = 2;
}

// Der Auftrag an `Doctor` (HUM-436).
message DoctorRequest {
  // Je zugelassenem, verfuegbarem Backend einen Probestart: eine leere
  // Sandbox mit dem Shim und `true`, deren fuenf `CHECK`-Zeilen gelesen
  // werden. Das Ergebnis haelt der Daemon fest, bis sich die Fassung des
  // Programms oder von Humanitl aendert. Ohne das Feld startet `Doctor`
  // nichts und zeigt nur einen gespeicherten Probestart. Eine Stufe, die
  // noch nicht zugelassen ist, startet nie; ihre Zeile `probe` traegt
  // `SANDBOX_048`.
  bool probe = 1;
}

// Die Zeilen des Doctors zu einem Sandbox-Backend (HUM-436).
message DoctorBackend {
  // Der Name, wie ihn `sandbox.backend` schreibt, ohne `auto`.
  string name = 1;
  // Die Stufe: der Name, mit der Laufzeit des Backends, falls es eine hat
  // (`<name>/<laufzeit>`).
  string stage = 2;
  // Ob `sandbox.backend` dieses Backend waehlt; `auto` ist das Backend des
  // Systems. Nur die Zeilen des gewaehlten Backends koennen `FAIL` sein; die
  // eines anderen sind hoechstens `WARN`, weil sie keinen Start aufhalten.
  bool selected = 3;
  // Die Zeilen in Anzeigereihenfolge. `id` ist `admitted` (`SANDBOX_048`,
  // solange die Stufe nicht zugelassen ist), `available` (die Suche vor jedem
  // Start), fuer eine nicht zugelassene Stufe ihre Voraussetzungen ohne
  // Start des Programms (`program`, `subordinate_ids`, `selinux`), und
  // `probe` nach einem Probestart (`DOCTOR_014`, wenn er scheiterte).
  repeated DoctorCheck checks = 4;
}

// ---------- LLM-Suche ----------

// Erkanntes Produkt hinter einem offenen Port.
enum LlmProduct {
  LLM_PRODUCT_UNSPECIFIED = 0;
  LLM_PRODUCT_OLLAMA = 1;
  LLM_PRODUCT_OPENAI_COMPATIBLE = 2;
  LLM_PRODUCT_UNKNOWN = 3;
}

// Auftrag fuer die LAN-Suche. Laeuft nur auf ausdruecklichen Wunsch.
message DiscoverRequest {
  // Zu durchsuchendes Netz in CIDR-Notation. Leer bedeutet: aus der
  // Default-Route ableiten.
  string subnet = 1;
  // Zu pruefende Ports. Leer bedeutet die Voreinstellung
  // 11434, 1234, 8000, 8080.
  repeated uint32 ports = 2;
}

// Ein gefundener Server. Wird gestreamt, sobald er antwortet.
message DiscoverResult {
  string host = 1;
  uint32 port = 2;
  LlmProduct product = 3;
  repeated string models = 4;
  uint32 latency_ms = 5;
  // Der Endpunkt antwortete mit 401. Modelle bleiben dann leer.
  bool auth_required = 6;
}

// ---------- Endpunkt-Probe ----------

// Auftrag fuer die Probe eines einzelnen Endpunkts. Der Daemon fragt ihn
// host-seitig mit zwei GET (`/api/tags`, dann `/v1/models`) und folgt keiner
// Weiterleitung. Zugangsdaten schickt sie nur, wenn der Auftrag es verlangt
// (`api_key`, `use_stored_key`, HUM-140), und dann nur als `Authorization`
// an diesen Endpunkt. Nichts davon geht durch die Sandbox, und nichts davon
// aendert etwas am Server.
message ProbeLlmRequest {
  // Die Adresse, wie sie in `llm.endpoint` stehen wuerde. Nur http und https.
  string endpoint = 1;
  // Frist fuer die ganze Probe. 0 bedeutet die Voreinstellung 3000 ms.
  uint32 timeout_ms = 2;
  // Ein Zugangsschluessel nur fuer diese Probe, wie ihn der Mensch gerade
  // eingetippt hat (HUM-140). Der Daemon schickt ihn als
  // `Authorization: Bearer` an genau diesen Endpunkt und vergisst ihn danach;
  // gespeichert wird er nur ueber `LlmKey`. Leer heisst: kein solcher.
  string api_key = 3;
  // Den hinterlegten Schluessel mitschicken, wenn `api_key` leer ist. Der
  // Daemon tut das nur, wenn `endpoint` dieselbe Herkunft (Schema, Host,
  // Port) hat wie `llm.endpoint`; einem anderen Ziel gibt er ihn nie.
  bool use_stored_key = 4;
  // Mit `use_stored_key`: der Schluessel dieses gespeicherten Servers statt
  // des aktiven (HUM-289). Der Daemon schickt ihn nur, wenn `endpoint`
  // dieselbe Herkunft hat wie der Endpunkt dieses Eintrags. Leer heisst: der
  // aktive Server.
  string server = 5;
}

// Was die Probe gemessen hat. Ein leeres `models` bei `flavor = UNKNOWN` ist
// eine Aussage und keine Luecke: Es hat sich nichts gemeldet, was Humanitl
// kennt.
message ProbeLlmResponse {
  // Die Modelle in der Reihenfolge, in der der Server sie nennt.
  repeated string models = 1;
  // Welche API geantwortet hat.
  LlmProduct flavor = 2;
  // Der erste Befund, falls es einen gibt; fuer Clients, die nur einen zeigen.
  Diagnostic diagnostic = 3;
  // Wie lange die Probe gebraucht hat.
  uint32 latency_ms = 4;
  // Alle Befunde: LLM_003, wenn keine bekannte API antwortete, LLM_006, wenn
  // der Endpunkt nicht in einem privaten Netz liegt.
  repeated Diagnostic diagnostics = 5;
  // Wahr, wenn der Endpunkt im eigenen Netz liegt (RFC 1918, Loopback,
  // Link-Local, CGNAT, oder ein Name unter .local/.lan/.home.arpa/.internal).
  bool endpoint_is_private = 6;
  // Wahr, wenn die Probe einen Zugangsschluessel mitgeschickt hat (HUM-140).
  bool key_sent = 7;
  // Was zurueckkam, wenn keine Modellliste kam: Status und Inhaltstyp der
  // letzten Antwort, etwa `HTTP 200, text/html` (HUM-283). Leer, wenn eine
  // Modellliste kam. Eine Oberflaeche zeigt diesen Text statt "0 Modelle".
  string answer = 8;
}

// ---------- Zugangsschluessel ----------

// Wo ein Zugangsschluessel liegt (HUM-140).
enum LlmKeyStore {
  LLM_KEY_STORE_UNSPECIFIED = 0;
  // Im Schluesselbund des Systems: ueber den Secret Service (`libsecret`),
  // unter macOS im Keychain. Welcher, sagt `key_ref` (HUM-349).
  LLM_KEY_STORE_SECRET_SERVICE = 1;
  // In einer Datei mit `0600` unter `$XDG_DATA_HOME/humanitl/keys`, wenn der
  // Schluesselbund auf dieser Maschine nicht antwortet.
  LLM_KEY_STORE_FILE = 2;
}

// Auftrag an `LlmKey`. Genau eine Operation.
message LlmKeyRequest {
  // Nur den Stand abfragen.
  message Status {}
  // Den Schluessel hinterlegen und `llm.api_key_ref` darauf richten.
  message Set {
    // Der Schluessel. Er steht danach nie in `config.toml`, in keiner
    // Antwort, in keinem Log und in keiner Aufzeichnung.
    string key = 1;
  }
  // Den Schluessel entfernen und `llm.api_key_ref` aus `config.toml` nehmen.
  // `Remove` und nicht `Clear`: Der Dart-Generator benennt ein Feld `clear`
  // um, weil jede Nachricht schon eine Methode `clear()` hat.
  message Remove {}
  oneof op {
    Status status = 1;
    Set set = 2;
    Remove remove = 3;
  }
  // Der gespeicherte Server, dessen Schluessel gemeint ist (HUM-289). Leer
  // heisst: der aktive, oder ohne Eintraege `llm.api_key_ref`. Ein Server
  // ohne eigenen Verweis bekommt beim Setzen den Eintrag
  // `secret-service:humanitl/<name>`.
  string server = 4;
}

// Der Stand des Zugangsschluessels, ohne den Schluessel selbst.
message LlmKeyStatus {
  // Wahr, wenn `llm.api_key_ref` gesetzt ist und der Speicher einen
  // Schluessel dazu haelt.
  bool set = 1;
  // Wo er liegt; UNSPECIFIED, wenn keiner hinterlegt ist.
  LlmKeyStore store = 2;
  // `llm.api_key_ref`, wie er in der Konfiguration steht, zum Beispiel
  // `secret-service:humanitl/llm`. Leer, wenn keiner gesetzt ist.
  string key_ref = 3;
  // Was dazu zu sagen ist: der Grund fuer den Rueckfall auf die Datei, oder
  // `LLM_009`, wenn die Konfiguration einen Schluessel nennt, den der
  // Speicher nicht haelt.
  repeated Diagnostic diagnostics = 4;
}

// ---------- Modellserver ----------

// Ein gespeicherter Modellserver unter `llm.servers.<name>` (HUM-289).
message LlmServer {
  // Der Name, 1 bis 32 Zeichen a-z, 0-9, - und _.
  string name = 1;
  // Der Endpunkt, wie er in der Datei steht.
  string endpoint = 2;
  // Die Modelle, das voreingestellte zuerst.
  repeated string models = 3;
  // Der Verweis auf den Zugangsschluessel, etwa
  // `secret-service:humanitl/cloud`; leer ohne Schluessel. Ob der Speicher
  // ihn haelt, sagt `LlmKey(Status)` mit diesem Namen.
  string key_ref = 4;
  // Wahr fuer den Eintrag, den `llm.active` nennt.
  bool active = 5;
  // Die Profile der Sitzung (`profiles/*.toml`, eigene und mitgelieferte),
  // deren `llm.server` diesen Server nennt, nach Namen sortiert (HUM-400).
  // Projekte stehen hier nicht: Der Daemon kennt nur das Projekt, das er
  // gerade startet.
  repeated string profiles = 6;
}

// Auftrag an `LlmServers`. Genau eine Operation.
message LlmServersRequest {
  // Nur auflisten.
  message List {}
  // Einen Server anlegen. Der Endpunkt wird geprueft wie `llm.endpoint`.
  // Der Schluessel kommt danach ueber `LlmKey` mit `server = name`.
  message Add {
    string name = 1;
    string endpoint = 2;
    repeated string models = 3;
    // Danach aktiv. Der erste Server wird es immer.
    bool activate = 4;
  }
  // Einen Server umbenennen. Der Verweis auf den Schluessel bleibt.
  message Rename {
    string name = 1;
    string new_name = 2;
  }
  // Einen Server entfernen.
  message Remove {
    string name = 1;
    // Auch seinen Eintrag im Schluesselbund (oder die Datei) loeschen, wenn
    // kein anderer Server denselben Verweis traegt.
    bool delete_key = 2;
    // Der Server, der danach aktiv ist. Pflicht fuer den aktiven Server,
    // solange es andere gibt.
    string replacement = 3;
  }
  // Einen Server zum aktiven machen, ab der naechsten Sitzung.
  message Activate {
    string name = 1;
  }
  // Endpunkt und Modelle eines gespeicherten Servers aendern, ohne ihn zum
  // Standard zu machen (HUM-405). Beim aktiven Server aendert sich seine
  // Ansicht `llm.endpoint` und `llm.models` mit. Bei derselben Herkunft
  // bleibt der Verweis auf den Schluessel; bei einer anderen (Schema, Host,
  // Port) faellt er weg, und der Schluessel wird geloescht, wenn kein
  // anderer Server ihn traegt. Er geht nie ungefragt an eine neue Herkunft.
  message Edit {
    // Die Modelle, das voreingestellte zuerst.
    message Models {
      repeated string names = 1;
    }
    string name = 1;
    // Fehlt: der Endpunkt bleibt. Geprueft wie bei `Add`.
    optional string endpoint = 2;
    // Fehlt: die Modelle bleiben. Leer: keine Modelle mehr.
    Models models = 3;
  }
  // Einem Profil der Sitzung oder einem Projekt einen gespeicherten Server
  // zuordnen, oder die Zuordnung entfernen (HUM-405). Geschrieben wird
  // `llm.server` unter `[config.llm]` der Profildatei; ein mitgeliefertes
  // Profil bekommt dafuer eine eigene Kopie. Das Profil `default` gilt fuer
  // jede Sitzung und wird nicht zugeordnet; dafuer ist `Activate` da.
  message Assign {
    // Der gespeicherte Server; leer entfernt die Zuordnung.
    string server = 1;
    oneof target {
      // Ein Profil der Sitzung (`profiles/<name>.toml`).
      string profile = 2;
      // Ein Projektordner, absolut; geschrieben wird
      // `<ordner>/.humanitl/profile.toml`. Eine Zuordnung, die der Daemon
      // so bekommt, gilt fuer diesen Ordner zugleich als bestaetigt.
      string project_dir = 3;
    }
  }
  // Den Server bestaetigen, den ein Projekt waehlt, fuer genau diesen
  // Projektordner (HUM-405). Gemerkt wird das Paar aus Ordner und Name im
  // Datenverzeichnis des Daemons, nie im Projekt.
  message ConfirmProject {
    // Der Projektordner, absolut.
    string project_dir = 1;
    // Der gespeicherte Server, den das Projekt waehlt.
    string server = 2;
  }
  oneof op {
    List list = 1;
    Add add = 2;
    Rename rename = 3;
    Remove remove = 4;
    Activate activate = 5;
    Edit edit = 6;
    Assign assign = 7;
    ConfirmProject confirm_project = 8;
  }
}

// Ein Profil der Sitzung und der Server, den es waehlt (HUM-405).
message LlmProfileUse {
  // Der Name des Profils.
  string name = 1;
  // `llm.server` des Profils; leer, wenn es keinen waehlt.
  string server = 2;
  // Wahr fuer ein mitgeliefertes Profil ohne eigene Datei.
  bool builtin = 3;
  // Ein Satz darueber, wofuer es da ist; leer ohne.
  string description = 4;
}

// Die gespeicherten Server nach einem Auftrag.
message LlmServerList {
  // Nach Namen sortiert.
  repeated LlmServer servers = 1;
  // Der Name des aktiven Servers; leer, wenn keiner aktiv ist.
  string active = 2;
  // Wahr, solange `config.toml` nur flache Werte traegt und die Liste den
  // Server `default` daraus ableitet; der erste schreibende Auftrag legt ihn
  // an.
  bool implicit = 3;
  // Was dazu zu sagen ist, etwa dass der Schluessel eines entfernten
  // Servers nicht geloescht werden konnte.
  repeated Diagnostic diagnostics = 4;
  // Jedes Profil der Sitzung ausser `default`, nach Namen sortiert, mit dem
  // Server, den es waehlt (HUM-405). Ein Profil, das sich nicht lesen
  // laesst, fehlt.
  repeated LlmProfileUse profiles = 5;
  // Der Projektordner aus `sandbox.work_dir` und der Server, den sein
  // Projekt-Profil waehlt (HUM-405); fehlt ohne Projektordner.
  LlmProjectUse project = 6;
}

// Der Projektordner und der Server, den er waehlt (HUM-405).
message LlmProjectUse {
  // Der Projektordner, wie die Konfiguration ihn nennt.
  string dir = 1;
  // `llm.server`, wie es in `<dir>/.humanitl/profile.toml` selbst steht;
  // leer ohne. Diese Zeile schreibt und entfernt `Assign`.
  string server = 2;
  // Wahr, wenn `effective_server` fuer diesen Ordner bestaetigt ist oder der
  // Standard ist, ein Start also ohne Rueckfrage geht; falsch ohne Wahl.
  bool confirmed = 3;
  // Der Server, den das Projekt fuer den naechsten Start wirklich waehlt:
  // seine eigene Zeile, oder die des mitgelieferten Profils, das es mit
  // `name` nennt; leer, wenn es keinen waehlt (HUM-405).
  string effective_server = 4;
  // Das Profil, ueber das `effective_server` kommt, wenn das Projekt-Profil
  // selbst keine Zeile traegt; sonst leer.
  string via_profile = 5;
}

// ---------- Update (HUM-382) ----------

// Ein Auftrag an den Updater des Daemons.
message UpdateRequest {
  // Nach einem neueren Release fragen.
  message Check {
    // Wahr: jetzt bei GitHub fragen, auch wenn `update.check` aus ist oder die
    // letzte Frage keinen Tag alt ist. Falsch: die gemerkte Antwort, und nur
    // wenn `update.check` an ist und die letzte Frage mindestens einen Tag
    // zurueckliegt, vorher eine neue.
    bool force = 1;
    // Der Pfad des AppImages, aus dem die fragende App laeuft (`$APPIMAGE`);
    // leer sonst. Nur damit kennt der Daemon die Datei, die ein Update
    // ersetzt; er prueft sie selbst.
    string appimage = 2;
  }
  // Das Release installieren, das `Check` angeboten hat.
  message Apply {
    // Die Version, die der Client angeboten hat, zum Beispiel `0.0.42`. Der
    // Daemon prueft das Manifest neu; nennt es eine andere Version, bricht er
    // ab, statt etwas anderes zu installieren als gezeigt.
    string version = 1;
    // Wie `Check.appimage`.
    string appimage = 2;
  }
  oneof op {
    Check check = 1;
    Apply apply = 2;
  }
}

// Was der Daemon ueber Updates weiss.
message UpdateStatus {
  // Die Version dieses Daemons.
  string current_version = 1;
  // Die Version des letzten Releases laut signiertem Manifest; leer, solange
  // niemand gefragt hat.
  string latest_version = 2;
  // Wahr, wenn `latest_version` neuer ist als `current_version`.
  bool available = 3;
  // Wahr, wenn ein Klick hier installieren kann: `Apply` bei
  // `APP_BUNDLE`, `ARCHIVE` und `APPIMAGE`, `upgrade_command` bei `APT` und
  // `DNF`.
  bool can_apply = 4;
  // Wann zuletzt erfolgreich gefragt wurde; fehlt, wenn noch nie.
  google.protobuf.Timestamp checked_at = 5;
  // Groesse des Zips in Bytes; 0, wenn keins angeboten wird.
  uint64 size = 6;
  // Warum `can_apply` falsch ist, mit dem Befehl zum Kopieren; fehlt, wenn
  // es nichts zu sagen gibt.
  Diagnostic notice = 7;
  // Wie diese Installation ein Update bekommt.
  UpdateMethod method = 8;
  // Bei `UPDATE_METHOD_APT` und `UPDATE_METHOD_DNF` der feste Aufruf, den der
  // Client in der Sitzung des Menschen startet (`pkexec` braucht deren
  // Polkit-Agenten, den ein Dienst des Daemons nicht hat), ohne Shell; leer
  // sonst. `Apply` lehnt diese Wege ab.
  repeated string upgrade_command = 9;
}

// Woher eine Installation ihre Updates bekommt.
enum UpdateMethod {
  UPDATE_METHOD_UNSPECIFIED = 0;
  // macOS: das signierte Zip ersetzt `Humanitl.app` (`Apply`).
  UPDATE_METHOD_APP_BUNDLE = 1;
  // Linux, entpacktes Archiv in einem Ordner des Nutzers: das signierte
  // Archiv ersetzt den Ordner (`Apply`).
  UPDATE_METHOD_ARCHIVE = 2;
  // Linux, AppImage in einem Ordner des Nutzers: das signierte AppImage
  // ersetzt die Datei (`Apply`).
  UPDATE_METHOD_APPIMAGE = 3;
  // Paket aus dem apt-Repository: `upgrade_command` ueber pkexec.
  UPDATE_METHOD_APT = 4;
  // Paket aus dem dnf-Repository: `upgrade_command` ueber pkexec.
  UPDATE_METHOD_DNF = 5;
  // Kein Weg aus der App: AUR, ein Paket ohne Repository, kein pkexec, ein
  // Ordner ohne Schreibrecht. `notice` nennt den Befehl zum Kopieren.
  UPDATE_METHOD_MANUAL = 6;
}

// Abschnitte eines `Apply`.
enum UpdateStage {
  UPDATE_STAGE_UNSPECIFIED = 0;
  // Das Zip wird geladen; `done_bytes` von `total_bytes`.
  UPDATE_STAGE_DOWNLOADING = 1;
  // Entpacken, Signatur und Version des Buendels pruefen.
  UPDATE_STAGE_VERIFYING = 2;
  // Die alte App wird gegen die neue getauscht.
  UPDATE_STAGE_INSTALLING = 3;
}

// Wie weit ein `Apply` ist.
message UpdateProgress {
  UpdateStage stage = 1;
  uint64 done_bytes = 2;
  uint64 total_bytes = 3;
}

// Die neue App liegt an ihrem Platz.
message UpdateInstalled {
  // Die installierte Version.
  string version = 1;
  // Was die App neu startet: das Buendel (`/Applications/Humanitl.app`),
  // das Programm der App im Archiv-Ordner oder das AppImage.
  string app_path = 2;
}

// Ein Ereignis eines `Update`-Auftrags.
message UpdateEvent {
  oneof event {
    UpdateStatus status = 1;
    UpdateProgress progress = 2;
    UpdateInstalled installed = 3;
  }
}

// ---------- Pause des Abfangens (HUM-407) ----------

// Was `Intercept` tun soll.
message InterceptRequest {
  // Nur den Stand lesen.
  message Status {}
  // Das Abfangen pausieren. Eine laufende Pause behaelt ihren Beginn.
  message Pause {}
  // Das Abfangen wieder einschalten. Ohne Pause aendert sich nichts.
  message Resume {}
  oneof op {
    Status status = 1;
    Pause pause = 2;
    Resume resume = 3;
  }
}

// Der Stand des Abfangens.
message InterceptStatus {
  // Wahr, solange pausiert ist.
  bool paused = 1;
  // Seit wann pausiert ist; fehlt, solange abgefangen wird.
  google.protobuf.Timestamp paused_since = 2;
  // Wie viele Wechsel dieser Daemon schon gesehen hat: steigt mit jedem
  // Wechsel um eins, auch im Ereignis. Ein Client wendet einen Stand nur an,
  // wenn seine Revision nicht kleiner ist als die groesste, die er von diesem
  // Daemon kennt. Ein neuer Daemon (eine neue `Info.session_id`) beginnt bei
  // null.
  uint64 revision = 3;
  // Der Daemon, von dem dieser Stand stammt: derselbe Wert wie seine
  // `Info.session_id`, einmal beim Start vergeben. Eine Revision gilt nur
  // zusammen mit ihm; ein Stand eines anderen Daemons wird nie mit ihr
  // verglichen.
  string instance = 4;
}

// Warum eine Pause des Abfangens endete.
enum InterceptResumeReason {
  INTERCEPT_RESUME_REASON_UNSPECIFIED = 0;
  // Ein Mensch hat ueber den Socket wieder eingeschaltet.
  INTERCEPT_RESUME_REASON_REQUESTED = 1;
  // Ein neuer Lauf hat begonnen.
  INTERCEPT_RESUME_REASON_SESSION_STARTED = 2;
  // Der Daemon endet.
  INTERCEPT_RESUME_REASON_DAEMON_STOPPING = 3;
}

// ---------- Agent-Depot (HUM-518) ----------

// Auftrag an `Agents`. Genau eine Operation; jede antwortet mit dem Stand
// danach.
message AgentsRequest {
  // Nur den Stand lesen.
  message Status {}
  // `agents.<agent>.source` setzen: `host` oder `depot`.
  message SetSource {
    string agent = 1;
    string source = 2;
  }
  // Das Depot eines Agenten entfernen; die Quelle bleibt, wie sie ist.
  message Remove {
    string agent = 1;
  }
  // Installation oder Update in einem Wartungslauf (HUM-563): eine Sandbox
  // ohne Projekt, deren Netz nur die Hosts des Rezepts ohne Halt erreicht.
  // Die Antwort kommt, sobald der Lauf steht; `AgentDepot.maintenance` nennt
  // seine Sandbox, an deren Terminal sich ein Client haengt, und nach dem
  // Ende sein Ergebnis.
  message Maintain {
    string agent = 1;
    // Die verlangte Version; leer fuer die aktuelle des Anbieters.
    string version = 2;
  }
  // Ein Agent, fuer die Operationen um seine Konfiguration (HUM-520).
  message Agent {
    string agent = 1;
  }
  // Eine Callback-URL, die der Mensch aus der Adresszeile des Browsers
  // eingefuegt hat (HUM-520). Der Daemon nimmt genau
  // `http://localhost:<port><pfad>?<query>` des Adapters an und stellt sie
  // im laufenden Anmeldelauf an `127.0.0.1` zu, mit einem Prozess in der
  // Sandbox; es wird kein Port vom Host in die Sandbox weitergeleitet.
  message Callback {
    string agent = 1;
    string url = 2;
  }
  // `agents.encrypt_credentials` umschalten (HUM-523). Der Daemon
  // verschluesselt oder entschluesselt dabei jede vorhandene Zugangsdatei
  // des Depots, alles oder nichts, und schreibt den Wert erst danach in
  // `config.toml`. Ohne erreichbaren Schluesselbund lehnt er `true` mit
  // `AGENT_020` ab, ebenso eine Datei, die sich mit dem Schluessel nicht
  // oeffnen laesst; die Dateien bleiben dann, wie sie waren.
  message SetEncryption {
    bool enabled = 1;
  }
  oneof op {
    Status status = 1;
    SetSource set_source = 2;
    Remove remove = 3;
    // Die erste Installation; ein Depot mit Version lehnt ab (`AGENT_011`).
    Maintain install = 4;
    // Eine neue Version, oder zurueck auf eine, die das Depot noch haelt.
    Maintain update = 5;
    // Anmeldung in einem Wartungslauf mit dem Programm des Depots (HUM-520);
    // nur die vom Waechter gepruefte Zugangsdatei geht ins Depot. Die
    // Version bleibt leer. Antwort, sobald der Lauf steht.
    Maintain login = 6;
    // Konfigurationslauf (HUM-520): der Agent auf einer schreibbaren Kopie
    // seiner Konfiguration ohne Projekt; danach wartet die Aenderung auf
    // `config_accept` oder `config_discard`. Die Version bleibt leer.
    Maintain config = 7;
    // Die wartende Konfiguration uebernehmen, nach der Bestaetigung des
    // Menschen; ohne wartende Konfiguration `AGENT_019`.
    Agent config_accept = 8;
    // Die wartende Konfiguration verwerfen; `config/` bleibt.
    Agent config_discard = 9;
    // Den Stand von `config/` zeigen: `AgentDepot.config_files`.
    Agent config_show = 10;
    // Eine Callback-URL in den laufenden Anmeldelauf zustellen; eine andere
    // URL, ein Backend ohne eigenes Loopback oder kein laufender
    // Anmeldelauf ergeben `AGENT_014`.
    Callback deliver_callback = 11;
    // Die Verschluesselung der Zugangsdateien ein- oder ausschalten
    // (HUM-523). Ein Daemon vor Minor 56 antwortet mit `CONFIG_003`.
    SetEncryption set_encryption = 12;
  }
}

// Eine URL aus der Ausgabe eines Anmeldelaufs (HUM-520).
message AgentLoginUrl {
  // Die URL, wie der Agent sie ausgab.
  string url = 1;
  // Wahr nur fuer HTTPS zu einem Anmeldehost des Adapters, ohne Nutzerteil
  // und ohne anderen Port. Ein Client oeffnet sie auf dem Host nur nach
  // Klick oder Bestaetigung; jede andere URL zeigt er nur.
  bool openable = 2;
}

// Eine geaenderte Datei eines Konfigurationslaufs, oder eine Datei von
// `config/` fuer `config_show` (HUM-520).
message AgentConfigChange {
  // Der Pfad relativ zum Konfigurationsordner.
  string path = 1;
  // `added`, `changed` oder `removed`; fuer `config_show` immer `added`.
  string change = 2;
  // Die geaenderten Schluessel einer JSON-Datei, mit Punkten: zuerst alle,
  // die Befehle ausfuehren, dann hoechstens 50 weitere.
  repeated string keys = 3;
  // Die davon, die Befehle ausfuehren (Angabe des Adapters, fuer Claude
  // Code `hooks`, `apiKeyHelper`, `statusLine`, `mcpServers`, `env`); ein
  // Client hebt sie hervor. Nie gekuerzt; sie stehen auch in `keys` vorn.
  repeated string command_keys = 4;
  // Wie viele andere geaenderte Schluessel `keys` auslaesst.
  uint32 keys_omitted = 5;
}

// Der letzte Wartungslauf eines Agenten in diesem Daemon (HUM-563).
message AgentMaintenance {
  // Die Sandbox des Laufs; leer, wenn kein Lauf noetig war (die Version
  // lag schon im Depot).
  string sandbox_id = 1;
  // `install`, `update`, `login` oder `config`.
  string task = 2;
  // `running`, solange der Lauf geht; `done` nach der Uebernahme;
  // `failed`, wenn nichts uebernommen wurde; `confirm`, wenn ein
  // Konfigurationslauf auf die Bestaetigung wartet (HUM-520); `discarded`,
  // wenn der Mensch ihn verworfen hat (HUM-521). Nach einem Neustart des
  // Daemons nennt `confirm` eine Konfiguration, die noch auf der Platte
  // wartet, ohne Sandbox.
  string state = 3;
  // Die Version, die `current` nach dem Lauf nennt; leer davor und nach
  // einem Fehlschlag.
  string version = 4;
  // Die Version, die `current` davor nannte; leer bei der ersten
  // Installation.
  string previous = 5;
  // Was zu sagen ist: `AGENT_011` mit dem Schritt, der scheiterte, und die
  // Befunde des Laufs.
  repeated Diagnostic diagnostics = 6;
  // Die URLs, die ein Anmeldelauf bisher ausgab (HUM-520).
  repeated AgentLoginUrl login_urls = 7;
  // Wahr, wenn ein Client das Feld zum Einfuegen der Callback-URL zeigt:
  // der Adapter wartet auf einen Callback, und das Backend gibt der Sandbox
  // ein eigenes Loopback. Unter Seatbelt nie.
  bool callback_paste = 8;
  // Die Aenderungen eines Konfigurationslaufs im Zustand `confirm`, die auf
  // `config_accept` oder `config_discard` warten.
  repeated AgentConfigChange config_changes = 9;
}

// Der Stand eines Agenten im Depot.
message AgentDepot {
  // Kennung wie in `agents.<id>`, etwa `claude`.
  string agent = 1;
  // Der Name zur Anzeige, etwa `Claude Code`.
  string display_name = 2;
  // Die wirksame Quelle: `host` oder `depot`.
  string source = 3;
  // Woher sie kommt: `default`, `agents.source`, `agents.<id>.source` oder
  // `policy`.
  string origin = 4;
  // Die Vorgabe, die die Quelle sperrt; leer ohne Sperre.
  string locked_by = 5;
  // Wahr, wenn der Adapter ein Rezept fuer das Depot mitbringt.
  bool depot_supported = 6;
  // Die installierte Version aus `manifest.json`; leer, wenn keine.
  string version = 7;
  // Das Ergebnis der Signaturpruefung aus `manifest.json`.
  string signature = 8;
  // Wahr, wenn das Depot eine Zugangsdatei haelt.
  bool logged_in = 9;
  // Die letzte Rueckschrift der Zugangsdatei (HUM-520): Zeit in RFC 3339
  // und die Sitzung, die schrieb, als `<zeit> session <id>`; leer, wenn es
  // keine gab. Eine Ablehnung steht in `diagnostics` (`AGENT_012`,
  // `AGENT_016`).
  string last_writeback = 10;
  // Bytes aller Dateien des Depots.
  uint64 size_bytes = 11;
  // Wahr, solange die laufende Sitzung dieses Depot eingehaengt hat.
  bool in_use = 12;
  // Was zu sagen ist: Depot unbrauchbar (`AGENT_013`), nicht installiert
  // (`AGENT_008`), nicht angemeldet (`AGENT_009`), ohne Rezept (`AGENT_015`).
  repeated Diagnostic diagnostics = 13;
  // Der letzte Wartungslauf dieses Agenten in diesem Daemon (HUM-563);
  // fehlt, wenn es keinen gab.
  AgentMaintenance maintenance = 14;
  // Die Dateien von `config/` mit ihren Schluesseln, die Befehle
  // ausfuehren; nur in der Antwort auf `config_show` (HUM-520).
  repeated AgentConfigChange config_files = 15;
  // Die Versionen, die das Depot unter `program/` haelt, die neueste zuerst
  // (HUM-521). Ein Client bietet sie fuer ein Zurueck mit `update` an; die
  // installierte steht in `version`.
  repeated string versions = 16;
  // Was ein Client jetzt anbieten darf (HUM-521). Der Daemon entscheidet
  // es aus Rezept, Depot, Sperre und laufendem Wartungslauf; ein Client
  // schaltet seine Knoepfe danach und entscheidet nichts selbst. Fehlt bei
  // einem Daemon vor Minor 54: dann bietet ein Client nichts an.
  AgentActions actions = 17;
  // Der wirksame Wert von `agents.<id>.credential_writeback` (HUM-521),
  // so wie der Daemon ihn liest; geschrieben wird er ueber `SetConfig`.
  bool credential_writeback = 18;
  // Ob die Zugangsdatei im Depot verschluesselt liegt (HUM-523): wahr nur,
  // wenn eine da ist und jede verschluesselt ist. So steht es auf der
  // Platte, nicht in `config.toml`.
  bool credentials_encrypted = 19;
}

// Die Operationen, die `Agents` fuer einen Agenten jetzt annimmt (HUM-521).
// Ein falsches Feld verspricht nichts: der Daemon prueft jede Operation
// ohnehin selbst und lehnt mit einem Befund ab.
message AgentActions {
  // `install`: das Rezept bringt eine Installation mit, das Depot haelt
  // keine Version und ist nicht unbrauchbar, und der Daemon koennte jetzt
  // eine Sitzung starten (keine laeuft, kein Lauf geht).
  bool install = 1;
  // `update`, auch zurueck auf eine Version aus `versions`: wie `install`,
  // aber mit installierter Version.
  bool update = 2;
  // `login`: der Adapter erklaert Anmeldelauf und Format der Zugangsdatei,
  // eine Version liegt im Depot, eine Sitzung liesse sich starten.
  bool login = 3;
  // `config`: das Rezept besteht, eine Version liegt im Depot, eine Sitzung
  // liesse sich starten.
  bool config = 4;
  // `config_show`: eine Version liegt im Depot.
  bool config_show = 5;
  // `remove`: das Depot besteht, keine Sitzung und kein Lauf nutzt es; auch
  // fuer einen Agenten ohne Rezept.
  bool remove = 6;
  // `set_source` auf `host`: keine Firmenvorgabe sperrt die Quelle.
  bool source_host = 7;
  // `set_source` auf `depot`: immer, auch ohne Rezept (dann mit dem Hinweis
  // `AGENT_015`, und ein Start bricht damit ab).
  bool source_depot = 8;
}

// Der Stand aller bekannten Agenten, in der Reihenfolge von
// `agents.<id>`.
message AgentsStatus {
  repeated AgentDepot agents = 1;
  // Die Verschluesselung der Zugangsdateien (HUM-523). Fehlt bei einem
  // Daemon vor Minor 56; ein Client zeigt dann keinen Schalter.
  CredentialEncryption encryption = 2;
}

// Die Verschluesselung der Zugangsdateien des Depots (HUM-523,
// `agents.encrypt_credentials`): ChaCha20-Poly1305, der Schluessel nur im
// Schluesselbund des Systems.
message CredentialEncryption {
  // Ob die Dateien jetzt verschluesselt geschrieben werden, so wie das
  // Depot es auf der Platte sagt.
  bool enabled = 1;
  // Der Wert von `agents.encrypt_credentials` in `config.toml`. Weicht er
  // von `enabled` ab (eine Aenderung von Hand), zieht der naechste Start
  // einer Sitzung aus dem Depot ihn nach, und `diagnostics` sagt es.
  bool configured = 2;
  // Ob dieses System einen Schluesselbund hat, den der Daemon fragen kann
  // (`secret-tool` unter Linux, der Schluesselbund unter macOS). Ob er
  // antwortet, zeigt erst das Umschalten. Ohne ist der Schalter aus, und
  // `diagnostics` traegt `AGENT_020`.
  bool keyring = 3;
  // Befunde zur Verschluesselung: kein Schluesselbund, ein abweichender
  // Wert in `config.toml`.
  repeated Diagnostic diagnostics = 4;
}

// ---------- Projektregister (HUM-532) ----------

// Auftrag an `Projects`. Genau eine Operation.
message ProjectsRequest {
  // Eine Seite der bekannten Projekte, der juengste Start zuerst.
  message List {
    // Hoechstens so viele; 0 heisst 50, mehr als 500 gilt als 500.
    uint32 limit = 1;
    // `ProjectsResponse.next_cursor` der vorigen Seite; leer heisst von vorn.
    string cursor = 2;
  }
  // Ein Projekt, an seiner Kennung oder an seinem Ordner.
  message Get {
    // Die Kennung aus `ProjectEntry.project_id`; auch eine ersetzte Zeile.
    string project_id = 1;
    // Sonst der Ordner, absolut; der Daemon kanonisiert ihn und nimmt den
    // aktuellen Eintrag dort.
    string path = 2;
  }
  // Die Projektwahl eines aktuellen Eintrags ersetzen. Leere `values`
  // leeren sie.
  message SaveChoice {
    string project_id = 1;
    repeated ChoiceValue values = 2;
  }
  // Einen Aufraeumplan berechnen (HUM-533). Loescht nichts.
  message CleanupPlan {
    CleanupSelection selection = 1;
  }
  // Einen Plan ausfuehren: `selection` wie in `CleanupPlanView.selection`
  // zurueckgegeben, `digest` aus demselben Plan. Der Daemon berechnet den
  // Plan in der loeschenden Transaktion neu und loescht nur bei gleichem
  // Digest; sonst `SANDBOX_054`.
  message Cleanup {
    CleanupSelection selection = 1;
    string digest = 2;
  }
  // Der Startvorschlag fuer einen Ordner (HUM-536): jedes Feld des
  // Erststart-Bildschirms mit Optionen, Vorgabe, Verfuegbarkeit und Grund.
  // Speichert nichts; gespeichert wird mit `save_choice`.
  message Proposal {
    // Der Ordner, absolut; ein Ordner, den das Register nicht kennt, bekommt
    // die Vorgaben eines Starts ohne Projektwahl.
    string path = 1;
    // Sonst ein Projekt an seiner Kennung.
    string project_id = 2;
    // Eine Teilwahl ueber der gespeicherten Projektwahl, Schluessel fuer
    // Schluessel; ein leerer Wert nimmt den Schluessel aus der Wahl. Der
    // Vorschlag wird damit neu berechnet, ohne zu speichern.
    repeated ChoiceValue values = 3;
  }
  oneof op {
    List list = 1;
    Get get = 2;
    SaveChoice save_choice = 3;
    CleanupPlan cleanup_plan = 4;
    Cleanup cleanup = 5;
    Proposal proposal = 6;
  }
}

// Wessen Daten ein Aufraeumplan betrifft (HUM-533). Genau eine Auswahl:
// Projekte (`project_ids` oder `paths`), `all`, `unassigned` oder `forget`.
message CleanupSelection {
  // Projekte an ihrer Kennung, auch ersetzte.
  repeated string project_ids = 1;
  // Projekte an ihrem Ordner, absolut; der Plan gibt sie als `project_ids`
  // zurueck.
  repeated string paths = 2;
  // Jedes Projekt des Registers; was in Gebrauch ist, bleibt.
  bool all = 3;
  // Nur die Sitzungen ohne Projekt.
  bool unassigned = 4;
  // Projektwahl und Registereintrag dieses einen Projekts (Kennung).
  string forget = 5;
  // Nur, was aelter ist: Fluesse, die davor ankamen, und Wahl und Eintrag
  // von Projekten, deren letzter Start davor liegt. Der Plan rechnet
  // `older_than_days` in diesen Zeitpunkt um und gibt ihn zurueck.
  google.protobuf.Timestamp before = 6;
  uint32 older_than_days = 7;
  // Die wartenden Aenderungen einer Wegwerf-Sandbox gehoeren dazu; nur mit
  // dieser ausdruecklichen Wahl.
  bool include_waiting_changes = 8;
}

// Ein Eintrag eines Aufraeumplans.
message CleanupItem {
  // `recorded_flows`, `waiting_changes`, `project_choice` oder
  // `register_entry`; die Arten, die der Daemon kennt, stehen in
  // `CleanupPlanView.kinds`.
  string kind = 1;
  // Leer fuer die Sitzungen ohne Projekt.
  string project_id = 2;
  // Der Ordner des Projekts, gesaeubert fuer die Anzeige.
  string path = 3;
  // Ein Satz, was faellt.
  string description = 4;
  // Ungefaehr so viele Bytes werden frei (Zeilen und Body-Dateien).
  uint64 bytes = 5;
  // Wie viele Dinge fallen.
  uint64 count = 6;
  // Die Warnung, die jeder Client vor der Frage zeigt; bei
  // `waiting_changes`, dass nicht uebernommene Aenderungen endgueltig
  // verloren sind.
  string warning = 7;
}

// Ein Aufraeumplan.
message CleanupPlanView {
  repeated CleanupItem items = 1;
  // Bindet Identitaet und Fassung jedes Eintrags; `Projects.cleanup` nimmt
  // ihn zurueck.
  string digest = 2;
  // Die feste Zeile, was nie geloescht wird; jeder Client zeigt sie.
  string not_deleted = 3;
  // Die Auswahl in der Form, die `cleanup` zuruecknimmt.
  CleanupSelection selection = 4;
  // Was die Auswahl traefe, aber bleibt, je ein Satz.
  repeated string kept = 5;
  // Die Arten, die dieser Daemon kennt.
  repeated string kinds = 6;
}

// Was mit einem Eintrag geschah.
message CleanupOutcome {
  string kind = 1;
  string project_id = 2;
  string path = 3;
  bool deleted = 4;
  uint64 count = 5;
  uint64 bytes_freed = 6;
  // Warum nicht oder nicht ganz; leer, wenn alles fiel.
  string reason = 7;
}

// Das Ergebnis von `cleanup`.
message CleanupResult {
  repeated CleanupOutcome outcomes = 1;
  uint64 bytes_freed = 2;
  string not_deleted = 3;
}

// Ein Schluessel der Projektwahl mit seinem Wert als Text.
message ChoiceValue {
  string key = 1;
  string value = 2;
}

// Ein Eintrag des Registers.
message ProjectEntry {
  // Die stabile Kennung des Projekts (UUID).
  string project_id = 1;
  // Der kanonische Ordner auf dem Host, gesaeubert fuer die Anzeige.
  string path = 2;
  // Der Ordnername, gesaeubert fuer die Anzeige.
  string display_name = 3;
  google.protobuf.Timestamp first_seen = 4;
  // Leer fuer ein Projekt ohne Start seit dem Register.
  google.protobuf.Timestamp last_started = 5;
  // Der Agent-Adapter des letzten Starts.
  string last_agent = 6;
  uint64 runs = 7;
  // Wahr, solange die Sitzung dieses Daemons in diesem Projekt laeuft.
  bool running = 8;
  // Die Kennung dieser Sitzung (`Info.session_id`); leer ohne.
  string session_id = 9;
  // Wahr, wenn Aenderungen einer Wegwerf-Sandbox dieses Projekts auf eine
  // Entscheidung warten.
  bool changes_waiting = 10;
  // Wahr, wenn der Ordner fehlt.
  bool missing = 11;
  // Wahr fuer eine Zeile, die ein anderer Ordner am selben Pfad ersetzt hat.
  bool replaced = 12;
  // Ob eine Projektwahl gespeichert ist, und wann.
  bool has_choice = 13;
  google.protobuf.Timestamp choice_saved_at = 14;
  // Steigt bei jeder Aenderung des Eintrags (HUM-533 bindet sie).
  uint64 version = 15;
}

// Ein Schluessel der Projektwahl, wie er fuer dieses Projekt gilt.
message ProjectChoiceField {
  string key = 1;
  // Der gewaehlte Wert; leer, wenn die Wahl den Schluessel nicht traegt.
  string chosen = 2;
  // Der wirksame Wert als Text, nach allen Ebenen.
  string effective = 3;
  // Die Herkunft des wirksamen Werts wie in `FieldOrigin.origin`.
  string origin = 4;
}

// Antwort auf `Projects`.
message ProjectsResponse {
  // `list`: die Seite.
  repeated ProjectEntry projects = 1;
  // `list`: der Cursor der naechsten Seite; leer auf der letzten.
  string next_cursor = 2;
  // `get` und `save_choice`: das Projekt.
  ProjectEntry project = 3;
  // `get` und `save_choice`: jeder Schluessel der Liste mit Wahl, Wert und
  // Herkunft, in der Reihenfolge der Liste.
  repeated ProjectChoiceField choice = 4;
  // Was die Aufloesung fuer dieses Projekt zu sagen hat, etwa `CONFIG_024`
  // fuer eine gespeicherte Wahl, die nicht mehr gilt.
  repeated Diagnostic diagnostics = 5;
  // `cleanup_plan`: der Plan.
  CleanupPlanView plan = 6;
  // `cleanup`: was geloescht wurde.
  CleanupResult cleaned = 7;
  // `proposal`: der Startvorschlag.
  StartProposal proposal = 8;
}

// Der Startvorschlag fuer ein Projekt (HUM-536, ADR-0024 Punkt 3): alles,
// was der Erststart-Bildschirm zeigt, aus der Aufloesung, die ein Start
// jetzt bekaeme. Kein Client zeigt eine Option, die hier nicht steht.
message StartProposal {
  // Der kanonische Ordner, gesaeubert fuer die Anzeige.
  string path = 1;
  // Der Ordnername, gesaeubert fuer die Anzeige.
  string display_name = 2;
  // Die Kennung im Register; leer fuer einen Ordner, den es nicht kennt.
  string project_id = 3;
  // Ob das Register fuer das Projekt eine Projektwahl haelt.
  bool has_choice = 4;
  // Die Felder in der Reihenfolge des Bildschirms: `agent`, `folder_mode`,
  // `isolation`, `ask_mode`, `llm_server`, `profile`.
  repeated ProposalField fields = 5;
  // Die Wahl, die `save_choice` fuer genau die gezeigten Vorgaben nimmt:
  // je Feld die Paare der Vorgabe, ohne gesperrte Schluessel.
  repeated ChoiceValue choice = 6;
  // Die Zeile fuer den Weg ohne Bildschirm, beginnend mit `Defaults: `.
  string defaults_line = 7;
  // Was dem Start mit den Vorgaben im Weg steht oder zu sagen ist.
  repeated Diagnostic diagnostics = 8;
  // Der Hinweis auf Cloud-Inferenz (HUM-516) fuer Agent und Server der
  // Vorgabe; leer, wenn die Inferenz auf diesem Rechner bleibt.
  CloudInference cloud_inference = 9;
}

// Ein Feld des Startvorschlags.
message ProposalField {
  // `agent`, `folder_mode`, `isolation`, `ask_mode`, `llm_server` oder
  // `profile`.
  string id = 1;
  // Die Schluessel der Projektwahl, die das Feld schreibt.
  repeated string keys = 2;
  // Der Wert der Vorgabe, einer aus `options`; leer, wenn es keine gibt
  // (etwa kein gespeicherter Modellserver).
  string value = 3;
  // Die Herkunft der Vorgabe wie in `FieldOrigin.origin`.
  string origin = 4;
  // Gesetzt, wenn eine Firmenvorgabe einen Schluessel des Felds festlegt.
  SettingLock lock = 5;
  repeated ProposalOption options = 6;
}

// Eine Option eines Felds.
message ProposalOption {
  // Der Wert, etwa `disposable` oder `kernel`.
  string value = 1;
  // Der Name zur Anzeige, englisch.
  string label = 2;
  // Ob ein Start mit dieser Option ginge.
  bool available = 3;
  // Warum nicht; leer, wenn verfuegbar.
  repeated Diagnostic reasons = 4;
  // Die Paare fuer die Schluessel des Felds; ein Schluessel des Felds, der
  // hier fehlt, faellt aus der Wahl.
  repeated ChoiceValue choice = 5;
  // Nur `agent`: die wirksame Quelle, `host` oder `depot`.
  string source = 6;
  // Nur `agent`: beide Quellen mit Verfuegbarkeit und Grund.
  repeated AgentSourceOption sources = 7;
  // Nur `agent` und `llm_server`: der Hinweis auf Cloud-Inferenz mit
  // dieser Option.
  CloudInference cloud_inference = 8;
}

// Eine Quelle eines Agenten im Startvorschlag.
message AgentSourceOption {
  // `host` oder `depot`.
  string source = 1;
  // Ob das Programm dort bereitliegt.
  bool available = 2;
  // Warum nicht, oder was zu sagen ist (etwa nicht angemeldet).
  repeated Diagnostic reasons = 3;
  // Wahr fuer die wirksame Quelle (`agents.<id>.source`, Sperre).
  bool selected = 4;
}
