// Regeln als Wire-Typen (CONVENTIONS.md 3.3 und 4.3).
//
// Eigene Datei, weil Regeln sowohl im Regel-RPC als auch in `FixAction`,
// `DecideRequest.remember` und `DecideResponse.created_rule` vorkommen.
syntax = "proto3";

package humanitl.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "humanitl/v1/common.proto";

option java_multiple_files = true;

// Was mit einem passenden Request geschieht.
enum RuleAction {
  RULE_ACTION_UNSPECIFIED = 0;
  RULE_ACTION_ALLOW = 1;
  RULE_ACTION_BLOCK = 2;
  RULE_ACTION_ASK = 3;
  RULE_ACTION_REDACT = 4;
}

// Bedingung einer Regel. Leere Felder bedeuten "egal".
message RuleMatcher {
  // Label-Glob (`*` genau ein Label, `**` ein oder mehr Labels), oder ein
  // Literal in der Form `ip:192.168.1.50` bzw. `cidr:192.168.0.0/16`.
  string host = 1;
  // Leere Liste matcht jede Methode.
  repeated Method methods = 2;
  // Glob, oder Regex wenn der Wert mit `~` beginnt.
  string path = 3;
  Scheme scheme = 4;
  // 0 bedeutet "jeder Port".
  uint32 port = 5;
  Upgrade upgrade = 6;
  // Pfadpraefixe; eine leere Liste bedeutet "egal". Treffer, wenn der Pfad
  // (ohne Query) mit einem der Praefixe beginnt. Jeder Praefix beginnt mit `/`
  // und ist mindestens zwei Zeichen lang; ein Pfad mit einem `..`-Segment
  // trifft nie einen Praefix. Steht daneben auch `path`, muessen beide
  // zutreffen (HUM-039).
  repeated string path_prefixes = 7;
}

// Lebensdauer einer Regel.
message RuleExpiry {
  oneof expiry {
    // Gilt dauerhaft, wird in `rules.yaml` geschrieben.
    google.protobuf.Empty never = 1;
    // Gilt nur fuer die laufende Session, bleibt im Speicher.
    google.protobuf.Empty session = 2;
    // Gilt bis zu diesem Zeitpunkt.
    google.protobuf.Timestamp at = 3;
  }
}

// Eine Regel der geordneten Liste. First match wins; Session-Regeln werden
// vor persistenten Regeln ausgewertet (CONVENTIONS.md 4.5).
message Rule {
  // UUIDv7 als Text. Leer beim Anlegen, der Daemon vergibt sie.
  string rule_id = 1;
  RuleAction action = 2;
  RuleMatcher matcher = 3;
  RuleExpiry expires = 4;
  // Nur relevant fuer Bodies ueber dem Cap.
  bool stream = 5;
  // Flow, aus dem die Regel entstanden ist. Leer, wenn handgeschrieben.
  string created_from_flow_id = 6;
  // Mitgelieferte Regel aus `rules/default.yaml`. Nicht loeschbar.
  bool bundled = 7;
  string note = 8;
  google.protobuf.Timestamp created_at = 9;
  // Platz der Regel in ihrer eigenen Gruppe, 1-basiert: Session-Regeln,
  // dauerhafte Regeln und mitgelieferte Regeln sind drei geordnete Listen, und
  // eine Position zaehlt nur innerhalb einer davon (CONVENTIONS.md 4.5). In
  // einer Antwort setzt der Daemon den Wert; in `RulesRequest.add` ist er der
  // Wunsch des Clients, und 0 heisst "ans Ende".
  uint32 position = 10;
  // Wie oft die Regel seit dem Laden gegriffen hat.
  uint64 hit_count = 11;
  // Erlaubt Zieladressen in RFC-1918, Loopback, Link-Local und CGNAT.
  // Ohne dieses Flag lehnt der Proxy private Ziele ab (CONVENTIONS.md 4.10).
  bool allow_private = 12;
  // Abgeschaltet: die Regel bleibt in der Liste stehen und entscheidet nichts.
  // Nur mitgelieferte Regeln werden so aufgehoben; eine eigene Regel loescht
  // man. Der Zustand steht in der `rules.yaml` des Nutzers als Liste
  // `disabled_bundled` (HUM-038).
  bool disabled = 13;
  // Die erklaerte Durchreiche zum Sprachmodell: nicht gehalten, vollstaendig
  // aufgezeichnet, Funde warnen statt aufzuhalten (LLM_005). Nur zum Lesen.
  // Der Daemon setzt das Feld aus dem Agent-Adapter oder aus `rules.yaml`; in
  // einer Anfrage wird es ignoriert, denn ein Client, der sich eine
  // Durchreichregel anlegen koennte, koennte Verkehr an der Warteschlange und
  // an der voreingestellten Ansicht vorbeifuehren (HUM-039).
  bool passthrough_llm = 14;
}
